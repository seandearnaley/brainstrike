<!doctype html>
<html>
<head><meta charset="utf-8"><title>turso wasm write-volume probe</title></head>
<body>
<script type="module">
  // Mirrors packages/db insertMany transaction shape:
  // BEGIN; INSERT wide chunk row (RETURNING); DELETE gram/index rows;
  // INSERT content-index row; gram batches of 250x3 params; COMMIT.
  const params = new URLSearchParams(location.search);
  const payloadBytes = Number(params.get('bytes') ?? '3100');
  const autocheckpoint = params.get('autocheckpoint'); // pages, optional
  const preCheckpoint = params.get('precheckpoint');   // 'truncate'|'full'|'passive', optional
  const stepTimeoutMs = Number(params.get('timeout') ?? '30000');
  const noIndex = params.get('noindex') === '1';
  const noPk = params.get('nopk') === '1';
  const batchSize = Number(params.get('batch') ?? '250');

  const log = (...a) => {
    window.__log = (window.__log || []);
    window.__log.push(a.map(String).join(' '));
  };
  window.__done = false;
  window.__result = { payloadBytes, autocheckpoint, preCheckpoint };

  const withTimeout = (promise, ms, label) => {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error(`TIMEOUT: ${label}`)), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  };

  const buildContent = (bytes) => {
    const line = (i) =>
      `export const token_${i} = "bounded-batch-processing chunking-should-not-leak deterministic-import-flow ${i}";\n`;
    let out = '';
    let i = 0;
    while (out.length < bytes) {
      out += line(i);
      i += 1;
    }
    return out.slice(0, bytes);
  };

  // Exact mirror of createGrepContentIndexedGrams (widths 1..3, unique, sorted)
  const indexedGrams = (content, caseSensitive) => {
    const searchable = caseSensitive ? content : content.toLowerCase();
    const grams = new Set();
    for (let width = 1; width <= Math.min(3, searchable.length); width += 1) {
      for (let index = 0; index <= searchable.length - width; index += 1) {
        grams.add(searchable.slice(index, index + width));
      }
    }
    return [...grams].sort();
  };

  try {
    log('importing bundle...');
    const { connect } = await import('/turso/main.es.js');
    const db = await connect(`probe-${Date.now()}.db`);
    window.__result.open = 'ok';

    const exec = async (sql, bind) => {
      const st = await db.prepare(sql);
      try {
        if (bind && bind.length > 0) {
          await st.run(bind);
        } else {
          await st.run();
        }
      } finally {
        await st.close?.();
      }
    };
    const query = async (sql, bind) => {
      const st = await db.prepare(sql);
      try {
        return bind && bind.length > 0 ? await st.all(bind) : await st.all();
      } finally {
        await st.close?.();
      }
    };

    const jm = await query('PRAGMA journal_mode');
    window.__result.journalMode = JSON.stringify(jm);

    if (autocheckpoint) {
      const r = await query(`PRAGMA wal_autocheckpoint = ${Number(autocheckpoint)}`);
      window.__result.autocheckpointSet = JSON.stringify(r);
    }

    // Schema mirroring the shapes involved (wide chunk row + indexed sidecars)
    await exec(`CREATE TABLE file_chunks (
      id TEXT PRIMARY KEY,
      file_record_id TEXT NOT NULL,
      chunk_index INTEGER NOT NULL,
      content TEXT NOT NULL,
      content_hash TEXT NOT NULL,
      token_count INTEGER NOT NULL,
      chunk_type TEXT NOT NULL,
      chunk_size INTEGER NOT NULL,
      start_line INTEGER,
      end_line INTEGER,
      start_offset INTEGER,
      end_offset INTEGER,
      embedding BLOB,
      embedding_set_id TEXT,
      embedding_updated_at TEXT,
      embedding_hash TEXT,
      created_at TEXT NOT NULL,
      updated_at TEXT NOT NULL
    )`);
    await exec(`CREATE TABLE file_chunk_content_index (
      file_chunk_id TEXT PRIMARY KEY,
      normalized_content TEXT NOT NULL
    )`);
    await exec(`CREATE TABLE file_chunk_content_grams (
      file_chunk_id TEXT NOT NULL,
      case_sensitive INTEGER NOT NULL,
      gram TEXT NOT NULL${noPk ? '' : ',\n      PRIMARY KEY (file_chunk_id, case_sensitive, gram)'}
    )`);
    if (!noIndex) {
      await exec(
        'CREATE INDEX idx_file_chunk_content_grams_lookup ON file_chunk_content_grams (case_sensitive, gram, file_chunk_id)'
      );
    }
    window.__result.schema = 'ok';

    if (preCheckpoint) {
      const r = await query(`PRAGMA wal_checkpoint(${preCheckpoint.toUpperCase()})`);
      window.__result.preCheckpointRan = JSON.stringify(r);
    }

    const content = buildContent(payloadBytes);
    const grams = [
      ...indexedGrams(content, true).map((g) => [1, g]),
      ...indexedGrams(content, false).map((g) => [0, g]),
    ];
    window.__result.gramRows = grams.length;

    const now = new Date().toISOString();
    const chunkId = 'chunk-1';
    const startedAt = performance.now();

    const work = (async () => {
      await exec('BEGIN');
      const returned = await query(
        `INSERT INTO file_chunks (id, file_record_id, chunk_index, content, content_hash, token_count, chunk_type, chunk_size, created_at, updated_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
         ON CONFLICT (id) DO UPDATE SET content = excluded.content, updated_at = excluded.updated_at
         RETURNING id, content`,
        [chunkId, 'file-1', 0, content, 'hash-1', 100, 'code', payloadBytes, now, now]
      );
      log('chunk inserted, returned rows:', returned.length);
      await exec('DELETE FROM file_chunk_content_grams WHERE file_chunk_id = ?', [chunkId]);
      await exec('DELETE FROM file_chunk_content_index WHERE file_chunk_id = ?', [chunkId]);
      await exec(
        'INSERT INTO file_chunk_content_index (file_chunk_id, normalized_content) VALUES (?, ?)',
        [chunkId, content.toLowerCase()]
      );
      let batchesDone = 0;
      for (let i = 0; i < grams.length; i += batchSize) {
        const batch = grams.slice(i, i + batchSize);
        const values = batch.map(() => '(?, ?, ?)').join(', ');
        const bind = batch.flatMap(([cs, gram]) => [chunkId, cs, gram]);
        await exec(
          `INSERT INTO file_chunk_content_grams (file_chunk_id, case_sensitive, gram) VALUES ${values}`,
          bind
        );
        batchesDone += 1;
        window.__result.gramBatchesDone = batchesDone;
      }
      await exec('COMMIT');
      return 'committed';
    })();

    try {
      window.__result.tx = await withTimeout(work, stepTimeoutMs, `tx bytes=${payloadBytes}`);
      window.__result.txMs = Math.round(performance.now() - startedAt);
      const counts = await query('SELECT COUNT(*) AS c FROM file_chunk_content_grams');
      window.__result.gramCount = JSON.stringify(counts);
    } catch (e) {
      window.__result.tx = `ERROR: ${e?.message ?? e}`;
      window.__result.txMs = Math.round(performance.now() - startedAt);
    }

    try {
      await withTimeout(db.close(), 5000, 'close');
      window.__result.close = 'ok';
    } catch (e) {
      window.__result.close = `ERROR: ${e?.message ?? e}`;
    }
  } catch (e) {
    window.__result.fatal = `ERROR name=${e?.name} message=${e?.message ?? e} stack=${(e?.stack ?? '').slice(0, 600)}`;
  }
  window.__done = true;
</script>
</body>
</html>
