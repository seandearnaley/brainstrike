  - component_id: pkg-utils
    name: pkg-utils
    paths:
      - packages/utils/**
  - component_id: pkg-workers
    name: pkg-workers
    paths:
      - packages/workers/**

ignore:
  - "**/dist/**"
  - "**/__tests__/**"
  - "**/*.d.ts"
  - "**/vite.config.*"
  - "**/vitest.config.*"
