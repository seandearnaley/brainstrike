codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "0...100"
  status:
    # NEITHER Codecov status is a merge gate, and that is deliberate. The
    # repository ruleset requires exactly five contexts — Static, Unit, Build,
    # Web E2E, Desktop E2E — all produced by test.yml. `codecov/patch` is not
    # among them, so it never could block a merge; a failing one only rendered a
    # red X and an UNSTABLE merge box. This block used to claim "keep patch
    # coverage blocking instead", which contradicted both test.yml and
    # docs/agents/ci-quality.md and was simply false.
    #
    # `project: off` — PRs upload affected-only unit coverage, so a project-wide
    # delta is computed against a partial report and is meaningless here.
    #
    # `patch: informational` — Codecov's documented mechanism for "report the
    # number, never fail the status" (docs.codecov.com/docs/commit-status: the
    # status "will pass no matter what the coverage is"). target/threshold are
    # KEPT so the percentage is still computed and displayed; only the pass/fail
    # verdict is suppressed. Two independent reasons it must not gate:
    #   1. affected-only PR uploads make patch % systematically understated —
    #      measured on PR #2024, Codecov reported 27.86% where the changed files
    #      were 97-98% covered;
    #   2. a PR stacked on another branch has no BASE report, so Codecov cannot
    #      compare at all and says so ("Please upload report for BASE").
    #
    # The REAL threshold gate is nightly-coverage.yml -> `pnpm coverage:enforce`
    # (scripts/enforce-coverage.mjs), which runs full, unfiltered coverage with
    # ratcheted per-package thresholds and opens an issue on failure.
    #
    # Making patch blocking again is a two-part change, not a one-line edit: it
    # requires PR uploads to become complete AND the context added to the
    # ruleset. scripts/verify-codecov-status-contract.mjs enforces that pairing.
    project: off
    patch:
      default:
        informational: true
        target: 70%
        threshold: 0.5%

# Organize by workspace paths so Codecov shows per-package components.
component_management:
  individual_components:
  - component_id: apps-desktop
    name: apps-desktop
    paths:
      - apps/desktop/**
  - component_id: apps-web
    name: apps-web
    paths:
      - apps/web/**
  - component_id: pkg-app-shell
    name: pkg-app-shell
    paths:
      - packages/app-shell/**
