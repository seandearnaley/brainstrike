codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "0...100"
  status:
    # PRs currently upload affected-only unit coverage, so project-wide deltas
    # are not a reliable merge gate. Keep patch coverage blocking instead.
    project: off
    patch:
      default:
        target: 70%
        threshold: 0.5%

# Organize by workspace paths so Codecov shows per-package components.
component_management:
  individual_components:
  - component_id: apps-desktop
    name: apps-desktop
    paths:
      - apps/desktop/**
  - component_id: apps-web
    name: apps-web
    paths:
      - apps/web/**
  - component_id: pkg-app-shell
    name: pkg-app-shell
    paths:
      - packages/app-shell/**
  - component_id: pkg-build-utils
    name: pkg-build-utils
    paths:
      - packages/build-utils/**
  - component_id: pkg-config
    name: pkg-config
    paths:
      - packages/config/**
  - component_id: pkg-db
    name: pkg-db
    paths:
      - packages/db/**
  - component_id: pkg-embeddings
    name: pkg-embeddings
    paths:
      - packages/embeddings/**
  - component_id: pkg-file-explorer
    name: pkg-file-explorer
    paths:
      - packages/file-explorer/**
  - component_id: pkg-file-explorer-hooks
    name: pkg-file-explorer-hooks
    paths:
      - packages/file-explorer-hooks/**
  - component_id: pkg-file-explorer-ui
    name: pkg-file-explorer-ui
    paths:
      - packages/file-explorer-ui/**
  - component_id: pkg-file-import
    name: pkg-file-import
    paths:
      - packages/file-import/**
  - component_id: pkg-file-system
    name: pkg-file-system
    paths:
      - packages/file-system/**
  - component_id: pkg-fonts
    name: pkg-fonts
    paths:
      - packages/fonts/**
  - component_id: pkg-hooks
    name: pkg-hooks
    paths:
      - packages/hooks/**
  - component_id: pkg-platform-utils
    name: pkg-platform-utils
    paths:
      - packages/platform-utils/**
  - component_id: pkg-server-config
    name: pkg-server-config
    paths:
      - packages/server-config/**
  - component_id: pkg-storage
    name: pkg-storage
    paths:
      - packages/storage/**
  - component_id: pkg-tailwind-config
    name: pkg-tailwind-config
    paths:
      - packages/tailwind-config/**
  - component_id: pkg-test-utils
    name: pkg-test-utils
    paths:
      - packages/test-utils/**
  - component_id: pkg-tsconfig
    name: pkg-tsconfig
    paths:
      - packages/tsconfig/**
  - component_id: pkg-types
    name: pkg-types
    paths:
      - packages/types/**
  - component_id: pkg-ui
