# lefthook.yml
pre-commit:
  parallel: false
  commands:
    biome:
      # {staged_files} expands to the list of staged files; Biome will ignore unknown types
      # run: pnpm exec biome check --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      # Automatically apply safe fixes during pre-commit:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    
    type-check:
      # Only check packages with staged TypeScript files (canonical pattern)
      # Uses git diff to find changed packages, then runs type-check only on those
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm turbo run type-check --filter="[HEAD]"

commit-msg:
  commands:
    lint-msg:
      run: pnpm exec commitlint --edit {1}
