# lefthook.yml
pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob: 
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
  parallel: true
  commands:
    secrets-scan:
      run: pnpm secrets:scan:staged
    type-check:
      # Only check packages with staged TypeScript files (canonical pattern)
      # Uses git diff to find changed packages, then runs type-check only on those
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm turbo run type-check --filter="[HEAD]"

commit-msg:
  commands:
    lint-msg:
      run: pnpm exec commitlint --edit {1}
