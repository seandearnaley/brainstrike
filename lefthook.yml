# lefthook.yml
#
# 2026-05-18 hardening (PR #1007 follow-up): three root causes of the hook
# appearing to hang on commits were identified and fixed here.
#
# 1. `pnpm dlx ultracite fix` re-downloads ultracite from npm on every
#    commit when pnpm's dlx cache misses. On a cold cache that can take
#    minutes. Ultracite is already in root devDependencies (v7.6.0), so
#    `pnpm exec ultracite fix` uses the local install — sub-second startup
#    instead of an npm round-trip.
# 2. `pnpm dlx ultracite fix` with no file arg scans the entire workspace
#    (2062 files in this repo) every commit. Passing `{staged_files}`
#    via lefthook's template makes it scan only the staged files — about
#    1 second per typical commit instead of 10+ seconds.
# 3. Mixing `jobs:` (1.7+ format) with `commands:` (legacy format) under
#    the same hook produced unusual scheduling. Unified on `jobs:` so the
#    parallel/sequencing semantics are well-defined.
#
# `pnpm exec` is the deliberate choice over `pnpm dlx` for every tool here:
# if a tool isn't in the workspace deps, we WANT the commit to fail loudly
# rather than silently fetch an unpinned version from the registry.

#
# The pre-commit run uses biome.base.json, which is biome.json minus the
# type-aware and project rules (noFloatingPromises, noUnresolvedImports,
# useExhaustiveSwitchCases...). Enabling any of those makes Biome index the
# whole repo and node_modules before checking even one file: about 6 s per
# commit, against under 1 s without them. `biome check .` in `pnpm check` and
# CI Static still loads biome.json, which extends the base and adds those
# rules back, so the policy is unchanged; only the commit hook skips them.
# Biome does not follow an extended file's own `extends`, which is why
# biome.json repeats the two ultracite presets ahead of the base.

pre-commit:
  parallel: true
  jobs:
    - name: ultracite-fix
      run: pnpm exec ultracite fix --config-path=biome.base.json {staged_files}
      glob:
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - "*.jsx"
        - "*.ts"
        - "*.mts"
        - "*.cts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
    - name: secrets-scan
      run: pnpm secrets:scan:staged

commit-msg:
  jobs:
    - name: lint-msg
      run: pnpm exec commitlint --edit {1}
