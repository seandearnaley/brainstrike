# Mergify's merge queue lands every pull request on main (BST-2188, owner
# decision 2026-10-19). A ready PR queues itself (merge_protections_settings
# below); queue any other by commenting `@mergifyio queue` on it.
#
# Mergify builds each batch on main, pushes it to a branch under
# queue_branch_prefix and opens a draft PR for it. That push runs
# .github/workflows/merge-queue.yml, and the batch's PRs are squashed onto main
# only when its Merge Queue Gate succeeded. The ruleset on main requires the
# same gate and lets only Mergify bypass it, so nothing lands any other way.

merge_queue:
  # Three batches under test at once: each later batch is built speculatively
  # on the ones ahead of it, so a queued PR no longer waits out a whole gate
  # before its own starts. Its affected Unit selection diffs from main's tip
  # (the merge base), so it also runs the batches ahead's tests: a superset,
  # never fewer. A red batch reruns only the batches built on it.
  max_parallel_checks: 3

# Queue each pull request once it matches these conditions and passes the merge
# protections below, without anyone ticking Mergify's box. This needs Merge
# Protections activated for the repository in Mergify's dashboard (done
# 2026-10-28). Drafts stay out, so a draft is how a PR is held back. Fork PRs
# stay out because the gate runs their code with this repository's secrets;
# queue those by hand after reading them.
merge_protections_settings:
  auto_merge_conditions:
    - -draft
    - -from-fork

# Review findings are addressed before a PR merges (owner decision 2026-10-30).
# A PR queues only once CodeRabbit approved it (queue_conditions below) and
# every thread is resolved, and Mergify merges nothing while a thread is open,
# so a thread posted after the PR queued holds it too. Thread counts are read on the
# PR itself, not on the batch draft. The Mergify Merge Protections check on the
# PR names the rule it waits for.
merge_protections:
  - name: Review threads resolved
    description: >-
      Every review thread, from CodeRabbit, Codex or a person, is resolved:
      fixed by a push, or answered and resolved. A reply alone does not resolve it.
    if:
      - base = main
    success_conditions:
      - "#review-threads-unresolved = 0"

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      # The review gates entry, not merge. Mergify evaluates a merge
      # condition's checks on the batch's draft PR, where the review never runs,
      # so a merge protection on it dequeued every batch (#4859, batch draft
      # #4860). Queue conditions are read on the PR's own head, for automatic
      # entry and for `@mergifyio queue` or the checkbox alike.
      # CodeRabbit approves only once the latest commit has a completed review
      # and none of its threads is open (.coderabbit.yaml), and the default
      # ruleset dismisses approvals on push, so an approval always covers the
      # head; its `CodeRabbit` check must also have finished there. Bot PRs
      # (Renovate's) and fork PRs never wait for it; a fork is queued by hand
      # only after it has been read (above).
      - or:
          - and:
              - approved-reviews-by = coderabbitai[bot]
              - check-success = CodeRabbit
          - author ~= \[bot\]$
          - from-fork
    merge_conditions:
      - check-success = @github-actions/Merge Queue Gate
    # The ruleset's required Merge Queue Gate never reports on a PR head, so
    # Mergify must judge it on the batch only, not at queue entry.
    branch_protection_injection_mode: merge
    batch_size: 5
    # Most batches hold one PR, so the default 30 s wait for more only delays
    # them. A PR queued after the wait forms the next batch, which is checked
    # speculatively beside the one ahead.
    batch_max_wait_time: 5 seconds
    merge_method: squash
    # merge-queue.yml triggers on pushes under this prefix.
    queue_branch_prefix: mergify/merge-queue/
    # Mergify must not dequeue a batch before GitHub's own job timeouts decide
    # it. The longest chain of job timeouts up to and including the gate is
    # 65 minutes: admission 5, Static 20, a Unit shard 30, Unit 5 and Merge
    # Queue Gate 5. GitHub
    # documents no runner pickup time, so allow 2 minutes per job: 65 + 5 x 2 =
    # 75. Not `auto`: it applies no timeout until the queue has about 20
    # qualifying runs in seven days.
    checks_timeout: 75 min
