# Mergify's merge queue lands every pull request on main (BST-2188, owner
# decision 2026-10-19). Every ready pull request is queued on its own; a draft
# stays out until it is marked ready.
#
# Mergify builds each batch on main, pushes it to a branch under
# queue_branch_prefix and opens a draft PR for it. That push runs
# .github/workflows/merge-queue.yml, and the batch's PRs are squashed onto main
# only when its Merge Queue Gate succeeded. The ruleset on main requires the
# same gate and lets only Mergify bypass it, so nothing lands any other way.

merge_queue:
  # Three batches under test at once: each later batch is built speculatively
  # on the ones ahead of it, so a queued PR no longer waits out a whole gate
  # before its own starts. Its affected Unit selection diffs from main's tip
  # (the merge base), so it also runs the batches ahead's tests: a superset,
  # never fewer. A red batch reruns only the batches built on it.
  max_parallel_checks: 3

queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = @github-actions/Merge Queue Gate
    # The ruleset's required Merge Queue Gate never reports on a PR head, so
    # Mergify must judge it on the batch only, not at queue entry.
    branch_protection_injection_mode: merge
    batch_size: 5
    # Most batches hold one PR, so the default 30 s wait for more only delays
    # them. A PR queued after the wait forms the next batch, which is checked
    # speculatively beside the one ahead.
    batch_max_wait_time: 5 seconds
    merge_method: squash
    # merge-queue.yml triggers on pushes under this prefix.
    queue_branch_prefix: mergify/merge-queue/
    # Mergify must not dequeue a batch before GitHub's own job timeouts decide
    # it. The longest chain of job timeouts up to and including the gate is
    # 65 minutes: admission 5, Static 20, a Unit shard 30, Unit 5 and Merge
    # Queue Gate 5. GitHub
    # documents no runner pickup time, so allow 2 minutes per job: 65 + 5 x 2 =
    # 75. Not `auto`: it applies no timeout until the queue has about 20
    # qualifying runs in seven days.
    checks_timeout: 75 min

pull_request_rules:
  # Queue every ready PR (owner decision 2026-10-28), so opening a PR or
  # marking it ready does not wait for someone to tick Mergify's box. A PR from
  # a fork stays out: its code would run in the queue with this repository's
  # secrets, which only a collaborator's queue command allowed.
  - name: queue ready pull requests
    conditions:
      - base = main
      - -draft
      - -from-fork
    actions:
      queue:
