<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>BrainStrike Desktop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #nextjs-container {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <base href="file:///"/>
</head>
<body>
  <iframe id="nextjs-container"></iframe>
  <script>
    // Use absolute path for iframe src
    const path = require('path');
    const fs = require('fs');
    const iframe = document.getElementById('nextjs-container');
    
    // Set iframe src with absolute file path
    const nextAppDir = path.resolve(__dirname, '../next-app/out');
    const indexPath = path.join(nextAppDir, 'index.html');
    
    // Check if the file exists before setting the src
    if (fs.existsSync(indexPath)) {
      console.log('Loading Next.js app from:', indexPath);
      iframe.src = `file://${indexPath}`;
    } else {
      console.error('Next.js index file not found at:', indexPath);
      document.body.innerHTML = `
        <div style="color: red; padding: 20px;">
          <h1>Error Loading Application</h1>
          <p>Could not find Next.js app at: ${indexPath}</p>
          <p>Please ensure the Next.js app has been built correctly.</p>
        </div>
      `;
    }
    
    iframe.addEventListener('load', () => {
      console.log('Next.js app loaded in iframe');
    });
    
    // Handle iframe load errors
    iframe.addEventListener('error', () => {
      console.error('Failed to load Next.js app in iframe');
    });
    
    // Log any errors
    window.addEventListener('error', (event) => {
      console.error('Error occurred:', event.error);
    });
  </script>
</body>
</html>
