packages:
  - apps/*
  - packages/*
  - packages/config/*
catalogMode: strict
cleanupUnusedCatalogs: true
# NOTE: react and react-dom are deliberately NOT catalogued — see the `overrides`
# block below, which is their SINGLE governor. A bare override SHADOWS a catalog
# entry completely: measured live, with `overrides: react: ^19.2.4` in place a
# `catalog: react: ^19.9.9` (a version that does not exist) still installs clean
# and resolves 19.2.7, and the lockfile's `catalogs: default:` block omits react
# entirely. Such an entry governs nothing and rots silently the moment the
# override is bumped. The override has to stay because it also constrains the
# ~157 third-party packages that depend on react/react-dom directly — transitive
# scope a catalog does NOT have, and what guarantees ONE react instance.
# scripts/verify-catalog-references.mjs enforces this "never both" rule.
#
# Comments must stay at column 0: `cleanupUnusedCatalogs: true` lets pnpm rewrite
# this file, and a rewrite DELETES comments indented inside the catalog: block
# (verified). Column-0 comments above a block survive.
catalog:
  '@parcel/watcher': ^2.5.6
  '@playwright/test': ^1.61.1
  '@tanstack/react-virtual': ^3.14.6
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^26.1.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/ui': ^4.1.10
  electron: ^43.1.1
  happy-dom: ^20.10.6
  jsdom: 29.1.1
  playwright: ^1.61.1
  react-router-dom: ^7.18.1
  tsup: ^8.5.1
  typescript: ^6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10
  zustand: ^5.0.14
overrides:
  react: ^19.2.4
  react-dom: ^19.2.4
  react-helmet-async>react: ^19.0.0
  react-helmet-async>react-dom: ^19.0.0
allowBuilds:
  '@brainstrike/secure-fs-native': true
  '@biomejs/biome': false
  '@jacobwolf/biome-unnecessary-effect': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: false
  lefthook: true
  node-pty: true
  onnxruntime-node: true
  oxc-resolver: true
  protobufjs: true
  puppeteer: true
  sharp: true
  '@parcel/watcher': false
# These two exact versions are pinned exceptions to any future minimumReleaseAge
# policy: @mastra/memory@1.22.1's tool-approval 'output-denied' state handling
# (the fix this repo's upgrade specifically needed, see docs/dependency-updates-
# breaking-changes.md) shipped alongside @mastra/core@1.50.0,
# published <24h before this pin. Verified via npm registry metadata: both carry
# GitHub Actions OIDC provenance from the canonical mastra-ai/mastra repo, a
# maintainer list consistent with prior releases, and match the 'latest' dist-tag.
# Remove this exclude once these versions age past whatever minimumReleaseAge
# floor is configured (none is configured today, so this is currently a no-op).
minimumReleaseAgeExclude:
  - '@mastra/core@1.50.0'
