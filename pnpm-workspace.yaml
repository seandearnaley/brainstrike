  '@huggingface/transformers@4.3.0': patches/@huggingface__transformers@4.3.0.patch
  '@mastra/core@1.71.0': patches/@mastra__core@1.71.0.patch
  '@mastra/memory@1.32.1': patches/@mastra__memory@1.32.1.patch
