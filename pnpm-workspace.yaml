packages:
  - apps/*
  - packages/*
  - packages/config/*
catalogMode: strict
cleanupUnusedCatalogs: true
# NOTE: react and react-dom are deliberately NOT catalogued — see the `overrides`
# block below, which is their SINGLE governor. A bare override SHADOWS a catalog
# entry completely: measured live, with `overrides: react: ^19.2.4` in place a
# `catalog: react: ^19.9.9` (a version that does not exist) still installs clean
# and resolves 19.2.7, and the lockfile's `catalogs: default:` block omits react
# entirely. Such an entry governs nothing and rots silently the moment the
# override is bumped. The override has to stay because it also constrains the
# ~157 third-party packages that depend on react/react-dom directly — transitive
# scope a catalog does NOT have, and what guarantees ONE react instance.
# scripts/verify-catalog-references.mjs enforces this "never both" rule.
#
# Comment placement — RE-MEASURED 2026-08-15 on pnpm 11.15.0 (BST-1311). An
# indented comment inside the catalog: block SURVIVES a pnpm rewrite. Measured by
# adding a catalog entry no package references, which forces cleanupUnusedCatalogs
# to act: pnpm pruned that entry and left an indented comment above a different
# entry untouched. This SUPERSEDES an earlier note here that said such comments
# are deleted — whatever pnpm did when that was written, this pnpm does not.
# Two caveats before relying on it: pnpm only rewrites when an install actually
# re-resolves (an "Already up to date" install leaves the file alone, and does not
# prune either), and a comment attached to an entry that is itself pruned has no
# measured verdict — so keep rationale beside entries that stay.
catalog:
  # ADR-0012: only the new host consumes this pin; the legacy Mastra closure retains ai 6.
  ai: 7.0.126
  vscode-jsonrpc: 9.0.2
  '@ai-sdk/amazon-bedrock': 5.0.76
  '@anthropic-ai/sandbox-runtime': 0.0.75
  # BST-1353: the AWS default credential chain (profiles, SSO, process creds,
  # instance/container roles) behind Bedrock's `credentialProvider` seam.
  # Node-only — imported ONLY beside the provider factory, never from the
  # browser-safe/hosted-web agent subpaths (verify-hosted-web-bundle.mjs).
  '@aws-sdk/credential-providers': 3.1127.0
  '@assistant-ui/react': '~0.15.18'
  '@assistant-ui/react-streamdown': 0.3.17
  '@assistant-ui/styles': ^0.3.7
  # BST-1427: gitignore semantics for the workspace walk. The de-facto Node
  # implementation (eslint/prettier/lint-staged/globby all use it); already
  # present transitively, promoted to a direct dep so the walk can rely on it.
  '@babel/core': ^8.0.1
  '@codemirror/state': ^6.7.4
  # ADR-0004: the Effect language service on TypeScript 7. Run in dedicated
  # `effect-tsgo diagnostics` mode from each Effect package's type-check, never
  # `effect-tsgo patch`: patch rewrites the shared `tsc`, and the `typescript`
  # entry below is TypeScript 6, which this tool does not support. That is why
  # the second type-check stands; see docs/agents/effect-boundary.md.
  # Exact pin: its supported TypeScript list moves with every release (0.52.0
  # supports 7.0.2 and 7.1.0-dev, matching the `@typescript/native` alias).
  '@effect/tsgo': 0.52.0
  '@electric-sql/pglite': 0.5.8
  '@electric-sql/pglite-pg_textsearch': 0.0.10
  '@electric-sql/pglite-pgvector': 0.0.9
  # BST-1939: the native grep trigram planner parses the JS regex AST. Already
  # resolved through eslint; promoted to a direct dependency of @brainstrike/utils.
  '@eslint-community/regexpp': 4.12.2
  '@fontsource-variable/geist': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@huggingface/transformers': ^4.3.0
  '@mastra/schema-compat': 1.3.11
  # GHSA-6qxp-vccf-f47h / CVE-2026-104850 (HIGH, CVSS 7.5): in 2.0.0-2.1.0 the
  # MCP *server* chose which authorization server received a stored
  # `refresh_token` or `client_secret`, because saved credentials carried no
  # binding to the server that issued them. 2.2.0 stamps the issuing
  # authorization server onto every saved credential and refuses to send it
  # anywhere else; 2.3.1 is the head of that patched line. Reachable here
  # through the Streamable HTTP / SSE `authProvider` in
  # packages/agent/src/mcp/explicit-http-transport.ts.
  #
  # LOCKSTEP, exact pins: `client`, `server` and `server-legacy` each depend on
  # `core` at an EXACT version, so a split bump resolves two copies of the
  # protocol schema. `node` has no 2.3.x release; 2.1.1 is its head and
  # peer-depends on `server` at ^2.3.0, so it moves with them.
  '@modelcontextprotocol/client': 2.3.1
  '@modelcontextprotocol/core': 2.3.1
  '@modelcontextprotocol/node': 2.1.1
  '@modelcontextprotocol/server': 2.3.1
  '@modelcontextprotocol/server-legacy': 2.3.1
  # BST-1940: SHA-256 for the derived indexer where Node's crypto is absent (the
  # browser writer); packages/indexer/src/portable.ts uses node:crypto when present.
  '@noble/hashes': 2.4.0
  '@openrouter/ai-sdk-provider': 2.10.0
  '@parcel/watcher': ^2.6.0
  '@playwright/test': 1.63.0
  '@radix-ui/react-accordion': ^1.2.20
  '@radix-ui/react-checkbox': ^1.3.11
  '@radix-ui/react-dialog': ^1.1.23
  '@radix-ui/react-scroll-area': ^1.2.18
  '@radix-ui/react-tabs': ^1.1.21
  '@radix-ui/react-toast': ^1.2.23
  '@shikijs/langs': ^4.4.3
  '@shikijs/themes': ^4.4.3
  '@smithy/eventstream-codec': ^4.5.2
  '@smithy/util-utf8': ^4.5.2
  # BST-1940: the official SQLite WASM build for the browser state writer
  # (@brainstrike/web-state-store). Exact pin. The web app does not run on it yet: up to
  # 3.53.4, a failed opfs-sahpool init removes the whole pool (upstream check-in
  # ad1bbfc2bd adds preserveOnInitFailure in 3.54), and the owner gated shipping on that fix.
  '@sqlite.org/sqlite-wasm': 3.53.4-build2
  # LOCKSTEP: typescript-checker and vitest-runner peer-depend on
  # `@stryker-mutator/core` at an EXACT version ("10.0.0"), never a range, so the
  # `^` below is looser than what the plugins actually accept. Bump all four in
  # one change. A desync does NOT fail the install — strict-peer-dependencies is
  # off, so pnpm only warns, and Stryker then dies at plugin load the next time
  # someone runs `pnpm mutation`. See BST-1287.
  '@stryker-mutator/api': ^10.0.0
  '@stryker-mutator/core': ^10.0.0
  '@stryker-mutator/typescript-checker': ^10.0.0
  '@stryker-mutator/vitest-runner': ^10.0.0
  '@tailwindcss/typography': ^0.5.20
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^9.2.4
  '@tanstack/react-virtual': ^3.14.11
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  # BST-1920: types for better-sqlite3 (13.x ships none). Exact pin on the newest
  # published release (9.6.0, 2026-08-01); DefinitelyTyped majors do not track the
  # runtime's. `Database.Options` and `loadExtension(path)` type-check against
  # better-sqlite3 13.0.3 (packages/sqlite-native `tsc` and its type-check).
  '@types/better-sqlite3': 9.6.0
  '@types/node': ^24.13.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@typescript/native': 'npm:typescript@7.0.2'
  '@typescript/old': 'npm:typescript@6.0.3'
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser-playwright': ^5.0.2
  '@vitest/coverage-v8': ^5.0.2
  '@vitest/ui': ^5.0.2
  assistant-stream: 0.3.41
  # BST-1920: the SQLite state/index engine. Exact pin. It ships a PREBUILT
  # `prebuilds/<platform>-<arch>.node` for every release target and must never
  # be compiled: `allowBuilds` DENIES it (see below) and electron-builder runs
  # with `npmRebuild: false`. packages/sqlite-native owns the load path and the
  # provenance smoke.
  better-sqlite3: 13.0.3
  bindings: 1.5.0
  concurrently: ^10.0.6
  drizzle-orm: 0.45.2
  # ADR-0004: Effect v4 is an LTS line, with fixes committed through September
  # 2029. The pin stays EXACT: `^4.0.0` constraints elsewhere in the ecosystem
  # reject rc builds, so a range here would have silently re-resolved the whole
  # tree the moment 4.0.0 shipped. Stability is now a `@stability` JSDoc tag per
  # API, not a path segment, so an exact pin is what makes an unstable-API
  # change reviewable. docs/agents/effect-boundary.md.
  effect: 4.0.4
  # Chromium security patches only. Stay on the 44 line: Electron 45 is a
  # separate, reviewed decision, not a security bump.
  electron: ^44.7.2
  esbuild: ^0.28.2
  eslint-plugin-react-refresh: ^0.5.6
  fake-indexeddb: ^6.2.5
  glob: ^13.0.6
  happy-dom: ^20.14.0
  idb: ^8.0.4
  ignore: 7.0.12
  jsdom: 30.0.1
  jszip: ^3.10.2
  knip: ^6.34.0
  lucide-react: ^1.41.0
  mermaid: ^11.17.1
  minimatch: ^10.2.6
  node-addon-api: 8.9.2
  node-gyp: 13.0.2
  oxc-parser: ^0.144.0
  # BST-1659: optional peer of @vitejs/plugin-react and the ONLY backend its
  # `react({ compiler: <options> })` plugin has — it imports this package and hard-errors
  # when it is missing. Both apps pass an options object rather than `true`.
  oxc-transform-react: ^0.148.0
  pino: ^10.4.0
  playwright: 1.63.0
  react-hotkeys-hook: ^5.3.3
  react-resizable-panels: ^4.12.3
  react-router-dom: ^7.18.3
  react-shiki: ^0.11.1
  remark-gfm: ^4.0.1
  shiki: ^4.4.3
  # BST-1920: loadable vec0 extension; one optional package per platform
  # (sqlite-vec-<os>-<arch>). Exact pin; resolved through app.asar.unpacked.
  sqlite-vec: 0.1.9
  # BST-1929: the version @assistant-ui/react-streamdown renders with (pinned by
  # the override below). A direct dependency only so Tailwind's @source can scan
  # its dist for the utility classes it ships.
  streamdown: 2.6.0
  tailwindcss: ^4.3.3
  tiktoken: ^1.0.22
  tsup: ^8.5.1
  typescript: 'npm:@typescript/typescript6@6.0.2'
  # 8.3.3 fixes three dev-server advisories (GHSA-rq7h-c2jc-7f22,
  # GHSA-vfpm-58rq-9qcg, GHSA-9jrq-w75r-8gcw); 8.3.4 is the current patch.
  vite: ^8.3.4
  vite-plugin-static-copy: ^4.1.1
  vite-plugin-top-level-await: ^1.6.0
  vite-plugin-wasm: ^3.6.0
  vitest: ^5.0.2
  workerpool: ^10.0.3
  xxhash-wasm: ^1.1.0
  yaml: ^2.9.1
  zod: ^4.6.5
  zustand: ^5.0.15
overrides:
  # BST-1929: hold react-streamdown's own dependencies at the newest releases at
  # least 14 days old when it was added, so the lockfile has one react-markdown
  # wrapper, one streamdown (the catalog pin that Tailwind's @source scans) and
  # one remend (streamdown pins 1.3.1 exactly). Retire these edges with the next
  # @assistant-ui/react-streamdown bump.
  '@assistant-ui/react-streamdown@0.3.17>@assistant-ui/react-markdown': 0.14.17
  '@assistant-ui/react-streamdown@0.3.17>remend': 1.3.1
  '@assistant-ui/react-streamdown@0.3.17>streamdown': 2.6.0
  # BST-875: Drizzle's published CLI/API use tsx, never its deprecated loader.
  # Retire on owner update; do not reintroduce the unused esbuild 0.18 subtree.
  'drizzle-kit@0.31.10>@esbuild-kit/esm-loader': '-'
  'drizzle-kit@0.31.10>tsx': 4.23.12
  # Vercel pins the same older tsx copy; include those edges in the full graph.
  '@vercel/backends@0.8.30>tsx': 4.23.12
  '@vercel/node@5.9.3>tsx': 4.23.12
  # 0.28.2 retains tsup's build/context/plugin APIs; real owner builds guard it.
  # Remove when tsup admits a release clearing GHSA-g7r4-m6w7-qqqr itself.
  'tsup@8.5.1>esbuild': 0.28.2
  # BST-888: v11 keeps the plugin's CommonJS v5 API and patches bounds checks.
  # v1/v7 state changes are unused here; remove when this owner admits >=11.1.1.
  'vite-plugin-top-level-await@1.6.0>uuid': 11.1.1
  # BST-874: compatible patches for all installed brace-expansion majors.
  # Remove when every minimatch owner resolves these advisory floors unaided.
  'brace-expansion@1.0.0 - 1.1.20': 1.1.21
  'brace-expansion@2.0.0 - 2.1.6': 2.1.7
  'brace-expansion@5.0.0 - 5.0.11': 5.0.12
  # GHSA-68fv-2mgg-jv7q (HIGH): source-map-js <1.2.2. A FLOOR, not a pin --
  # @tailwindcss/node, css-tree and magicast all already declare ^1.2.1, which
  # 1.2.2 satisfies, so this crosses no owner's range and needs no per-owner
  # edge. It is here because satisfying is not the same as resolved: `pnpm
  # update -r --depth Infinity source-map-js` moves @tailwindcss/node and
  # magicast but leaves css-tree (reached through a peer-keyed jsdom subtree)
  # on 1.2.1, and nothing stops any of them picking 1.2.1 again on a later
  # resolution. Remove when every owner's floor is >=1.2.2 unaided.
  'source-map-js@1.0.0 - 1.2.1': 1.2.2
  # BST-880: patch pinned Vercel route parsers without crossing API majors.
  # Retire each edge when its owner admits >=6.3.0 or >=8.4.0 respectively.
  '@vercel/node@5.9.3>path-to-regexp': 6.3.0
  '@vercel/remix-builder@5.9.1>path-to-regexp': 6.3.0
  '@vercel/backends@0.8.30>path-to-regexp': 8.4.2
  '@vercel/express@0.1.121>path-to-regexp': 8.4.2
  '@vercel/hono@0.2.110>path-to-regexp': 8.4.2
  '@vercel/fun@1.3.0>path-to-regexp': 8.4.2
  # BST-878: keep YAML on its owner's major; 4.3.2 also fixes empty merge
  # sources. Retire when every 4.x owner resolves >=4.3.2 without this floor.
  'js-yaml@4.0.0 - 4.3.1': 4.3.2
  # BST-884: these Vercel owners pin TOML 1.5.2; 1.8.0 fixes both parser DoS
  # advisories. Retire each edge when its owner admits smol-toml >=1.7.1.
  'vercel@58.4.4>smol-toml': 1.8.0
  '@vercel/python-analysis@0.12.0>smol-toml': 1.8.0
  '@vercel/rust@1.4.0>smol-toml': 1.8.0
  # BST-879: python-analysis 0.12.0 pins vulnerable minimatch 10.1.1.
  # Use the vendor's patched 10.x API; remove when the owner admits >=10.2.3.
  # https://github.com/isaacs/minimatch/security/advisories/GHSA-23c5-xmqv-rm74
  # Parent scoping: https://pnpm.io/settings/dependency-resolution#overrides
  '@vercel/python-analysis@0.12.0>minimatch': 10.2.6
  react: ^19.3.0
  react-dom: ^19.3.0
  # BST-871 / GHSA-vpq2-c234-7xj6: fun pins the vulnerable event-wait helper.
  # Same-major vendor patch; retire when this parent admits a patched version.
  '@vercel/fun@1.3.0>@tootallnate/once': 2.0.1
  # BST-873 / GHSA-2g4f-4pwh-qvx6: static-config pins vulnerable Ajv 8.6.3.
  # Preserve patched 6.x/other 8.x edges; retire when this parent admits the fix.
  '@vercel/static-config@3.4.0>ajv': 8.18.0
  # BST-886: node-gyp and other compatible tar 7.x owners can take the patched
  # release. @vercel/fun@1.3.0 pins vulnerable 7.5.7 exactly, so scope the
  # exception to that owner until it publishes a fixed dependency.
  'tar@': 7.5.22
  '@vercel/fun@1.3.0>tar': 7.5.22
  # BST-881: qs 6.16.0 fixes the comma-stringify and parser DoS advisories.
  # Converge compatible Express/body-parser edges; typed-rest-client@2.3.1
  # pins 6.15.1 exactly, so keep that exception scoped to its current owner.
  'qs@': 6.16.0
  'typed-rest-client@2.3.1>qs': 6.16.0
  # @swc/core 1.16.0 BREAKS the desktop build (BST-1311). vite-plugin-top-level-await
  # constructs SWC AST nodes in JS, and 1.16.0's Rust-side AST change makes
  # Compiler.printSync reject them with "missing field `type`". Proven by A/B:
  # pristine main at 1.15.47 builds green; the same tree with only the swc bump
  # fails at @brainstrike/desktop#build.
  #
  # The plugin owns both SWC dependencies; there are no first-party consumers.
  # Keep these subtree pins after removing packages/types' unused declaration
  # and catalog entry (BST-2027). Normal updates must not move the plugin to
  # the incompatible AST representation.
  #
  # @swc/wasm is pinned for the SAME reason, and it is NOT belt-and-braces. The
  # plugin depends on both packages directly (`@swc/core: ^1.12.14`,
  # `@swc/wasm: ^1.12.14`) and picks between them at require() time —
  # dist/swc.js is `try { require("@swc/core") } catch { require("@swc/wasm") }`,
  # with VITE_TLA_FORCE_WASM=true forcing the fallback and VITE_TLA_FORCE_NATIVE=true
  # rethrowing instead. So the wasm copy is live code on any tree where the native
  # binding fails to load — a platform with no prebuilt binary, or an install that
  # skipped build scripts. `@swc/core: true` in allowBuilds makes the native path
  # the normal one HERE; it does not make the fallback dead. Measured, not
  # assumed: with this override removed, `pnpm update -r --depth Infinity
  # @swc/wasm` resolves 1.16.0 (published 2026-08-14, so the gap was live), and
  # driving the plugin's own transformModule + printSync over that build throws
  #
  #   failed to deserialize program: unknown variant `BlockStatement`
  #
  # where @swc/core 1.15.47 prints the very same AST fine. The message DIFFERS
  # from the native path's "missing field `type`" — same Rust-side AST
  # deserialization break, different wording — so do not grep for the core error
  # when diagnosing a wasm-path failure. Left unpinned this reproduces ONLY
  # where the fallback is taken, which is the worst form of this bug.
  #
  # Blast radius is BOTH apps, not just desktop: topLevelAwait() is used at
  # apps/web/vite.config.mts:184, apps/desktop/vite.config.mts:134, and desktop's
  # worker.plugins at :267. Desktop is only where the build happens to fail first,
  # so retiring the desktop usage alone would NOT retire these pins.
  #
  # Remove both once vite-plugin-top-level-await ships a release compatible with
  # swc >= 1.16 (1.6.0 is latest as of 2026-08-15 and is not), and delete
  # scripts/__tests__/swc-ast-break-block.test.mjs,
  # which fails until all three are done together.
  vite-plugin-top-level-await>@swc/core: ~1.15.47
  vite-plugin-top-level-await>@swc/wasm: ~1.15.43
  # GHSA-6qxp-vccf-f47h / CVE-2026-104850 again, on the v1 line: @ext-apps 1.7.5
  # peer-depends on @modelcontextprotocol/sdk ^1.29.0, so pnpm auto-installs a
  # copy inside the advisory's affected 1.12.0-1.30.1 range. 1.31.0 carries the
  # same issuer-binding fix; 1.32.1 is the head of that line and still satisfies
  # ^1.29.0. DEFENCE IN DEPTH, not a live hole: the vulnerable code is the OAuth
  # client, ext-apps imports only client/index.js, server/mcp.js,
  # server/zod-compat.js, shared/protocol.js, shared/transport.js and types.js,
  # and no first-party source may reference the v1 SDK at all (enforced by
  # scripts/__tests__/mcp-sdk-v2-boundary-contract.test.mjs). Retire this edge
  # when ext-apps admits the v2 split packages.
  '@modelcontextprotocol/ext-apps@1.7.5>@modelcontextprotocol/sdk': 1.32.1
allowBuilds:
  '@brainstrike/secure-fs-native': true
  '@brainstrike/windows-job-native': true
  '@biomejs/biome': false
  '@jacobwolf/biome-unnecessary-effect': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  # BST-1920: DENIED, never allowed. better-sqlite3 ships `binding.gyp`, so pnpm
  # counts an implicit `node-gyp rebuild` as an unreviewed build script and fails
  # `pnpm install` with ERR_PNPM_IGNORED_BUILDS unless the package is reviewed.
  # `false` is the review verdict (same as '@parcel/watcher' below): the shipped
  # `prebuilds/<platform>-<arch>.node` is the only binary, nothing compiles.
  better-sqlite3: false
  core-js: true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: false
  lefthook: true
  node-pty: true
  onnxruntime-node: true
  oxc-resolver: true
  protobufjs: true
  puppeteer: true
  sharp: true
  '@parcel/watcher': false
# Owner decision, 2026-10-16: install selected versions without a release-age delay.
# Explicit zero overrides pnpm 11's default one-day floor.
