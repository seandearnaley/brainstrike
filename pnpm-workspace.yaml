packages:
  - apps/*
  - packages/*
  - packages/config/*
catalogMode: strict
cleanupUnusedCatalogs: true
# NOTE: react and react-dom are deliberately NOT catalogued — see the `overrides`
# block below, which is their SINGLE governor. A bare override SHADOWS a catalog
# entry completely: measured live, with `overrides: react: ^19.2.4` in place a
# `catalog: react: ^19.9.9` (a version that does not exist) still installs clean
# and resolves 19.2.7, and the lockfile's `catalogs: default:` block omits react
# entirely. Such an entry governs nothing and rots silently the moment the
# override is bumped. The override has to stay because it also constrains the
# ~157 third-party packages that depend on react/react-dom directly — transitive
# scope a catalog does NOT have, and what guarantees ONE react instance.
# scripts/verify-catalog-references.mjs enforces this "never both" rule.
#
# Comment placement — RE-MEASURED 2026-08-15 on pnpm 11.15.0 (BST-1311). An
# indented comment inside the catalog: block SURVIVES a pnpm rewrite. Measured by
# adding a catalog entry no package references, which forces cleanupUnusedCatalogs
# to act: pnpm pruned that entry and left an indented comment above a different
# entry untouched. This SUPERSEDES an earlier note here that said such comments
# are deleted — whatever pnpm did when that was written, this pnpm does not.
# Two caveats before relying on it: pnpm only rewrites when an install actually
# re-resolves (an "Already up to date" install leaves the file alone, and does not
# prune either), and a comment attached to an entry that is itself pruned has no
# measured verdict — so keep rationale beside entries that stay.
catalog:
  ai: 7.0.143
  vscode-jsonrpc: 10.0.0
  "@ai-sdk/amazon-bedrock": 5.0.118
  # BST-2067: the AI SDK's OpenTelemetry GenAI integration. LOCKSTEP with `ai`:
  # each release depends on `ai` at an EXACT version (1.0.142 -> ai 7.0.142) and
  # reads that release's telemetry events, so a split bump installs a second `ai`.
  # Node-only: the host process loads it when tracing is on; no browser bundle.
  "@ai-sdk/otel": 1.0.143
  # BST-2029: retain the qualified fence until 0.0.79 passes both OS suites.
  # macOS behavior passed; Linux readiness is blocked by host AppArmor policy.
  "@anthropic-ai/sandbox-runtime": 0.0.80
  # BST-1353: the AWS default credential chain (profiles, SSO, process creds,
  # instance/container roles) behind Bedrock's `credentialProvider` seam.
  # Node-only — imported ONLY beside the provider factory, never from the
  # browser-safe/hosted-web agent subpaths (verify-hosted-web-bundle.mjs).
  "@aws-sdk/credential-providers": 3.1159.0
  "@assistant-ui/react": "~0.15.32"
  "@assistant-ui/react-streamdown": 0.3.21
  # BST-1427: gitignore semantics for the workspace walk. The de-facto Node
  # implementation (eslint/prettier/lint-staged/globby all use it); already
  # present transitively, promoted to a direct dep so the walk can rely on it.
  "@babel/core": ^8.0.9
  "@codemirror/state": ^6.7.6
  # ADR-0004: the Effect language service on TypeScript 7. Run in dedicated
  # `effect-tsgo diagnostics` mode from each Effect package's type-check, never
  # `effect-tsgo patch`: patch rewrites the shared `tsc`, and the `typescript`
  # entry below is TypeScript 6, which this tool does not support. That is why
  # the second type-check stands; see docs/agents/effect-boundary.md.
  # Exact pin: its supported TypeScript list moves with every release (0.63.0
  # supports 7.0.2, 7.1.0-beta and 7.1.0-dev, matching the `@typescript/native` alias).
  "@effect/tsgo": 0.63.0
  # BST-1939: the native grep trigram planner parses the JS regex AST. Already
  # resolved through eslint; promoted to a direct dependency of @brainstrike/utils.
  "@eslint-community/regexpp": 4.12.2
  "@fontsource-variable/fira-code": ^5.3.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@mastra/schema-compat": 1.3.17
  # GHSA-6qxp-vccf-f47h / CVE-2026-104850 (HIGH, CVSS 7.5): in 2.0.0-2.1.0 the
  # MCP *server* chose which authorization server received a stored
  # `refresh_token` or `client_secret`, because saved credentials carried no
  # binding to the server that issued them. 2.2.0 stamps the issuing
  # authorization server onto every saved credential and refuses to send it
  # anywhere else; 2.3.1 is the head of that patched line. Reachable here
  # through the Streamable HTTP / SSE `authProvider` in
  # packages/agent/src/mcp/explicit-http-transport.ts.
  #
  # LOCKSTEP, exact pins: `client`, `server` and `server-legacy` each depend on
  # `core` at an EXACT version, so a split bump resolves two copies of the
  # protocol schema. `node` has no 2.3.x release; 2.1.1 is its head and
  # peer-depends on `server` at ^2.3.0, so it moves with them.
  "@modelcontextprotocol/client": 2.4.0
  "@modelcontextprotocol/core": 2.4.0
  "@modelcontextprotocol/node": 2.1.2
  "@modelcontextprotocol/server": 2.4.0
  "@openrouter/ai-sdk-provider": 3.1.0
  # BST-2067: OTLP trace export for host runs (packages/agent-host/src/telemetry).
  # Node-only. `@ai-sdk/otel` depends on `@opentelemetry/api` at 1.9.1 exactly and
  # the SDK peer-depends on <1.10.0: pin the same version so one copy installs.
  # LOCKSTEP: the 0.223.0 exporter depends on the 2.12.0 SDK packages exactly.
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/exporter-trace-otlp-http": 0.223.0
  "@opentelemetry/resources": 2.12.0
  "@opentelemetry/sdk-trace-node": 2.12.0
  "@playwright/test": 1.64.1
  "@radix-ui/react-accordion": ^1.3.1
  "@radix-ui/react-checkbox": ^1.4.1
  "@radix-ui/react-dialog": ^1.3.1
  "@radix-ui/react-scroll-area": ^1.4.0
  "@radix-ui/react-tabs": ^1.2.1
  "@radix-ui/react-toast": ^1.3.1
  "@shikijs/langs": ^4.5.0
  "@shikijs/themes": ^4.5.0
  "@smithy/eventstream-codec": ^4.5.2
  "@smithy/util-utf8": ^4.5.2
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-table": ^9.3.1
  "@tanstack/react-virtual": 3.14.23
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  # BST-1920: types for better-sqlite3 (13.x ships none). Exact pin on the newest
  # published release (9.6.0, 2026-08-01); DefinitelyTyped majors do not track the
  # runtime's. `Database.Options` and `loadExtension(path)` type-check against
  # better-sqlite3 13.0.3 (packages/sqlite-native `tsc` and its type-check).
  "@types/better-sqlite3": 9.6.0
  # BST-2028: maintain the Node 24 application API line; Node 26 is the toolchain.
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@typescript/native": "npm:typescript@7.0.2"
  "@typescript/old": "npm:typescript@6.0.3"
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/browser-playwright": ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  # BST-2434: the ripgrep binary every agent host searches with (Explorer
  # search and grepSearch). One optional package per platform
  # (@vscode/ripgrep-<os>-<arch>) and no install script; packaged desktop
  # resolves it through app.asar.unpacked. Exact pin.
  "@vscode/ripgrep": 1.18.0
  assistant-stream: 0.3.55
  # BST-1920: the SQLite state/index engine. Exact pin. It ships a PREBUILT
  # `prebuilds/<platform>-<arch>.node` for every release target and must never
  # be compiled: `allowBuilds` DENIES it (see below) and electron-builder runs
  # with `npmRebuild: false`. packages/sqlite-native owns the load path and the
  # provenance smoke.
  better-sqlite3: 13.0.3
  bindings: 1.5.0
  concurrently: ^10.0.6
  # ADR-0004: Effect v4 is an LTS line, with fixes committed through September
  # 2029. The pin stays EXACT: `^4.0.0` constraints elsewhere in the ecosystem
  # reject rc builds, so a range here would have silently re-resolved the whole
  # tree the moment 4.0.0 shipped. Stability is now a `@stability` JSDoc tag per
  # API, not a path segment, so an exact pin is what makes an unstable-API
  # change reviewable. docs/agents/effect-boundary.md.
  effect: 4.1.0
  # Electron 45 (Chromium 156, Node 24.22). Main uses only the async
  # safeStorage API, which 46 keeps when it removes the synchronous calls.
  electron: ^45.1.0
  esbuild: ^0.28.2
  eslint-plugin-react-refresh: ^0.5.7
  happy-dom: ^21.0.4
  ignore: 7.0.14
  jsdom: 30.1.3
  lucide-react: ^1.64.0
  minimatch: ^11.0.3
  node-addon-api: 8.9.2
  node-gyp: 13.1.0
  # The native pty add-on (the one VS Code uses) behind terminals and command sessions,
  # shipped by host-capabilities and desktop. Owner decision, 2026-11-01.
  node-pty: ^1.1.0
  oxc-parser: ^0.154.0
  # BST-1659: optional peer of @vitejs/plugin-react and the ONLY backend its
  # `react({ compiler: <options> })` plugin has — it imports this package and hard-errors
  # when it is missing. Both apps pass an options object rather than `true`.
  # plugin-react 6.1.2 requires ^0.152.0; 0.154 is outside that pre-1.0 peer range.
  oxc-transform-react: ^0.152.0
  pele: ^1.12.0
  pino: ^10.4.0
  playwright: 1.64.1
  react-hotkeys-hook: ^5.3.3
  react-resizable-panels: ^4.15.1
  react-router-dom: ^7.18.5
  react-shiki: ^0.11.2
  remark-gfm: ^4.0.1
  shiki: ^4.5.0
  # BST-1920: loadable vec0 extension; one optional package per platform
  # (sqlite-vec-<os>-<arch>). Exact pin; resolved through app.asar.unpacked.
  sqlite-vec: 0.1.9
  # BST-2031: shared with react-streamdown; the direct dependency lets Tailwind
  # @source scan the exact renderer version for its utility classes.
  streamdown: 2.7.1
  tailwindcss: ^4.3.3
  tiktoken: ^1.0.22
  tw-animate-css: ^1.4.0
  typescript: "npm:@typescript/typescript6@6.0.2"
  # The agent host's language server, shipped by host-capabilities and desktop.
  typescript-language-server: ^6.0.2
  # 8.3.3 fixes three dev-server advisories (GHSA-rq7h-c2jc-7f22,
  # GHSA-vfpm-58rq-9qcg, GHSA-9jrq-w75r-8gcw).
  vite: ^8.3.5
  vite-plugin-static-copy: ^4.1.1
  vite-plugin-wasm: ^3.6.0
  vitest: ^5.0.5
  vscode-languageserver-protocol: ^3.18.5
  xxhash-wasm: ^1.1.0
  yaml: ^2.9.1
  zod: ^4.6.7
  zustand: ^5.0.16
  "@codemirror/language": ^6.13.1
  "@codemirror/view": ^6.43.15
  "@ai-sdk/anthropic": 4.0.82
  # BST-2385: same provider-utils release as the openai and google pins, so one copy installs.
  "@ai-sdk/cohere": 4.0.63
  "@ai-sdk/google": 4.0.99
  "@ai-sdk/openai": 4.0.96
  "@atlaskit/pragmatic-drag-and-drop": ^4.0.0
  "@atlaskit/pragmatic-drag-and-drop-hitbox": ^3.0.0
  "@mastra/core": 1.80.0
  "@mastra/memory": 1.39.1
  "@modelcontextprotocol/ext-apps": 2.0.4
  "@napi-rs/keyring": 2.1.2
  cmdk: ^1.1.1
  fastest-levenshtein: ^1.0.16
  jsonc-parser: ^3.3.1
  react-markdown: ^10.1.0
  strip-ansi: 7.2.0
  tree-kill: 1.2.2
  tsx: ^4.23.15
  # BST-2385: the AI SDK community provider for Voyage embeddings (listed in the AI SDK docs).
  voyage-ai-provider: 5.0.0
  web-tree-sitter: 0.27.1
overrides:
  # Tailwind scans the direct Streamdown install; its adapter must use the same
  # catalog release on future resolutions too. Retarget on adapter upgrades;
  # retain while packages/assistant-ui/styles.css scans that direct dependency.
  "@assistant-ui/react-streamdown@0.3.21>streamdown": "catalog:"
  # BST-874: compatible patches for all installed brace-expansion majors.
  # Remove when every minimatch owner resolves these advisory floors unaided.
  "brace-expansion@1.0.0 - 1.1.20": 1.1.21
  "brace-expansion@2.0.0 - 2.1.6": 2.1.7
  "brace-expansion@5.0.0 - 5.0.11": 5.0.12
  # GHSA-68fv-2mgg-jv7q (HIGH): source-map-js <1.2.2. A FLOOR, not a pin --
  # @tailwindcss/node, css-tree and magicast all already declare ^1.2.1, which
  # 1.2.2 satisfies, so this crosses no owner's range and needs no per-owner
  # edge. It is here because satisfying is not the same as resolved: `pnpm
  # update -r --depth Infinity source-map-js` moves @tailwindcss/node and
  # magicast but leaves css-tree (reached through a peer-keyed jsdom subtree)
  # on 1.2.1, and nothing stops any of them picking 1.2.1 again on a later
  # resolution. Remove when every owner's floor is >=1.2.2 unaided.
  "source-map-js@1.0.0 - 1.2.1": 1.2.2
  # BST-878: keep YAML on its owner's major; 4.3.2 also fixes empty merge
  # sources. Retire when every 4.x owner resolves >=4.3.2 without this floor.
  "js-yaml@4.0.0 - 4.3.1": 4.3.2
  # W05 follow-up: Typography 0.5.20 still pins selector-parser 6.0.10.
  # 7.1.6 fixes flat-selector CPU exhaustion (GHSA-rj75-hqrm-r3gf).
  # Its 7.0 iteration change is qualified against Typography's actual caller
  # and generated prose CSS in both apps. Retire when the owner admits >=7.1.6.
  # https://github.com/postcss/postcss-selector-parser/releases/tag/7.1.6
  "@tailwindcss/typography@0.5.20>postcss-selector-parser": 7.1.6
  # BST-2031 follow-up: align KaTeX CSS and the Markdown renderers on
  # the vendor-recommended 0.19.0 release (0.18.11 is deprecated). 0.18.2
  # fixes inherited trust; 0.18 renamed CSS classes. Qualify these older
  # parent ranges with real browser/CLI rendering and security regressions.
  # Retire each exception when the owner admits the matched patched release.
  # https://github.com/KaTeX/KaTeX/releases/tag/v0.19.0
  "rehype-katex@7.0.1>katex": 0.19.1
  "micromark-extension-math@3.1.0>katex": 0.19.1
  # Retire sprintf-js (GHSA-hp3w-g68c-fv3c) through its actual owners.
  # Electron get 3 calls the unchanged bootstrap API. global-agent 4 removes
  # Roarr/sprintf-js; qualify real downloads, proxy/NO_PROXY, CA and checksums.
  # Retire when this owner admits the qualified proxy adapter unaided.
  # https://github.com/gajus/global-agent/releases/tag/v4.0.0
  "@electron/get@3.1.0>global-agent": 4.1.3
  react: ^19.3.1
  react-dom: ^19.3.1
  # BST-886: retain the tar 7.x safety floor, including container 19.1.2.
  # fun 1.3.6 now pins 7.5.22 unaided; its old exception is retired.
  "tar@": 7.5.22
  # GHSA-rmxm-3fg6-px4f: @hono/node-server's serveStatic decodes the path twice
  # before 2.1.3, and the 1.x line has no fix. MCP node 2.1.2 already admits
  # `^1.19.9 || ^2.1.3`, so this picks the patched major inside the owner's own
  # range. Retire when the owner drops the 1.x alternative.
  "@modelcontextprotocol/node@2.1.2>@hono/node-server": ^2.1.5
  # BST-881: converge Express/body-parser edges on a patched qs. 6.16.1 also
  # fixes the comma-stringify TypeError in 6.16.0 (GHSA-6pq8-jhm2-2vcw).
  "qs@": 6.16.1
allowBuilds:
  "@brainstrike/secure-fs-native": true
  "@brainstrike/windows-job-native": true
  "@biomejs/biome": false
  "@jacobwolf/biome-unnecessary-effect": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  # BST-1920: DENIED, never allowed. better-sqlite3 ships `binding.gyp`, so pnpm
  # counts an implicit `node-gyp rebuild` as an unreviewed build script and fails
  # `pnpm install` with ERR_PNPM_IGNORED_BUILDS unless the package is reviewed.
  # `false` is the review verdict: the shipped
  # `prebuilds/<platform>-<arch>.node` is the only binary, nothing compiles.
  better-sqlite3: false
  core-js: true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: false
  lefthook: true
  node-pty: true
  oxc-resolver: true
  protobufjs: true
# Owner decision, 2026-10-16: install selected versions without a release-age delay.
# Explicit zero overrides pnpm 11's default one-day floor.
minimumReleaseAge: 0
patchedDependencies:
  # BST-2070: Memory 1.39's run-owner cancellation, retained background failures and
  # joined initial flag writes. 1.39 adopted the turn signal, scoped settled() and
  # abortable lock waits, so the patch now builds on those. Unpatched 1.39 fails the
  # owner cases in packages/agent-host/__tests__/memory-public-lifecycle.test.ts.
  "@mastra/memory@1.39.1": patches/@mastra__memory@1.39.1.patch
  # BST-2070: Core 1.80 still drops the caller's abort reason in AgentThreadStreamRuntime,
  # which Memory's internal observer/reflector streams pass through.
  "@mastra/core@1.80.0": patches/@mastra__core@1.80.0.patch
  "@assistant-ui/core@0.3.32": patches/@assistant-ui__core@0.3.32.patch
  vscode-jsonrpc@10.0.0: patches/vscode-jsonrpc@10.0.0.patch
  # Playwright 1.64 launches Electron through cmd.exe on every Windows path, so it holds the
  # shell, not Main, and force-closes with `taskkill /T` from the shell's pid. /T walks parent
  # pids, which Windows never checks against creation time, so a reused pid takes in processes
  # that are not the app's. The patch keeps the shell for .bat/.cmd only (Electron is an .exe)
  # and, without a shell, force-closes through the launched process's own handle
  # (TerminateProcess), never by pid; the kill-on-close Job Main holds for its host ends the host
  # (apps/desktop/src/host-process-job.ts). Paired tests: apps/desktop/e2e/app-launch.test.ts
  # (the launched process is the app itself) and main-process-loss.desktop.test.ts.
  playwright-core@1.64.1: patches/playwright-core@1.64.1.patch
