<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainStrike Desktop</title>

    <!-- CSP is configured programmatically in main process for better environment handling -->
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Geist Variable",
          "Geist",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 20%, #1a2744 0%, #0b1020 55%, #070b16 100%);
        color: #e7eefc;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .startup-shell {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .startup-card {
        min-width: 320px;
        border: 1px solid rgba(151, 169, 211, 0.24);
        border-radius: 12px;
        background: rgba(10, 17, 34, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        padding: 20px 22px;
      }

      .startup-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .startup-subtitle {
        margin: 8px 0 0;
        font-size: 13px;
        color: #b2c0e5;
      }

      .startup-progress {
        margin-top: 14px;
        height: 3px;
        width: 100%;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(164, 182, 230, 0.2);
      }

      .startup-progress::before {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #5ea2ff 0%, #9bc8ff 100%);
        border-radius: inherit;
        animation: startup-progress 1.15s ease-in-out infinite;
      }

      @keyframes startup-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell">
        <div class="startup-card" role="status" aria-live="polite">
          <p class="startup-title">Starting BrainStrike…</p>
          <p class="startup-subtitle">Loading renderer and restoring workspace state</p>
          <div class="startup-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/renderer/main.tsx"></script>
  </body>
</html>
