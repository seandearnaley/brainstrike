<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    macOS app icon on Apple's grid: an 824 tile at 100,100 with corner radius 185 on a
    transparent 1024 canvas, with a soft shadow below the tile. The mark is the identity
    master's compound path (circle r434 with the bolt as an even-odd cutout) scaled by
    824/1024, so the circle keeps the master's proportion to its square.
  -->
  <defs>
    <filter id="tile-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000CDE" filter="url(#tile-shadow)" />
  <path transform="translate(100 100) scale(0.8046875)" fill="#D0FB07" fill-rule="evenodd" clip-rule="evenodd" d="M512 78 A434 434 0 1 1 512 946 A434 434 0 1 1 512 78 Z M618 128 L251 558 L493 558 L358 892 L734 440 L524 440 Z" />
</svg>
