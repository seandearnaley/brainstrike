# Runner labels provided by the Ubicloud GitHub App, not GitHub-hosted runners.
# Declared so actionlint checks every other runs-on label instead of flagging these.
self-hosted-runner:
  labels:
    - ubicloud-standard-2
    - ubicloud-standard-4

paths:
  .github/workflows/test.yml:
    ignore:
      # GitHub's contexts reference defines `jobs.<job_id>.result` for a reusable
      # workflow's `on.workflow_call.outputs`, which BST-2188's merge queue gate
      # reads; actionlint's model of `jobs` lacks it (rhysd/actionlint#343, #724).
      - 'property "result" is not defined in object type \{outputs: '
