# Runs nightly on main (owner decision 2026-10-17).
# Per-PR hosted CI is off; merges use the local gate in docs/agents/ci-quality.md.

name: Actions Storage Cleanup

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    name: Prune Actions Storage
    if: github.repository == 'seandearnaley/brainstrike'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Prune expired artifacts and stale caches
        run: |
          node scripts/prune-actions-storage.mjs \
            --artifact-max-age-hours 24 \
            --cache-max-age-hours 72 \
            --cache-keep-recent-per-key 2 \
            --delete-concurrency 4 \
            --max-deletions 4000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-linear:
    name: Notify Linear
    needs: [prune]
    if: ${{ github.repository == 'seandearnaley/brainstrike' && always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: prune=${{ needs.prune.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
