# PROOF ONLY: never merge this branch or its generated fix PR.
# Main's scheduled-origin caller is unchanged at the reviewed BASE in control.mjs.
name: Nightly Fix Qualification

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed full commit of this proof branch.
        required: true
        type: string
      proof_id:
        description: Fixed reviewed identity pv67-nonempty-20261020-v2.
        required: true
        type: string
      phase:
        description: First agent/publication or repeat held-claim receipt.
        required: true
        type: choice
        options: [first, repeat]

permissions: {}

jobs:
  guard:
    name: Admit the reviewed manual proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Read every open PR for proof capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > "$RUNNER_TEMP/proof-pulls.json"
      - name: Verify identity, proof-only paths and unchanged owners
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PROOF_ID: ${{ inputs.proof_id }}
          PROOF_PHASE: ${{ inputs.phase }}
          PULL_PAGES: ${{ runner.temp }}/proof-pulls.json
        run: node apps/desktop/e2e/fixtures/nightly-fix-proof/control.mjs guard

  proof-fix-case:
    name: Intentionally failing proof assertion
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run the real Playwright canary
        id: canary
        working-directory: apps/desktop
        env:
          NIGHTLY_PROOF_RESULTS_DIR: ${{ runner.temp }}/nightly-results/proof-fix-case/single
          NIGHTLY_PROOF_DIAGNOSTICS_DIR: ${{ runner.temp }}/proof-fix-case-test-results
        run: pnpm exec playwright test --config e2e/fixtures/nightly-fix-proof/playwright.config.mjs
      - name: Admit only the intended assertion failure
        id: validate
        if: ${{ always() }}
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          JOB_STATUS: ${{ job.status }}
          REPORT_FILE: ${{ runner.temp }}/nightly-results/proof-fix-case/single/canary.json
        run: node apps/desktop/e2e/fixtures/nightly-fix-proof/control.mjs report
      - name: Record the actual job status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PART_DIR: ${{ runner.temp }}/nightly-results/proof-fix-case/single
        run: |
          mkdir -p "$PART_DIR"
          printf '%s\n' "$JOB_STATUS" > "$PART_DIR/job.status"
      - name: Upload canonical nightly results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results--proof-fix-case
          path: ${{ runner.temp }}/nightly-results/
          retention-days: 1
          if-no-files-found: error
      - name: Upload proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: proof-fix-case-test-results
          path: ${{ runner.temp }}/proof-fix-case-test-results/
          retention-days: 1
          if-no-files-found: error

  notify:
    needs: [guard, proof-fix-case]
    if: ${{ always() && needs.guard.result == 'success' && needs.proof-fix-case.outputs.validated == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: Nightly Fix Qualification
      results: proof-fix-case=failure
      fix_runs_on: ubuntu-latest
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

  queue:
    name: Read the single proof issue
    needs: [guard, proof-fix-case, notify]
    if: ${{ always() && needs.guard.result == 'success' && needs.proof-fix-case.outputs.validated == 'true' && needs.notify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download this run's actual notifier queue
        uses: actions/download-artifact@v8
        with:
          name: nightly-fix-issues
          path: ${{ runner.temp }}/nightly-fix
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate and map the queue
        id: queue
        env:
          QUEUE_FILE: ${{ runner.temp }}/nightly-fix/fix-issues.json
        run: |
          node apps/desktop/e2e/fixtures/nightly-fix-proof/control.mjs queue
          queue=$(jq -c '.runs_on as $runs_on | [.issues[] | {issue: ., runs_on: $runs_on}]' "$QUEUE_FILE")
          echo "queue=$queue" >> "$GITHUB_OUTPUT"

  fix:
    name: Fix the proof canary
    needs: [queue]
    if: ${{ always() && needs.queue.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.queue.outputs.queue) }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/nightly-fix-agent.yml
    with:
      issue: ${{ matrix.issue }}
      runs_on: ${{ matrix.runs_on }}
      nightly_run_id: ${{ github.run_id }}
      head_sha: ${{ inputs.expected_head }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

  receipt:
    name: Check the requested phase receipt
    needs: [queue, fix]
    if: ${{ always() && needs.queue.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: nightly-fix-issues
          path: ${{ runner.temp }}/proof-receipt
      - name: Read actual jobs and retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/proof-receipt/jobs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/proof-receipt/artifacts.json"
      - name: Require first publication or repeat skip
        env:
          PROOF_PHASE: ${{ inputs.phase }}
          PROOF_ISSUE: ${{ fromJSON(needs.queue.outputs.queue)[0].issue }}
          QUEUE_FILE: ${{ runner.temp }}/proof-receipt/fix-issues.json
          JOBS_FILE: ${{ runner.temp }}/proof-receipt/jobs.json
          ARTIFACTS_FILE: ${{ runner.temp }}/proof-receipt/artifacts.json
          RECEIPT_FILE: ${{ runner.temp }}/proof-receipt/receipt.json
        run: node apps/desktop/e2e/fixtures/nightly-fix-proof/control.mjs receipt
      - name: Retain the phase receipt even when its checks fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-proof-phase-receipt
          path: ${{ runner.temp }}/proof-receipt/
          retention-days: 7
          if-no-files-found: error
