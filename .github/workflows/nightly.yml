# Runs nightly on main. Per-PR hosted CI is off; main lands through the merge queue.

name: Nightly

on:
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:

# One night per ref at a time, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# A called workflow can only narrow what its caller grants.
permissions: {}

jobs:
  test:
    name: Test
    if: github.repository == 'seandearnaley/brainstrike'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    with:
      merge-queue: false
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  desktop-e2e:
    name: Desktop E2E
    if: github.repository == 'seandearnaley/brainstrike'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      suite: full
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # The night is green only when every call succeeded; a release resolves a
  # commit by this run's result.
  verdict:
    name: Nightly verdict
    if: github.repository == 'seandearnaley/brainstrike' && always()
    needs: [test, desktop-e2e]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Judge every called workflow
        env:
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_DESKTOP_E2E: ${{ needs.desktop-e2e.result }}
        run: |
          set -euo pipefail
          failed=0
          printf '| Called workflow | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for lane in "${!RESULT_@}"; do
            call="${lane#RESULT_}"
            result="${!lane}"
            echo "${call}: ${result:-missing}"
            printf '| %s | %s |\n' "$call" "${result:-missing}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then
              echo "::error::${call} was ${result:-missing}, expected success"
              failed=1
            fi
          done
          exit "$failed"
