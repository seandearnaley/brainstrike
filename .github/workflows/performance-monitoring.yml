name: Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Create performance metrics directory
        run: mkdir -p apps/web/performance-metrics

      - name: Download baseline metrics (if exists)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, try to get baseline from main branch
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/apps/web/performance-metrics/baseline.json?ref=main" \
              -o apps/web/performance-metrics/baseline.json || echo "No baseline found"
          fi

      - name: Run performance tests
        run: |
          cd apps/web
          pnpm exec playwright test performance-benchmarks.spec.ts \
            --reporter=list,json:performance-test-results.json
        env:
          CI: true

      - name: Run memory usage tests
        run: |
          cd apps/web
          pnpm exec playwright test performance-memory-usage.spec.ts \
            --reporter=list,json:memory-test-results.json
        env:
          CI: true

      - name: Run tree rendering tests
        run: |
          cd apps/web
          pnpm exec playwright test performance-tree-rendering.spec.ts \
            --reporter=list,json:tree-test-results.json
        env:
          CI: true

      - name: Process performance results
        run: |
          cd apps/web
          node e2e/utils/consolidate-metrics.js

      - name: Update baseline on main branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd apps/web
          if [ -f performance-metrics/consolidated-metrics.json ]; then
            cp performance-metrics/consolidated-metrics.json performance-metrics/baseline.json
            echo "Baseline updated for main branch"
          fi

      - name: Comment performance results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const metricsFile = 'apps/web/performance-metrics/consolidated-metrics.json';
            
            if (!fs.existsSync(metricsFile)) {
              console.log('No consolidated metrics found');
              return;
            }
            
            const data = JSON.parse(fs.readFileSync(metricsFile, 'utf8'));
            const metrics = data.metrics || [];
            
            if (metrics.length === 0) {
              console.log('No metrics to report');
              return;
            }
            
            // Try to load baseline for comparison
            let baselineMetrics = [];
            const baselineFile = 'apps/web/performance-metrics/baseline.json';
            if (fs.existsSync(baselineFile)) {
              const baselineData = JSON.parse(fs.readFileSync(baselineFile, 'utf8'));
              baselineMetrics = baselineData.metrics || baselineData;
            }
            
            // Create performance report
            let comment = '## 📊 Performance Test Results\n\n';
            
            const failedMetrics = metrics.filter(m => m.passed === false);
            if (failedMetrics.length > 0) {
              comment += '### ❌ Failed Thresholds\n\n';
              failedMetrics.forEach(metric => {
                comment += `- **${metric.name}**: ${metric.value.toFixed(2)}${metric.unit} (threshold: ${metric.threshold}${metric.unit})\n`;
              });
              comment += '\n';
            }
            
            comment += '### 📈 All Metrics\n\n';
            comment += '| Metric | Current | Threshold | Status | vs Baseline |\n';
            comment += '|--------|---------|-----------|--------|--------------|\n';
            
            metrics.forEach(metric => {
              const status = metric.passed !== false ? '✅' : '❌';
              const baseline = baselineMetrics.find(b => b.name === metric.name);
              let comparison = 'N/A';
              
              if (baseline) {
                const improvement = ((baseline.value - metric.value) / baseline.value) * 100;
                if (improvement > 5) {
                  comparison = `🟢 ${improvement.toFixed(1)}% better`;
                } else if (improvement < -5) {
                  comparison = `🔴 ${Math.abs(improvement).toFixed(1)}% worse`;
                } else {
                  comparison = `🟡 ${improvement.toFixed(1)}% (stable)`;
                }
              }
              
              comment += `| ${metric.name} | ${metric.value.toFixed(2)}${metric.unit} | ${metric.threshold}${metric.unit} | ${status} | ${comparison} |\n`;
            });
            
            comment += '\n---\n';
            comment += `*Performance tests run on commit ${context.sha.substring(0, 7)}*`;
            
            // Find existing performance comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes('📊 Performance Test Results')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-metrics
          path: |
            apps/web/performance-metrics/
            apps/web/performance-test-results.json
            apps/web/memory-test-results.json
            apps/web/tree-test-results.json
          retention-days: 30

      - name: Fail job if performance thresholds exceeded
        run: |
          cd apps/web
          # The consolidate-metrics.js script already exits with code 1 if metrics failed
          # This step will fail the job if any performance thresholds were exceeded
          node e2e/utils/consolidate-metrics.js