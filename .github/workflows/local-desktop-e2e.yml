# Cloud CI is disabled due to cost; repository GitHub Actions is disabled.
# Preserved workflow definition only: do not enable, dispatch, or rerun it.
# Test locally with pnpm check and report the commands and results.
# Tell the user: CI is disabled due to cost; validation must run locally.
# Stays disabled: per-PR hosted CI is off.

name: Local Desktop E2E

on:
  workflow_dispatch:
    inputs:
      shardIndex:
        description: 'Shard index to run'
        required: true
        default: '2'
      shardTotal:
        description: 'Total shards'
        required: true
        default: '2'

# Cancel in-progress runs for the same workflow dispatch
# Uses run_id to ensure each manual trigger gets its own group, preventing
# unrelated manual triggers from cancelling each other
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  desktop-e2e-local:
    name: Desktop E2E (Shard ${{ inputs.shardIndex || 2 }}/${{ inputs.shardTotal || 2 }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Skip Turborepo cache for local runs to avoid download overhead/conflicts
      # unless specifically desired. Assuming fresh run is safer or reusing container.
      
      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright for Electron (no browsers needed)
        run: pnpm exec playwright install-deps

      - name: Build desktop application
        run: pnpm run build --filter @brainstrike/desktop

      - name: Run Desktop E2E tests (shard)
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          # Use a deterministic X server number per shard to avoid collisions
          # Shard 1 = :91, Shard 2 = :92, etc. (base 90 + shardIndex)
          SHARD=${{ inputs.shardIndex || 2 }}
          SERVER_NUM=$((90 + SHARD))

          # Clean up any stale X lock files for this server number
          LOCK_FILE="/tmp/.X${SERVER_NUM}-lock"
          [ -f "$LOCK_FILE" ] && sudo rm -f "$LOCK_FILE"

          echo "Starting Xvfb on display :${SERVER_NUM} for shard ${SHARD}"
          unset NO_COLOR
          # dbus-run-session provides an ephemeral D-Bus session bus so
          # Chromium inside Electron doesn't spew `[ERROR:dbus/bus.cc:405]
          # Failed to connect to the bus`. Wraps as the OUTER layer to
          # match the ordering in test.yml + desktop-e2e.yml.
          dbus-run-session -- \
            xvfb-run --server-num=$SERVER_NUM --server-args="-screen 0 1280x960x24 -ac +extension GLX" \
            pnpm exec playwright test --shard=${SHARD}/${{ inputs.shardTotal || 2 }}
        env:
          NODE_ENV: "test"
          CI: "true"
          RUN_SALT: ${{ github.run_id }}
          # Prevent V8 inspector from blocking Electron startup
          ELECTRON_ENABLE_STACK_DUMPING: "false"
          # Disable GPU features that can cause hangs in headless Linux
          ELECTRON_DISABLE_GPU: "1"
