name: Local Desktop E2E

on:
  workflow_dispatch:
    inputs:
      shardIndex:
        description: 'Shard index to run'
        required: true
        default: '2'
      shardTotal:
        description: 'Total shards'
        required: true
        default: '2'

jobs:
  desktop-e2e-local:
    name: Desktop E2E (Shard ${{ inputs.shardIndex || 2 }}/${{ inputs.shardTotal || 2 }})
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Skip Turborepo cache for local runs to avoid download overhead/conflicts
      # unless specifically desired. Assuming fresh run is safer or reusing container.
      
      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright for Electron (no browsers needed)
        run: pnpm exec playwright install-deps

      - name: Build desktop application
        run: pnpm run build --filter @brainstrike/desktop

      - name: Run Desktop E2E tests (shard)
        run: |
          cd apps/desktop
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm exec playwright test --shard=${{ inputs.shardIndex || 2 }}/${{ inputs.shardTotal || 2 }}
        env:
          NODE_ENV: "test"
          CI: "true"

