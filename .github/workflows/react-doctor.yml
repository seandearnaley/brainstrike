name: React Doctor

# React Doctor owns React/JS lint. Its changed-scope scan does not run graph rules.
# Knip is the authoritative file/dependency auditor, with curated entrypoints and
# dependency exceptions in knip.jsonc. See the scheduled/manual knip.yml workflow.
#
# Gate policy (per team decision):
#   - scope: changed   -> only NEWLY introduced issues are reported/blocking on a PR;
#                         the pre-existing backlog stays advisory while it is burned
#                         down in stacked PRs.
#   - blocking: error  -> a PR fails only on new error-severity issues.
#   - telemetry OFF    -> REACT_DOCTOR_NO_TELEMETRY=1 (the Action has no flag for it);
#                         nothing is sent to the hosted score API / Sentry.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Disable the hosted score API, share URL, and Sentry crash/usage reporting.
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  react-doctor:
    # Short x64 automation: preserve the 2-vCPU/8-GB shape at the lower
    # Ubicloud standard rate. Provider allocation must fail visibly.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@v2
        with:
          # Pinned for reproducible CI (kept in lockstep with the devDependency).
          version: "0.9.13"
          # Match .nvmrc; the composite otherwise defaults to Node 24.
          node-version: "26.8.2"
          scope: changed
          blocking: error
