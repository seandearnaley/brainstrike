name: CI Flake Investigator

on:
  schedule:
    - cron: '29 9 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-flake-investigator
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubicloud-standard-4
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main
      - uses: ./.github/actions/setup-report-workspace
      - name: Inspect current-main Actions metadata and rerun one exact failed Unit phase
        id: investigator
        continue-on-error: true
        env:
          REPORT_PATH: reports/agent-routines/ci-flake-investigator.json
        run: node scripts/agent-routines/ci-flake/cli.mjs
      - name: Publish summary
        if: always()
        run: |
          test -f reports/agent-routines/ci-flake-investigator.json
          printf '## CI Flake Investigator\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/agent-routines/ci-flake-investigator.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-flake-investigator-${{ github.sha }}
          path: reports/agent-routines/ci-flake-investigator.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve harness failure
        if: steps.investigator.outcome == 'failure'
        run: exit 1
