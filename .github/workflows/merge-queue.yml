# Runs the fast tier on each Mergify merge-queue batch for main (BST-2188).
# Per-push and per-PR CI stays off: no pull request starts this workflow.

name: Merge Queue

# scripts/__tests__/merge-queue-contract.test.mjs pins these triggers, the
# call, the gate and .mergify.yml.
on:
  # Mergify builds each batch on main and pushes it to a branch under the
  # queue_branch_prefix in .mergify.yml (owner decision 2026-10-19). The branch
  # filter, not a job condition, keeps every other push and every pull request
  # from starting this workflow: GitHub reports a job skipped by its condition
  # as success to required checks, while a check whose workflow never started
  # stays pending. So Merge Queue Gate never reports on an ordinary PR head, and
  # the ruleset that requires it blocks any merge but Mergify's.
  #
  # No merge_group trigger: GitHub's native merge queue is unavailable to this
  # private, user-owned repository (the ruleset API rejects the merge_queue
  # rule), and Mergify needs that rule off on the branches it queues.
  push:
    branches: ['mergify/merge-queue/**']
  workflow_dispatch:

# A called workflow can only narrow these, and test.yml asks for both.
permissions:
  contents: read
  pull-requests: read

jobs:
  # The fast tier is test.yml itself: Static, Unit (affected against the main
  # commit the batch was built on), Build and the three smoke E2E lanes. Its
  # nightly-only jobs skip under `merge-queue: true`. A dispatch runs every Unit
  # shard. Check names read "Test / Static", "Test / Unit (db-1)" and so on.
  #
  # Deleting a branch also fires push, with the SHA reverted to main. Mergify
  # deletes each queue branch once its batch is done, so every job skips that.
  test:
    name: Test
    if: github.repository == 'seandearnaley/brainstrike' && !github.event.deleted
    uses: ./.github/workflows/test.yml
    with:
      merge-queue: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # The merge condition in .mergify.yml and the check the ruleset requires;
  # keep its name exact. It passes only when the call succeeded, every
  # fast-tier job succeeded and every nightly-only job skipped. Static owns
  # Unit selection, so the Unit matrix may skip only when Static succeeded and
  # selected no affected shard; a Unit skipped because Static failed, or any
  # other skipped, failed or cancelled job, fails the gate.
  merge-queue-gate:
    name: Merge Queue Gate
    if: github.repository == 'seandearnaley/brainstrike' && !github.event.deleted && always()
    needs: [test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Judge every job
        env:
          NIGHTLY_ONLY: NATIVE_ELECTRON BROWSER_TESTS NOTIFY_LINEAR
          UNIT_SHARD_COUNT: ${{ needs.test.outputs.unit-shard-count }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_ADMISSION: ${{ needs.test.outputs.admission-result }}
          RESULT_STATIC: ${{ needs.test.outputs.static-result }}
          RESULT_UNIT_SHARD: ${{ needs.test.outputs.unit-shard-result }}
          RESULT_UNIT: ${{ needs.test.outputs.unit-result }}
          RESULT_BUILD: ${{ needs.test.outputs.build-result }}
          RESULT_NATIVE_ELECTRON: ${{ needs.test.outputs.native-electron-result }}
          RESULT_BROWSER_TESTS: ${{ needs.test.outputs.browser-tests-result }}
          RESULT_DESKTOP_E2E_SMOKE: ${{ needs.test.outputs.desktop-e2e-smoke-result }}
          RESULT_DESKTOP_E2E_DELEGATED: ${{ needs.test.outputs.desktop-e2e-delegated-result }}
          RESULT_DESKTOP_E2E: ${{ needs.test.outputs.desktop-e2e-result }}
          RESULT_NOTIFY_LINEAR: ${{ needs.test.outputs.notify-linear-result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in "${!RESULT_@}"; do
            job="${lane#RESULT_}"
            result="${!lane}"
            expected=success
            case " ${NIGHTLY_ONLY} " in
              *" ${job} "*) expected=skipped ;;
            esac
            echo "${job}: ${result} (expected ${expected})"
            if [ "$result" = "$expected" ]; then
              continue
            fi
            if [ "$job" = UNIT_SHARD ] && [ "$result" = skipped ] &&
              [ "$RESULT_STATIC" = success ] && [ "$UNIT_SHARD_COUNT" = 0 ]; then
              echo "Static succeeded and selected no affected Unit shard."
              continue
            fi
            echo "::error::${job} was ${result:-missing}, expected ${expected}"
            failed=1
          done
          exit "$failed"
