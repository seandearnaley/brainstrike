name: Performance E2E

on:
  schedule:
    - cron: '23 7 * * *' # Daily at 07:23 UTC
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'performance'
      grep:
        description: 'Optional grep to filter tests'
        required: false
        default: ''

# Cancel in-progress runs when new commits are pushed to the same PR
# Uses head repo + head_ref for PRs to avoid fork collisions (different forks can use the same branch name)
# For pushes and scheduled runs, uses the full ref to ensure proper isolation
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  web-perf:
    name: Web Performance Tests
    timeout-minutes: 30
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ( github.event_name == 'pull_request' &&
        ( contains(join(github.event.pull_request.labels.*.name, ','), 'run-perf') ||
          contains(join(github.event.pull_request.labels.*.name, ','), 'run-performance-tests') ) )
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-node24-turbo-v4-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-turbo-v4-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build application
        run: |
          TAILWIND_DEBUG=1 pnpm run build --filter @brainstrike/web

      - name: Run performance tests
        timeout-minutes: 30
        run: |
          cd apps/web
          unset NO_COLOR
          PROJECT=${{ github.event.inputs.project || 'performance' }}
          GREP=${{ github.event.inputs.grep || '' }}
          if [ -n "$GREP" ]; then
            pnpm exec playwright test --project="$PROJECT" -g "$GREP"
          else
            pnpm exec playwright test --project="$PROJECT"
          fi
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-blob-report
          path: apps/web/blob-report
          retention-days: 1
