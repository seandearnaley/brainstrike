name: Performance E2E

on:
  schedule:
    - cron: '23 7 * * *' # Daily at 07:23 UTC
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'performance'
      grep:
        description: 'Optional grep to filter tests'
        required: false
        default: ''

# Cancel in-progress runs when new commits are pushed to the same PR
# Uses head repo + head_ref for PRs to avoid fork collisions (different forks can use the same branch name)
# For pushes and scheduled runs, uses the full ref to ensure proper isolation
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-perf:
    name: Web Performance Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. That CDN browser download
    # was stalling at ~100% and hanging this job to its timeout every night
    # (GitHub reports the timeout as "cancelled"). The browser-cache guard could
    # not self-heal: the cache-populating run is the one that hung, so the cache
    # was never written and every run was a cold miss. Mirrors web-e2e.yml.
    # KEEP IN SYNC: the image tag MUST equal @playwright/test (^1.59.1); the same
    # pin is hard-coded in .github/workflows/{test.yml,web-e2e.yml,performance.yml}
    # — bump all three together on a Playwright upgrade. The container runs on the
    # same runner hardware and the same Chrome-for-Testing build, so performance
    # measurements are unaffected.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # `--user 1001` (pwuser) owns the browsers under /ms-playwright; this is
      # the configuration in Playwright's official GitHub Actions example.
      options: --user 1001
    env:
      TURBO_CACHE_DIR: .turbo
      # Browsers are preinstalled in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-node24-turbo-v4-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-turbo-v4-

      - name: Install dependencies
        # Exclude both desktop-only native projects: this pwuser container has no
        # C toolchain or sudo, and web performance loads neither native surface.
        # See the matching note in test.yml's web-e2e job.
        run: pnpm install --frozen-lockfile --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Build application
        run: |
          TAILWIND_DEBUG=1 pnpm run build --filter @brainstrike/web

      - name: Run performance tests
        timeout-minutes: 30
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"
          PERF_PROJECT: ${{ github.event.inputs.project || 'performance' }}
          PERF_GREP: ${{ github.event.inputs.grep || '' }}
        run: |
          cd apps/web
          unset NO_COLOR
          # --max-failures=3 makes a broken suite report `failure` fast instead
          # of grinding through every test (each timing out ~60s + retry) until
          # the job's own timeout-minutes fires and GitHub mislabels the timeout
          # `cancelled` — matching the web/desktop lanes. Harmless when green
          # (never trips at 0 failures).
          if [ -n "$PERF_GREP" ]; then
            pnpm exec playwright test --project="$PERF_PROJECT" --max-failures=3 -g "$PERF_GREP"
          else
            pnpm exec playwright test --project="$PERF_PROJECT" --max-failures=3
          fi

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-blob-report
          path: apps/web/blob-report
          retention-days: 1

  notify-failure:
    name: Notify performance E2E failure
    needs: web-perf
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # gh issue create / comment are sub-second under normal conditions; cap at
    # 5 min so a GitHub API hang can't burn the GHA default 6-hour wall clock.
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "performance-e2e-failure" \
            --repo "$REPO" \
            --color d93f0b \
            --description "Auto-opened by performance.yml when the scheduled performance run fails" \
            2>/dev/null || true

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" \
            --label "performance-e2e-failure" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Nightly performance E2E failed again. Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "Performance E2E nightly failure ($(date -u +%Y-%m-%d))" \
              --label "performance-e2e-failure" \
              --body "Nightly Performance E2E workflow failed.

          Run: $RUN_URL

          This issue stays open while the failure persists and gets a new comment on each subsequent failure. Close it once the next nightly is green."
          fi
