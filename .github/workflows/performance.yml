# Cloud CI is disabled due to cost; repository GitHub Actions is disabled.
# Preserved workflow definition only: do not enable, dispatch, or rerun it.
# Test locally with pnpm check and report the commands and results.
# Tell the user: CI is disabled due to cost; validation must run locally.

name: Performance E2E

on:
  schedule:
    - cron: '23 7 * * *' # Daily at 07:23 UTC
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'performance'
      grep:
        description: 'Optional grep to filter tests'
        required: false
        default: ''

# Cancel in-progress runs when new commits are pushed to the same PR
# Uses head repo + head_ref for PRs to avoid fork collisions (different forks can use the same branch name)
# For pushes and scheduled runs, uses the full ref to ensure proper isolation
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-perf:
    name: Web Performance Tests
    # 45, not 30: with truncation lifted, a fully-broken suite grinds
    # through every spec's timeout+retry before the job dies — the notifier
    # now also fires on the resulting 'cancelled' mislabel (review #2165).
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Official browser/system-dependency fleet; fixed CfT is provisioned below.
    # Root is Playwright's documented mode for trusted E2E and permits explicit
    # system-tool installation. No custom image publication is required.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 0
    env:
      TURBO_CACHE_DIR: .turbo
      # Browsers are preinstalled in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BRAINSTRIKE_WEB_CHROMIUM_DIR: ${{ runner.temp }}/web-chromium
      pnpm_config_verify_deps_before_run: error
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install web test system tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends unzip lsof procps

      - name: Provision qualified web Chromium
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .nvmrc)"
          mkdir -p apps/web/test-results
          node scripts/provision-web-chromium.mjs "$BRAINSTRIKE_WEB_CHROMIUM_DIR" > apps/web/test-results/web-chromium-provisioning.json

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-node24-turbo-v4-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-turbo-v4-

      - name: Install dependencies
        # Exclude both desktop-only native projects: this container has no
        # C toolchain or sudo, and web performance loads neither native surface.
        # See the matching note in test.yml's web-e2e job.
        run: pnpm install --frozen-lockfile --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Build application
        run: |
          TAILWIND_DEBUG=1 pnpm run build --filter @brainstrike/web

      - name: Run performance tests
        timeout-minutes: 30
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"
          PERF_PROJECT: ${{ github.event.inputs.project || 'performance' }}
          PERF_GREP: ${{ github.event.inputs.grep || '' }}
        run: |
          cd apps/web
          unset NO_COLOR
          # No --max-failures: the lane must report its FULL breach surface. The
          # old truncation made scope unmeasurable (BST-1038 — which specs landed
          # as failed vs did-not-run varied run to run). The CDN-hang class the
          # truncation once mitigated is separately fixed by the pinned container.
          if [ -n "$PERF_GREP" ]; then
            pnpm exec playwright test --project="$PERF_PROJECT" -g "$PERF_GREP"
          else
            pnpm exec playwright test --project="$PERF_PROJECT"
          fi

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-blob-report
          path: apps/web/blob-report
          retention-days: 1

  notify-linear:
    name: Notify Linear
    needs: [web-perf]
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: web-perf=${{ needs.web-perf.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
