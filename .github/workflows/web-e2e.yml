# Cloud CI is disabled due to cost; repository GitHub Actions is disabled.
# Preserved workflow definition only: do not enable, dispatch, or rerun it.
# Test locally with pnpm check and report the commands and results.
# Tell the user: CI is disabled due to cost; validation must run locally.

name: Web E2E

on:
  schedule:
    - cron: '37 7 * * *'
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_ENV: production
  PORT: "8080"
  BASE_URL: http://127.0.0.1:8080

jobs:
  web-full-regression:
    name: Web Full Regression
    runs-on: ubuntu-latest
    # Official browser/system-dependency fleet; fixed CfT is provisioned below.
    # Root is Playwright's documented mode for trusted E2E and permits explicit
    # system-tool installation. No custom image publication is required.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 0
    # Lane scripts have bounded Playwright budgets totalling 130 minutes. Allow
    # eleven one-minute web-server starts plus 24 minutes for setup/build overhead.
    timeout-minutes: 165
    env:
      # Browsers are preinstalled in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BRAINSTRIKE_WEB_CHROMIUM_DIR: ${{ runner.temp }}/web-chromium
      pnpm_config_verify_deps_before_run: error
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install web test system tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends unzip lsof procps

      - name: Provision qualified web Chromium
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .nvmrc)"
          mkdir -p apps/web/test-results
          node scripts/provision-web-chromium.mjs "$BRAINSTRIKE_WEB_CHROMIUM_DIR" > apps/web/test-results/web-chromium-provisioning.json

      # Re-keyed on lockfile+turbo.jsonc content (Series C R9a — same pattern
      # as the setup-workspace composite; see its header comment for the
      # per-sha-key storage-ceiling rationale), instead of a private
      # per-job-per-sha key. This job keeps its own literal cache step (not
      # the composite) because the install below is bespoke.
      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Install dependencies
        # Exclude both desktop-only native projects: this container has no
        # C toolchain or sudo, and web regression loads neither native surface.
        # See the matching note in test.yml's web-e2e job.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Build web
        run: pnpm run build --filter @brainstrike/web

      - name: Run full web regression
        run: pnpm --filter @brainstrike/web run test:e2e:lane:full-regression

      - name: Upload web traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-full-regression-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  notify-linear:
    name: Notify Linear
    needs: [web-full-regression]
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: web-full-regression=${{ needs.web-full-regression.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
