name: Web E2E

on:
  schedule:
    - cron: '37 7 * * *'
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_ENV: production
  PORT: "8080"
  BASE_URL: http://127.0.0.1:8080

jobs:
  web-full-regression:
    name: Web Full Regression
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. That CDN browser download
    # was stalling at ~100% and hanging this job to its timeout every night
    # (GitHub reports the timeout as "cancelled"). Mirrors the web smoke job in
    # test.yml. KEEP IN SYNC: the image tag MUST equal @playwright/test's
    # version; the same pin is hard-coded in .github/workflows/{test.yml,
    # web-e2e.yml,performance.yml} — bump all three together on a Playwright
    # upgrade. `container.image:` cannot consume a workflow expression, so this
    # stays a literal; scripts/verify-playwright-pin-sync.mjs (run via
    # `pnpm test:scripts` in test.yml's Static job) is the automated drift
    # check.
    #
    # NOT folded into the setup-workspace composite (Series C R9a): this
    # container has no C toolchain/sudo, so the bespoke install below excludes
    # both native-build projects — see the matching note in test.yml's web-e2e
    # job.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # `--user 1001` (pwuser) owns the browsers under /ms-playwright; this is
      # the configuration in Playwright's official GitHub Actions example.
      options: --user 1001
    # Lane scripts have bounded Playwright budgets totalling 130 minutes. Allow
    # eleven one-minute web-server starts plus 24 minutes for setup/build overhead.
    timeout-minutes: 165
    env:
      # Browsers are preinstalled in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # Re-keyed on lockfile+turbo.jsonc content (Series C R9a — same pattern
      # as the setup-workspace composite; see its header comment for the
      # per-sha-key storage-ceiling rationale), instead of a private
      # per-job-per-sha key. This job keeps its own literal cache step (not
      # the composite) because the install below is bespoke.
      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Install dependencies
        # Exclude both desktop-only native projects: this pwuser container has no
        # C toolchain or sudo, and web regression loads neither native surface.
        # See the matching note in test.yml's web-e2e job.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Build web
        run: pnpm run build --filter @brainstrike/web

      - name: Run full web regression
        run: pnpm --filter @brainstrike/web run test:e2e:lane:full-regression

      - name: Upload web traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-full-regression-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  notify-linear:
    name: Notify Linear
    needs: [web-full-regression]
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: web-full-regression=${{ needs.web-full-regression.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
