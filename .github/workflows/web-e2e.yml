name: Web E2E

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_ENV: production
  PORT: "8080"
  BASE_URL: http://127.0.0.1:8080

jobs:
  web-full-regression:
    name: Web Full Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-e2e-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-e2e-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build web
        run: pnpm run build --filter @brainstrike/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full web regression
        run: pnpm --filter @brainstrike/web run test:e2e:lane:full-regression

      - name: Upload web traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-full-regression-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore
