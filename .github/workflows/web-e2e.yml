name: Web E2E

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_ENV: production
  PORT: "8080"
  BASE_URL: http://127.0.0.1:8080

jobs:
  web-full-regression:
    name: Web Full Regression
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. That CDN browser download
    # was stalling at ~100% and hanging this job to its timeout every night
    # (GitHub reports the timeout as "cancelled"). Mirrors the web smoke job in
    # test.yml. KEEP IN SYNC: the image tag MUST equal @playwright/test (^1.59.1);
    # the same pin is hard-coded in .github/workflows/{test.yml,web-e2e.yml,
    # performance.yml} — bump all three together on a Playwright upgrade.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # `--user 1001` (pwuser) owns the browsers under /ms-playwright; this is
      # the configuration in Playwright's official GitHub Actions example.
      options: --user 1001
    timeout-minutes: 45
    env:
      # Browsers are preinstalled in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-e2e-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-e2e-${{ github.job }}-

      - name: Install dependencies
        # Exclude apps/desktop: it alone carries node-pty (native, node-gyp). This
        # Playwright container has no C toolchain and pwuser cannot sudo one in, so
        # a full install dies building node-pty. The web regression never loads it
        # (terminal is desktop-only). Keeps root + web + all shared packages. See
        # the matching note in test.yml's web-e2e job.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop'

      - name: Build web
        run: pnpm run build --filter @brainstrike/web

      - name: Run full web regression
        run: pnpm --filter @brainstrike/web run test:e2e:lane:full-regression

      - name: Upload web traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-full-regression-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore
