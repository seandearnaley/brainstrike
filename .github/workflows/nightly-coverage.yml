# Cloud CI is disabled due to cost; repository GitHub Actions is disabled.
# Preserved workflow definition only: do not enable, dispatch, or rerun it.
# Test locally with pnpm check and report the commands and results.
# Tell the user: CI is disabled due to cost; validation must run locally.

name: Nightly Coverage

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # BST-1063/#2206 review: the pg_textsearch durability gate is opt-in
  # (TEST_ENABLE_PG_TEXTSEARCH_DURABILITY) and, before this job, ran in NO CI
  # lane — the 1.3.1 re-qualification rested on one-laptop evidence that
  # never re-runs. This nightly matrix turns that into recurring
  # multi-platform evidence (closing BST-1080's Linux/Windows debt by
  # automation) and any future PGlite/pg_textsearch family bump inherits it.
  # It exercises the corruption-triggering shape from the migration-065
  # quarantine report: UPDATE/DELETE/VACUUM churn against a BM25-indexed
  # file_chunks, with heap/index agreement checks per cycle.
  pg-textsearch-durability:
    name: pg_textsearch durability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Run durability gate
        timeout-minutes: 25
        env:
          NODE_ENV: test
          TEST_TIMEOUT_MULTIPLIER: "2"
        run: pnpm --filter @brainstrike/db test:pg-textsearch-durability

  # BST-1875: the durability gate above closes cleanly, so it can never see
  # crash-recovery damage. This job SIGKILLs a writer 200 times per platform
  # mid-transaction against the real migrated schema, then runs desktop's
  # production recovery and verifies every index access method. A PR run of the
  # same file (10 iterations) gates every db change inside required `Unit`;
  # this is the 200-iteration qualification a PGlite/pg_textsearch bump needs.
  # 200 iterations took 665 s on a laptop (macOS arm64), the only measurement so
  # far. The ceilings assume a runner 3-5x slower, Windows especially; tighten
  # them once the first Linux and Windows durations are recorded in
  # docs/agents/database/pg-textsearch-qualification.md.
  sigkill-crash-gate:
    name: SIGKILL crash gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Run SIGKILL crash gate
        timeout-minutes: 115
        env:
          NODE_ENV: test
          TEST_TIMEOUT_MULTIPLIER: "2"
          CRASH_GATE_ITERATIONS: "200"
        run: pnpm --filter @brainstrike/db test:crash-gate

  package-coverage:
    name: Coverage packages (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measured from scheduled run 30081361078. The heavyweight packages
          # get isolated failure/timeout domains; the negative-filter shard
          # remains the automatic home for newly added packages.
          - shard: agent
            concurrency: 1
            filters: '--filter=@brainstrike/agent'
          - shard: app-shell
            concurrency: 2
            filters: '--filter=@brainstrike/assistant-data --filter=@brainstrike/app-shell --filter=@brainstrike/web'
          - shard: desktop
            concurrency: 1
            filters: '--filter=@brainstrike/desktop'
          - shard: embeddings-preferences
            concurrency: 2
            filters: '--filter=@brainstrike/embeddings --filter=@brainstrike/app-state --filter=@brainstrike/settings-ui'
          - shard: ui-db-explorer
            concurrency: 2
            filters: '--filter=@brainstrike/assistant-ui --filter=@brainstrike/ui --filter=@brainstrike/db-explorer'
          - shard: remaining
            concurrency: 4
            filters: >-
              --filter=!@brainstrike/db
              --filter=!@brainstrike/agent
              --filter=!@brainstrike/app-shell
              --filter=!@brainstrike/assistant-data
              --filter=!@brainstrike/web
              --filter=!@brainstrike/desktop
              --filter=!@brainstrike/embeddings
              --filter=!@brainstrike/app-state
              --filter=!@brainstrike/settings-ui
              --filter=!@brainstrike/assistant-ui
              --filter=!@brainstrike/ui
              --filter=!@brainstrike/db-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      - name: Run package shard coverage
        timeout-minutes: 30
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage
          ${{ matrix.filters }}
          --concurrency=${{ matrix.concurrency }}
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Bundle package shard coverage
        if: always()
        run: |
          find packages apps -type f -name "coverage-final.json" -path "*/coverage/*" -print0 > coverage-files
          if [ ! -s coverage-files ]; then
            echo "::error::Package shard ${{ matrix.shard }} produced no coverage artifacts."
            exit 1
          fi
          tar --null --files-from=coverage-files --create --file="nightly-coverage-${{ matrix.shard }}.tar"

      - name: Upload package shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-${{ matrix.shard }}
          path: nightly-coverage-${{ matrix.shard }}.tar
          retention-days: 7
          if-no-files-found: error

  db-coverage-shard:
    name: Coverage DB (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: db-1
            vitest_shard: 1/2
          - shard: db-2
            vitest_shard: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf packages/db/.vitest/blob .nyc_output

      - name: Run DB coverage shard
        timeout-minutes: 25
        env:
          COVERAGE: "true"
          DB_TEST_SHARD: ${{ matrix.vitest_shard }}
          NODE_ENV: test
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage:db:shard
          --filter="@brainstrike/db"
          --concurrency=1
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Verify DB blob report
        run: |
          blob_count=$(find packages/db/.vitest/blob -maxdepth 1 -type f -name "blob-*.json" | wc -l | tr -d ' ')
          if [ "$blob_count" -ne 1 ]; then
            echo "::error::Expected one Vitest blob from ${{ matrix.shard }}; found ${blob_count}."
            exit 1
          fi

      - name: Upload DB blob report
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: db-vitest-blob-${{ matrix.shard }}
          path: packages/db/.vitest/blob/blob-*.json
          retention-days: 7
          if-no-files-found: error

  db-coverage:
    name: Coverage DB merge
    needs: [db-coverage-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Download DB blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: db-vitest-blob-*
          path: packages/db/.vitest/blob
          merge-multiple: true

      - name: Merge DB coverage with Vitest
        run: |
          blob_count=$(find packages/db/.vitest/blob -maxdepth 1 -type f -name "blob-*.json" | wc -l | tr -d ' ')
          if [ "$blob_count" -ne 2 ]; then
            echo "::error::Expected two Vitest DB blob reports; found ${blob_count}."
            exit 1
          fi
          pnpm --filter @brainstrike/db exec vitest \
            --merge-reports=.vitest/blob \
            --project=unit \
            --coverage \
            --coverage.reportsDirectory=coverage \
            --coverage.reporter=json \
            --coverage.reporter=lcov \
            --coverage.reporter=text
          if [ ! -f packages/db/coverage/coverage-final.json ]; then
            echo "::error::Vitest merged no DB coverage-final.json artifact."
            exit 1
          fi

      - name: Bundle DB coverage
        run: tar --create --file=nightly-coverage-db.tar packages/db/coverage/coverage-final.json

      - name: Upload DB coverage
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-db
          path: nightly-coverage-db.tar
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: Coverage
    needs:
      - package-coverage
      - db-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Download coverage shards
        uses: actions/download-artifact@v7
        with:
          pattern: nightly-coverage-*
          path: .coverage-artifacts

      - name: Restore coverage shards
        run: |
          archive_count=$(find .coverage-artifacts -type f -name "nightly-coverage-*.tar" | wc -l | tr -d ' ')
          # Six package matrix shards plus the natively merged DB archive.
          if [ "$archive_count" -ne 7 ]; then
            echo "::error::Expected 7 coverage shard archives; found ${archive_count}."
            exit 1
          fi
          while IFS= read -r -d '' archive; do
            tar --extract --file="$archive"
          done < <(find .coverage-artifacts -type f -name "nightly-coverage-*.tar" -print0)

      - name: Prepare coverage workspace
        id: coverage
        run: |
          pnpm coverage:prepare-workspace
          coverage_files=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          if [ "$coverage_files" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "::error::No coverage-final.json files were generated."
            exit 1
          fi

      - name: Enforce coverage thresholds
        if: steps.coverage.outputs.has_coverage == 'true'
        run: pnpm coverage:enforce

      - name: Generate merged coverage report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: nightly
          fail_ci_if_error: false

      - name: Bundle coverage files
        run: |
          mkdir -p coverage-bundle
          find . -name "coverage-final.json" -path "*/coverage/*" -exec cp --parents {} coverage-bundle/ \;
          tar -cf coverage-bundle.tar coverage-bundle/

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage-bundle.tar
          retention-days: 7
          if-no-files-found: ignore

  notify-linear:
    name: Notify Linear
    needs: [pg-textsearch-durability, sigkill-crash-gate, package-coverage, db-coverage-shard, db-coverage, coverage]
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: pg-textsearch-durability=${{ needs.pg-textsearch-durability.result }},sigkill-crash-gate=${{ needs.sigkill-crash-gate.result }},package-coverage=${{ needs.package-coverage.result }},db-coverage-shard=${{ needs.db-coverage-shard.result }},db-coverage=${{ needs.db-coverage.result }},coverage=${{ needs.coverage.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
