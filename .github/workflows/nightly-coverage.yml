name: Nightly Coverage

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-coverage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-coverage-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      - name: Run package coverage
        timeout-minutes: 30
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage
          --filter="!@brainstrike/db"
          --concurrency=4
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Run DB runtime coverage
        timeout-minutes: 10
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage:db:runtime
          --filter="@brainstrike/db"
          --concurrency=1
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Run DB serial coverage lanes
        timeout-minutes: 30
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run
          test:coverage:db:architecture
          test:coverage:db:chunking
          test:coverage:db:migrations
          test:coverage:db:queue
          test:coverage:db:repositories
          test:coverage:db:search
          --filter="@brainstrike/db"
          --concurrency=1
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Prepare coverage workspace
        id: coverage
        run: |
          pnpm coverage:prepare-workspace
          coverage_files=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          if [ "$coverage_files" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "::error::No coverage-final.json files were generated."
            exit 1
          fi

      - name: Enforce coverage thresholds
        if: steps.coverage.outputs.has_coverage == 'true'
        run: pnpm coverage:enforce

      - name: Generate merged coverage report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: nightly
          fail_ci_if_error: false

      - name: Bundle coverage files
        run: |
          mkdir -p coverage-bundle
          find . -name "coverage-final.json" -path "*/coverage/*" -exec cp --parents {} coverage-bundle/ \;
          tar -cf coverage-bundle.tar coverage-bundle/

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage-bundle.tar
          retention-days: 7
          if-no-files-found: ignore

  notify-failure:
    name: Notify nightly coverage failure
    needs: coverage
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # gh issue create / comment are sub-second under normal conditions; cap at
    # 5 min so a GitHub API hang can't burn the GHA default 6-hour wall clock.
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "nightly-coverage-failure" \
            --repo "$REPO" \
            --color d93f0b \
            --description "Auto-opened by nightly-coverage.yml when the scheduled coverage run fails" \
            2>/dev/null || true

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" \
            --label "nightly-coverage-failure" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Nightly coverage failed again. Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "Nightly coverage failure ($(date -u +%Y-%m-%d))" \
              --label "nightly-coverage-failure" \
              --body "Nightly coverage workflow failed.

          Run: $RUN_URL

          This issue stays open while the failure persists and gets a new comment on each subsequent failure. Close it once the next nightly is green."
          fi
