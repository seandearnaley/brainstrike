name: Nightly Coverage

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  package-coverage:
    name: Coverage packages (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measured from scheduled run 30081361078. The heavyweight packages
          # get isolated failure/timeout domains; the negative-filter shard
          # remains the automatic home for newly added packages.
          - shard: agent
            concurrency: 1
            filters: '--filter=@brainstrike/agent'
          - shard: app-shell
            concurrency: 2
            filters: '--filter=@brainstrike/app-shell --filter=@brainstrike/web'
          - shard: desktop
            concurrency: 1
            filters: '--filter=@brainstrike/desktop'
          - shard: embeddings-preferences
            concurrency: 2
            filters: '--filter=@brainstrike/embeddings --filter=@brainstrike/preferences'
          - shard: ui-db-explorer
            concurrency: 2
            filters: '--filter=@brainstrike/ui --filter=@brainstrike/db-explorer'
          - shard: remaining
            concurrency: 4
            filters: >-
              --filter=!@brainstrike/db
              --filter=!@brainstrike/agent
              --filter=!@brainstrike/app-shell
              --filter=!@brainstrike/web
              --filter=!@brainstrike/desktop
              --filter=!@brainstrike/embeddings
              --filter=!@brainstrike/preferences
              --filter=!@brainstrike/ui
              --filter=!@brainstrike/db-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      - name: Run package shard coverage
        timeout-minutes: 30
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage
          ${{ matrix.filters }}
          --concurrency=${{ matrix.concurrency }}
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Bundle package shard coverage
        if: always()
        run: |
          find packages apps -type f -name "coverage-final.json" -path "*/coverage/*" -print0 > coverage-files
          if [ ! -s coverage-files ]; then
            echo "::error::Package shard ${{ matrix.shard }} produced no coverage artifacts."
            exit 1
          fi
          tar --null --files-from=coverage-files --create --file="nightly-coverage-${{ matrix.shard }}.tar"

      - name: Upload package shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-${{ matrix.shard }}
          path: nightly-coverage-${{ matrix.shard }}.tar
          retention-days: 7
          if-no-files-found: error

  db-coverage:
    name: Coverage DB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      - name: Run DB runtime coverage
        timeout-minutes: 10
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run test:coverage:db:runtime
          --filter="@brainstrike/db"
          --concurrency=1
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Run DB serial coverage lanes
        timeout-minutes: 30
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
        run: >
          pnpm turbo run
          test:coverage:db:architecture
          test:coverage:db:chunking
          test:coverage:db:migrations
          test:coverage:db:queue
          test:coverage:db:repositories
          test:coverage:db:search
          --filter="@brainstrike/db"
          --concurrency=1
          --summarize
          --log-order=grouped
          --cache-dir=.turbo

      - name: Bundle DB coverage
        if: always()
        run: |
          find packages/db -type f -name "coverage-final.json" -path "*/coverage-*/*" -print0 > coverage-files
          if [ ! -s coverage-files ]; then
            echo "::error::DB coverage produced no coverage artifacts."
            exit 1
          fi
          tar --null --files-from=coverage-files --create --file=nightly-coverage-db.tar

      - name: Upload DB coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-db
          path: nightly-coverage-db.tar
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: Coverage
    needs:
      - package-coverage
      - db-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Download coverage shards
        uses: actions/download-artifact@v7
        with:
          pattern: nightly-coverage-*
          path: .coverage-artifacts

      - name: Restore coverage shards
        run: |
          archive_count=$(find .coverage-artifacts -type f -name "nightly-coverage-*.tar" | wc -l | tr -d ' ')
          if [ "$archive_count" -ne 7 ]; then
            echo "::error::Expected 7 coverage shard archives; found ${archive_count}."
            exit 1
          fi
          while IFS= read -r -d '' archive; do
            tar --extract --file="$archive"
          done < <(find .coverage-artifacts -type f -name "nightly-coverage-*.tar" -print0)

      - name: Prepare coverage workspace
        id: coverage
        run: |
          pnpm coverage:prepare-workspace
          coverage_files=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          if [ "$coverage_files" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "::error::No coverage-final.json files were generated."
            exit 1
          fi

      - name: Enforce coverage thresholds
        if: steps.coverage.outputs.has_coverage == 'true'
        run: pnpm coverage:enforce

      - name: Generate merged coverage report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: nightly
          fail_ci_if_error: false

      - name: Bundle coverage files
        run: |
          mkdir -p coverage-bundle
          find . -name "coverage-final.json" -path "*/coverage/*" -exec cp --parents {} coverage-bundle/ \;
          tar -cf coverage-bundle.tar coverage-bundle/

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage-bundle.tar
          retention-days: 7
          if-no-files-found: ignore

  notify-failure:
    name: Notify nightly coverage failure
    needs:
      - package-coverage
      - db-coverage
      - coverage
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.package-coverage.result != 'success' ||
       needs.db-coverage.result != 'success' ||
       needs.coverage.result != 'success')
    runs-on: ubuntu-latest
    # gh issue create / comment are sub-second under normal conditions; cap at
    # 5 min so a GitHub API hang can't burn the GHA default 6-hour wall clock.
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "nightly-coverage-failure" \
            --repo "$REPO" \
            --color d93f0b \
            --description "Auto-opened by nightly-coverage.yml when the scheduled coverage run fails" \
            2>/dev/null || true

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" \
            --label "nightly-coverage-failure" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Nightly coverage failed again. Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "Nightly coverage failure ($(date -u +%Y-%m-%d))" \
              --label "nightly-coverage-failure" \
              --body "Nightly coverage workflow failed.

          Run: $RUN_URL

          This issue stays open while the failure persists and gets a new comment on each subsequent failure. Close it once the next nightly is green."
          fi
