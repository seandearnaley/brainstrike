name: MCP Verification

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  verify:
    name: Exhaustive MCP verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Run exhaustive MCP verification
        timeout-minutes: 8
        run: pnpm run verify:mcp -- --profile exhaustive --output artifacts/exhaustive-evidence.json

      - name: Upload MCP verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: mcp-verification-${{ github.sha }}
          path: packages/mcp-test-lab/artifacts/exhaustive-evidence.json
          if-no-files-found: error
          retention-days: 14
