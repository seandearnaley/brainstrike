name: Test

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  admission:
    name: Quiet-head admission
    # PR synchronization is bursty: the measured 2026-07-15..19 sample reached
    # 44 concurrent Linux jobs, while 31.3% of Test runs were ultimately
    # cancelled. Hold the fan-out on GitHub's $0.002/min 1-core runner so a
    # follow-up push can cancel this cheap sleep instead of seven build/test
    # runners. Push and workflow_dispatch events pass through immediately.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.admission.outputs.result }}
    steps:
      - name: Wait for pull request activity to settle
        if: github.event_name == 'pull_request'
        run: sleep 120

      - name: Admit the current pull request head
        id: admission
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') {
              core.notice('Quiet-head admission is immediate outside pull requests.');
              return 'true';
            }

            const eventPull = context.payload.pull_request;
            const pullNumber = eventPull?.number;
            const runHead = eventPull?.head?.sha;
            if (!pullNumber || typeof runHead !== 'string' || runHead.length === 0) {
              core.setFailed('Cannot establish the pull request number and run head from the event payload.');
              return 'false';
            }

            let pull;
            try {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }));
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.setFailed(`Cannot establish the current head for PR #${pullNumber}: ${message}`);
              return 'false';
            }

            const currentHead = pull.head.sha;
            if (typeof currentHead !== 'string' || currentHead.length === 0) {
              core.setFailed(`GitHub returned no current head SHA for PR #${pullNumber}.`);
              return 'false';
            }

            if (currentHead !== runHead) {
              core.notice(
                `PR #${pullNumber} advanced from ${runHead} to ${currentHead}; expensive jobs will not start for the superseded head.`
              );
              return 'false';
            }

            core.notice(`PR #${pullNumber} head ${runHead} remained quiet for 120 seconds; releasing the full test graph.`);
            return 'true';

  static:
    name: Static
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    # Series C R9b: arm64 runners became available for private repos on
    # 2026-01-29, and cost 37% less per minute than ubuntu-latest (x64).
    # Probe P1 measured this job's full step suite (install, secret scan,
    # script tests, lane-manifest checks, lint, type-check) GENUINELY
    # RUNNING and PASSING on ubuntu-24.04-arm, with wall-clock parity to x64
    # (~3.0m either arch — arm64 is NOT faster, only cheaper per minute).
    # See docs/agents/ci-quality.md / the Series C design doc for the probe
    # results. `.turbo` cache key (setup-workspace/action.yml) already
    # includes `runner.arch`, so this move cannot cross-restore an
    # incompatible cache layer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      # Checkout MUST stay here, ahead of the composite: a local `uses: ./...`
      # action is read off the runner's filesystem, so the repo has to be on
      # disk before it can resolve. See setup-workspace/action.yml's header.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Secret scan
        run: pnpm secrets:scan

      # Includes scripts/__tests__/verify-playwright-pin-sync.test.mjs — the
      # single-source guard that the Playwright container image tag pinned in
      # test.yml/web-e2e.yml/performance.yml matches @playwright/test's
      # installed version. `container.image:` cannot consume a workflow
      # expression, so the tag stays a literal in all three files and this
      # guard is the verification (throws on drift, and throws if it can no
      # longer find a pin at all rather than passing vacuously).
      - name: Script tests
        run: pnpm test:scripts

      - name: Check DB test + coverage lane assignments
        # These are two DERIVED VIEWS of one shared manifest
        # (packages/db/scripts/db-test-lane-manifest.mjs), not two registries to be
        # maintained by hand: `test-lanes` (PR unit lanes) and `coverage-lanes`
        # (nightly coverage lanes) both import it, and a test's coverage lane is
        # resolved from its unit lane automatically. Adding a test therefore takes ONE
        # edit — a regex in `dbUnitLaneDefinitions` — and cannot leave the two views
        # inconsistent the way the old hand-synced registries could (issue #1101).
        #
        # Still worth running both here: a brand-new UNIT LANE needs its own
        # `coverageDefaultsByUnitLane` entry, and only the coverage check catches a
        # missing one (it fails loudly rather than dropping the test). The checks
        # validate lane assignment without executing the suite (~1s), so drift
        # surfaces on the PR rather than at 2am in Nightly Coverage.
        run: |
          pnpm --filter @brainstrike/db test:db:check-lanes
          pnpm --filter @brainstrike/db test:coverage:db:check-lanes

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run type-check

  unit:
    name: Unit
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    # Series C R9b: arm64 runners became available for private repos on
    # 2026-01-29, and cost 37% less per minute than ubuntu-latest (x64).
    # Probe P1 measured this job's full suite — including the 6 `cache: false`
    # `test:integration` lanes (real PGlite, embeddings: the heaviest,
    # most native-dependent work in this workflow) — GENUINELY RUNNING and
    # PASSING on ubuntu-24.04-arm, with wall-clock parity to x64 (arm64 is
    # NOT faster, only cheaper per minute). `.turbo` cache key
    # (setup-workspace/action.yml) already includes `runner.arch`, so this
    # move cannot cross-restore an incompatible cache layer.
    runs-on: ubuntu-24.04-arm
    # Foundational PRs (e.g. changes to @brainstrike/utils or lint presets)
    # pull in many dependent packages via pnpm's `...[ref]` filter. Keep Unit
    # aligned with Coverage so broad but valid changes do not time out mid-run.
    timeout-minutes: 60
    steps:
      # `fetch-depth: 0` is REQUIRED here: the turbo filter below diffs against
      # `origin/$BASE_REF`, which needs full history. Checkout stays in the
      # caller (not the composite) — see setup-workspace/action.yml's header.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      # NO standalone build step (B4). Test lanes resolve workspace imports
      # from SOURCE (the B3 #1651 registry + the app vitest alias maps), so
      # tests no longer need `dist` to exist, and `test.dependsOn` is the
      # no-build `topo` transit node instead of `^build` (turbo.jsonc). The few
      # lanes that genuinely consume built artifacts (packages/utils' own-dist
      # test, packages/db's nested-tsc test) declare exact `#build` edges in
      # their own turbo.json, and `turbo run test` SELF-BUILDS exactly those
      # (verified: the whole-repo test+test:integration graph contains 3 build
      # tasks — utils + its dep closure — and a full clean-state no-dist run is
      # green; see the B4 PR). The predecessor step's #1066/#1207 rationale
      # ("exports maps pointing at dist fail to resolve at test time") is
      # retired by source resolution, and unlike that incident a regression
      # here fails LOUDLY on the always-clean CI runner instead of passing
      # against stale dist. The Build job below still exercises the full build.

      # PR-affected unit tests routed THROUGH turbo so the remote cache
      # (TURBO_TOKEN/TURBO_TEAM, set at the workflow `env:` block above and
      # inherited by this step) covers test execution — the only expensive,
      # previously-uncached CI step.
      #
      # `--filter="...[origin/$BASE_REF]"` is turbo's EXPLICIT git-range filter:
      # `...[ref]` = packages changed since `ref` + their dependents. It is
      # deliberately NOT `--affected`: turbo's `--affected` derives its own
      # base/head and over-selects on merge commits, the exact reason the prior
      # pnpm-filter approach spelled the range out. Turbo's task graph skips
      # packages with no `test` script (no `--if-present` needed) and never runs
      # the workspace-root task under a plain `turbo run` (so the old pnpm-only
      # `!./` root exclusion is unnecessary — verified via `--dry=json`).
      #
      # SELECTION vs the retired `pnpm --filter "...[ref]"`: measured across four
      # real historical ranges (HEAD~1, origin/main~10/~20/~30 — see the PR body
      # for the exact package lists), turbo's selection is a strict SUPERSET of
      # pnpm's. It NEVER under-selects — every package the old pnpm path would
      # have tested is always selected, so a changed package can never be
      # silently skipped/under-tested. On ranges whose diff touches root/global
      # files (lockfile, pnpm-workspace.yaml) turbo may additionally pull in a
      # few leaf config packages pnpm did not; that is safe over-selection
      # (marginal CI time, usually a cache hit — never missed coverage).
      #
      # TURBO_TEST_MODE=unit is set EXPLICITLY here so the `test` task cache key
      # (turbo.jsonc `test.env` = [NODE_ENV, TURBO_TEST_MODE]) matches the push
      # path below AND the local `pnpm test` script (scripts/run-env.mjs sets the
      # same value) — otherwise PR and push runs would compute different hashes
      # and never share cache entries. --concurrency=4 preserves the prior
      # `--workspace-concurrency=4` parallelism cap.
      #
      # PHASE SPLIT (two sequential turbo invocations, one named step each).
      # `test` and `test:integration` previously ran in a SINGLE
      # `turbo run test test:integration --concurrency=4`. On whole-repo-
      # selection PRs (any global-file edit) that starved the runner: once the
      # cacheable `test` lanes fill from cache, all 4 turbo slots end up occupied
      # exclusively by the heavy UNCACHED lanes — the `test:integration` suites
      # (embeddings, agent, app-shell, desktop, web, file-import) plus the
      # whole-task-uncached `db#test` — i.e. 4 concurrent real-PGlite/wall-clock
      # suites on a small hosted runner (PR #1650 run 29294546967: job-timeout,
      # then lost-runner, then a 4-lane turbo cancellation cascade). The lanes
      # are individually sound (local `--concurrency=1` = 128/128 green); this is
      # the documented PGlite-under-CI-load flake class manifesting through lane
      # CONCURRENCY, so the fix is at source in CI.
      #
      # Phase 1 runs the cacheable `test` lanes (+ the whole-task-uncached
      # db/secure-fs-native `test` lanes, mostly light or singular) at
      # --concurrency=4. Phase 2 runs ONLY the uncached env-sensitive
      # `test:integration` lanes (root turbo.jsonc, `cache: false`) capped at
      # --concurrency=2 so at most two real-subsystem suites run at once. Two
      # named steps (not one `&&` step) give clearer failure attribution in the
      # UI; turbo re-resolves quickly on the second invocation. turbo.jsonc's
      # `test:integration` has `dependsOn: ["topo"]` (the B4 no-build transit
      # node), so phase 2's graph builds nothing and is cheap. turbo skips each
      # task for packages that do not define it (no `--if-present` needed).
      - name: Pull request affected unit tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test --filter="...[origin/$BASE_REF]" --concurrency=4

      - name: Pull request affected integration tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test:integration --filter="...[origin/$BASE_REF]" --concurrency=2

      # Push (main) + workflow_dispatch: full non-affected suite routed through
      # turbo so the remote cache (TURBO_TOKEN/TURBO_TEAM inherited from the
      # workflow `env:` block) covers these runs too, and so push and PR runs
      # share cache entries. TURBO_TEST_MODE=unit (below) keeps the `test` task
      # cache key identical to the PR path and the local `pnpm test` script.
      # Same PHASE SPLIT as the PR path: phase 1 runs the cacheable `test` lanes
      # at --concurrency=4 (matches the PR path and the root `pnpm test`
      # script), phase 2 runs the uncached env-sensitive `test:integration`
      # lanes capped at --concurrency=2 so at most two real-subsystem suites run
      # at once. See the PR-path comment above for the starvation rationale.
      #
      # @brainstrike/embeddings is NO LONGER excluded (Series A4, #1629): its
      # env-sensitive files now carry the `*.integration.test.*` suffix and run
      # in the uncached `test:integration` lane, so its pure `test` lane is
      # cacheable and is finally CI-covered on push. The manual model-download
      # tier stays out of CI by FILENAME (`*.models.test.*`, selected only by
      # `test:models` via vitest.models.config.mts) — not by this package
      # filter — so dropping the filter cannot pull model downloads into CI.
      - name: Push and manual unit tests
        if: github.event_name != 'pull_request'
        env:
          COVERAGE: "false"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test --concurrency=4

      - name: Push and manual integration tests
        if: github.event_name != 'pull_request'
        env:
          COVERAGE: "false"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test:integration --concurrency=2

  # The `coverage` job MOVED to .github/workflows/coverage.yml. It needs a
  # `coverage`-label trigger, which would mean subscribing THIS workflow to
  # the `pull_request` `labeled` action — and this workflow is the sole
  # producer of every required status check, so every label add would then
  # report those checks as `skipped` and grey out the merge box (measured on
  # PR #1664). See the header comment in coverage.yml for the full rationale.
  # Coverage is advisory; nightly-coverage.yml remains the threshold gate.

  build:
    name: Build
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Build
        run: TAILWIND_DEBUG=1 pnpm run build

      - name: Validate CSS bundle
        run: |
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          fi

          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          fi

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            apps/desktop/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  native-windows:
    name: Native Windows
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No turbo-cache: this job doesn't route through turbo. `shell: bash` in
      # the composite's install step works on windows-latest via the runner's
      # bundled Git Bash, same as every other step in this composite already
      # running fine cross-platform.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build and test secure filesystem capability
        run: pnpm --filter @brainstrike/secure-fs-native test

  native-electron:
    name: Native Electron Package
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --concurrency=4

      - name: Load the native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:electron

      - name: Package the desktop application
        run: pnpm --filter @brainstrike/desktop run pack

      - name: Load the packaged native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:packaged

  web-e2e:
    name: Web E2E
    if: github.event_name != 'workflow_dispatch' && needs.admission.outputs.admitted == 'true'
    needs: [admission, build]
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. This removes the CDN
    # browser download that was stalling at 100% and hanging the job to its
    # timeout. KEEP IN SYNC: the image tag MUST equal @playwright/test's
    # version; the same pin is hard-coded in .github/workflows/{test.yml,
    # web-e2e.yml,performance.yml} — bump all three together on a Playwright
    # upgrade. `container.image:` cannot consume a workflow expression, so this
    # stays a literal; scripts/verify-playwright-pin-sync.mjs (run via
    # `pnpm test:scripts` in the Static job) is the automated drift check.
    #
    # NOT folded into the setup-workspace composite (Series C R9a): this
    # container has no C toolchain/sudo, so the install below excludes both
    # native-build projects — a different `pnpm install` invocation than the
    # composite's fixed `pnpm install --frozen-lockfile`. Parameterizing the
    # composite's install command for this one caller is the documented trap;
    # this job's setup stays bespoke literal YAML on purpose.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # `--user 1001` (pwuser) is the configuration shown in Playwright's
      # official GitHub Actions container example. The browsers under
      # /ms-playwright are owned by this user; it is the documented, tested path.
      options: --user 1001
    timeout-minutes: 25
    env:
      NODE_ENV: production
      PORT: "8080"
      BASE_URL: http://127.0.0.1:8080
      # Browsers are preinstalled here in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        # Exclude both desktop-only native projects: this pwuser container has no
        # C toolchain or sudo, and web E2E loads neither node-pty nor secure-fs.
        # Keeps root + web + every shared package (42/44 projects). Do NOT revert
        # to a bare full install; node-gyp will fail before Playwright starts.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Run web smoke
        run: pnpm --filter @brainstrike/web run test:e2e:lane:smoke

      - name: Upload web smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-main-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop E2E
    if: github.event_name != 'workflow_dispatch' && needs.admission.outputs.admitted == 'true'
    needs: [admission, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    # NOT folded into the setup-workspace composite (Series C R9a): the
    # Electron-version lookup + binary cache below must run BETWEEN Node setup
    # and `pnpm install`, which the composite's fixed step order (checkout ->
    # pnpm -> node -> turbo cache -> install, nothing injectable in the
    # middle) cannot express. Bespoke literal YAML on purpose.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Get Electron version
        id: electron-version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v2-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — it does NOT use a `playwright install chromium` browser. So we
      # only need the Chromium system libraries (apt), not the browser binary
      # download from cdn.playwright.dev (which was stalling and hanging the
      # job). `install-deps` is apt-only and does not touch the browser CDN.
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # The desktop smoke launches the REAL Electron binary via
      # `_electron.launch`. On an ~/.cache/electron cache miss the binary may
      # not be extracted into node_modules, so the app throws "Electron failed
      # to install correctly". Force-extract it (uses the warm cache when
      # present, else downloads from GitHub Releases — NOT the Playwright CDN),
      # then VERIFY the binary exists so any provisioning gap fails loudly here
      # rather than cryptically inside the test. This runs immediately before
      # the smoke so no later step (e.g. artifact extraction) can disturb it.
      # Provision the Electron binary deterministically. electron/install.js is
      # unreliable here: on an @electron/get cache hit it reaches its
      # `extract-zip` step but the (un-awaited) extraction never completes and
      # the process exits 0, leaving no dist/ or path.txt — so the app throws
      # "Electron failed to install correctly". Instead, download the prebuilt
      # zip directly from GitHub Releases (reliable host, NOT the Playwright
      # CDN) and extract it with the system `unzip`, then write path.txt and
      # hard-verify the executable exists before the smoke launches it.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/electron.zip" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "${RUNNER_TEMP}/electron.zip" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session provides an ephemeral D-Bus session so Chromium
      # inside Electron doesn't spew `[ERROR:dbus/bus.cc:405] Failed to
      # connect to the bus` for every spawned process. Tests pass without
      # this (Electron handles the missing bus gracefully), but suppressing
      # the noise keeps the smoke log readable.
      # dbus-run-session is provided by the `dbus` package, pre-installed
      # on the ubuntu-latest runner.
      - name: Run desktop smoke
        working-directory: apps/desktop
        run: dbus-run-session -- pnpm run test:e2e:lane:smoke

      - name: Upload desktop smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-main-test-results
          path: apps/desktop/test-results/
          retention-days: 1
          if-no-files-found: ignore
