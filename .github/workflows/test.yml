name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write # For dependency scanning

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.8.0'

      # Clear existing caches first
      - name: Clear Turborepo cache
        run: rm -rf .turbo

      - name: Get pnpm cache directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Clear pnpm cache
        run: rm -rf ${{ steps.pnpm-cache.outputs.dir }}

      - name: Cache pnpm and Turborepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.dir }}
            ${{ github.workspace }}/.turbo
          key: ${{ runner.os }}-pnpm-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-turbo-

      - name: Install dependencies
        run: pnpm install

      # Install missing coverage dependency for tests
      - name: Install Vitest coverage dependencies
        run: pnpm add -D -w @vitest/coverage-v8

      # Install Codecov plugin for bundle analysis (needed by vite config in apps/web)
      - name: Install Codecov Vite plugin
        run: pnpm add -D -F @brainstrike/web @codecov/vite-plugin

      - name: Verify package links
        run: |
          echo "Verifying package links..."
          pnpm list -r --depth 0
          echo "Checking for workspace:* dependencies..."
          grep -r "workspace:" --include="package.json" .

      - name: Verify types package structure
        run: |
          echo "Types package structure:"
          ls -la packages/types/
          echo "Types package tsconfig.json:"
          cat packages/types/tsconfig.json

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true # Don't fail the build, but report issues

      - name: Run Biome checks
        run: pnpm run lint
        continue-on-error: true # Don't fail the build due to linting issues

      # Build all packages (Rely on Turborepo's dependency management)
      - name: Build all packages
        run: pnpm run build
        env:
          CI: true
          NODE_ENV: production
        continue-on-error: true

      # Now type-check after packages are built
      - name: Type check
        run: pnpm run type-check
        continue-on-error: true # Continue even if type checking fails

      - name: Run Knip (detect unused code)
        run: pnpm run knip -- --max-issues=10 --cache # Uses config from knip.jsonc
        continue-on-error: true # Initially allow failures until codebase is cleaned up

      - name: Run tests with coverage
        run: pnpm run test:coverage # Explicitly run coverage script
        continue-on-error: true # Continue even if tests fail

      # Separate Playwright cache to avoid permission issues
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}

      # Install Playwright browsers AND dependencies together if cache missed
      - name: Install Playwright browsers and dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        # Run the command from within the apps/web directory
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests with coverage
        run: |
          # Ensure port 3000 is free
          if lsof -ti:3000 >/dev/null; then
            lsof -ti:3000 | xargs -r kill -9
          fi
          
          pnpm run test:e2e
        env:
          CI: true
          PORT: 3000
          BASE_URL: http://127.0.0.1:3000
        continue-on-error: true # Continue even if E2E tests fail

      - name: Process coverage reports
        if: always()
        run: |
          pnpm run coverage:merge
          pnpm run coverage:report
        continue-on-error: true # Don't fail if these scripts aren't defined yet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            apps/web/playwright-report/
            apps/web/test-results/
            **/coverage-report/
          retention-days: 30

      # Add dependency scanning with a more appropriate action
      - name: Run dependency vulnerability scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SYNK_TOKEN }}
