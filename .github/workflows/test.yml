name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  security-events: write # For Snyk & dependency scanning
  checks: write # For ReviewDog

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env: # Common env vars for all steps
      CI: "true"
      # NODE_ENV is now set per step where its specific value is critical

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by Turborepo for determining affected packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-cache-dir
        shell: sh # Ensure portability
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store and Turborepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
            .turbo
          key: ${{ runner.os }}-pnpm-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-pnpm-turbo-v3-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-v2-

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps

      - name: List Playwright browser cache (debug)
        run: ls -R ~/.cache/ms-playwright || true

      - name: Verify Playwright installation
        run: |
          echo "Checking Playwright installation..."
          pnpm exec playwright --version
          echo "Checking available browsers..."
          pnpm exec playwright install --dry-run || true

      # Run Biome with ReviewDog first (only on PRs)
      - name: Run Biome with ReviewDog
        if: github.event_name == 'pull_request'
        uses: mongolyy/reviewdog-action-biome@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          workdir: .
          fail_level: none

      # Now run the full checks (this may fail the build)
      - name: Run checks
        run: pnpm run check
        # PREREQUISITE: Ensure @codecov/vite-plugin is a devDependency in apps/web/package.json

      - name: Verify package links (Optional Sanity Check)
        run: |
          echo "Verifying package links..."
          pnpm list -r --depth 0
          echo "Checking for workspace:* dependencies..."
          grep -r "workspace:" --include="package.json" . || true # Allow no workspace deps

      - name: Verify types package structure (Optional Sanity Check)
        run: |
          echo "Types package structure:"
          ls -la packages/types/
          echo "Types package tsconfig.json:"
          cat packages/types/tsconfig.json

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true

      # Run knip with ReviewDog after build (only on PRs)
      - name: Setup ReviewDog for knip
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run knip with ReviewDog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run knip and capture output properly
          echo "Running knip analysis..."
          
          # Run knip and save JSON output to a file
          if pnpm run knip -c knip.jsonc --reporter json > knip-output.json 2>knip-errors.txt; then
            echo "✅ Knip completed successfully"
          else
            echo "⚠️ Knip found issues or encountered errors"
            # Show any stderr output for debugging
            if [ -s knip-errors.txt ]; then
              echo "Knip stderr:"
              cat knip-errors.txt
            fi
          fi
          
          # Check if we have valid JSON output
          if [ -s knip-output.json ] && jq empty knip-output.json 2>/dev/null; then
            echo "Processing knip JSON output..."
            
            # Format for ReviewDog - handle both unused files and issues
            {
              # Process unused files
              jq -r '
                .files[]? | 
                "\(.):\(1):\(1): warning: Unused file"
              ' knip-output.json
              
              # Process other issues  
              jq -r '
                .issues[]? | 
                {
                  file: .file,
                  line: (.line // 1),
                  col: (.col // 1),
                  severity: (if .severity == "error" then "error" else "warning" end),
                  message: "\(.type): \(.symbol // "file") is unused"
                } | 
                "\(.file):\(.line):\(.col): \(.severity): \(.message)"
              ' knip-output.json
            } | \
            reviewdog -efm="%f:%l:%c: %t%*[^:]: %m" \
                       -name="knip" \
                       -reporter=github-pr-review \
                       -filter-mode=nofilter \
                       -fail-on-error=false \
                       -level=warning
          else
            echo "❌ No valid JSON output from knip - skipping ReviewDog processing"
            echo "knip-output.json contents:"
            cat knip-output.json || echo "File doesn't exist"
          fi
          
          # Clean up
          rm -f knip-output.json knip-errors.txt

      - name: Run tests with coverage (Unit & Integration)
        run: pnpm run test:coverage
        env:
          NODE_ENV: "test" # Important: Tests (especially using React Testing Library's act) need non-production NODE_ENV

      - name: Run E2E tests with coverage
        run: |
          if lsof -ti:8080 >/dev/null; then
            echo "Port 8080 is in use. Attempting to kill process(es)..."
            lsof -ti:8080 | xargs -r kill -9
          fi
          pnpm run test:e2e
        env:
          NODE_ENV: "test" # E2E server and tests might also benefit from NODE_ENV=test
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Process coverage reports
        if: always()
        run: |
          echo "Listing all raw coverage files (coverage-final.json) to debug:"
          find . -path "*/coverage/coverage-final.json" -type f -ls
          
          echo "Running coverage merge script..."
          pnpm run coverage:merge # This script should create .nyc_output/coverage.json
          
          echo "Checking for merged coverage file (.nyc_output/coverage.json)..."
          if [ -f .nyc_output/coverage.json ]; then
            echo ".nyc_output/coverage.json exists."
            echo "Running coverage report script (to generate lcov, text reports, etc. in ./coverage/)..."
            pnpm run coverage:report # This script uses .nyc_output/coverage.json as input
          else
            echo "WARN: Merged coverage file .nyc_output/coverage.json not found! Subsequent reports might be incomplete."
          fi
          
          echo "Checking for lcov report for Codecov (expected ./coverage/lcov.info): $(test -f ./coverage/lcov.info && echo 'Yes' || echo 'No')"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5 # As per user's original workflow
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # nyc report script should generate lcov.info in ./coverage/
          files: ./coverage/lcov.info 
          fail_ci_if_error: false
          verbose: true
          disable_search: true # Prevent Codecov from finding other coverage files

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            apps/web/playwright-report/
            apps/web/test-results/ # For Vitest JUnit reports, if configured
          retention-days: 30
          if-no-files-found: warn

      - name: Run dependency vulnerability scan (Snyk)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master # Consider using a specific tag like @0.7.0 for stability
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SYNK_TOKEN }}