name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed to the same PR
# Uses head repo + head_ref for PRs to avoid fork collisions (different forks can use the same branch name)
# For pushes (e.g., main), uses the full ref to ensure proper isolation
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

# Skip ONNX Runtime CUDA binary download in CI to avoid flaky external fetches.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI environment variable is already set by GitHub Actions

jobs:
  # Fast-fail static checks. Unit coverage is a separate job so browser/E2E
  # preparation can start as soon as lint/type/build validation passes.
  checks:
    name: Checks (static)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Initialize timing table
        run: |
          echo "## CI Step Durations" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY

      - name: Test CI utility scripts
        run: |
          START=$SECONDS
          pnpm test:scripts
          echo "| CI utility scripts | $(( SECONDS - START ))s |" >> $GITHUB_STEP_SUMMARY

      - name: Lint
        run: |
          START=$SECONDS
          pnpm run lint
          echo "| Lint | $(( SECONDS - START ))s |" >> $GITHUB_STEP_SUMMARY

      - name: Type check
        run: |
          START=$SECONDS
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            echo "Running affected type-check for PR against origin/${GITHUB_BASE_REF}"
            pnpm turbo run type-check --filter="...[origin/${GITHUB_BASE_REF}]" --summarize --log-order=grouped --cache-dir=.turbo
          else
            echo "Running full type-check"
            pnpm run type-check
          fi
          echo "| Type check | $(( SECONDS - START ))s |" >> $GITHUB_STEP_SUMMARY

      - name: Report Turbo type-check diagnostics
        if: ${{ !cancelled() }}
        run: |
          set +e
          pnpm ci:turbo-diagnostics -- --runs-dir .turbo/runs --task type-check --output turbo-type-check-diagnostics.md
          STATUS=$?
          set -e
          if [ -s turbo-type-check-diagnostics.md ]; then
            cat turbo-type-check-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Turbo type-check diagnostics were generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Build all packages
        run: |
          START=$SECONDS
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            echo "Running affected build for PR against origin/${GITHUB_BASE_REF} plus @brainstrike/web for CSS validation"
            TAILWIND_DEBUG=1 pnpm turbo run build --filter="...[origin/${GITHUB_BASE_REF}]" --filter="@brainstrike/web" --summarize --log-order=grouped --cache-dir=.turbo
          else
            echo "Running full build"
            TAILWIND_DEBUG=1 pnpm run build
          fi
          echo "| Build | $(( SECONDS - START ))s |" >> $GITHUB_STEP_SUMMARY

      - name: Report Turbo build diagnostics
        if: ${{ !cancelled() }}
        run: |
          set +e
          pnpm ci:turbo-diagnostics -- --runs-dir .turbo/runs --task build --output turbo-build-diagnostics.md
          STATUS=$?
          set -e
          if [ -s turbo-build-diagnostics.md ]; then
            cat turbo-build-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Turbo build diagnostics were generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Validate CSS bundle
        run: |
          # Check CSS bundle size (must be >= 50kB)
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          else
            echo "CSS bundle size OK: ${CSS_SIZE} bytes"
          fi

          # Check for duplicate Tailwind layers
          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          else
            echo "No duplicate CSS layers detected"
          fi

      - name: Append timing table footer
        if: ${{ !cancelled() }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Check the step timings above for optimization opportunities._" >> $GITHUB_STEP_SUMMARY

  unit_coverage:
    name: Checks (unit-coverage)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Affected coverage can still exercise PGlite-backed integration suites; keep the
    # job ceiling above the longest package-level unit run without masking hangs.
    timeout-minutes: 60
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Initialize timing table
        run: |
          echo "## CI Step Durations" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY

      - name: Clear coverage directories
        run: |
          find packages apps -type d -name "coverage" -maxdepth 3 -prune -exec rm -rf {} +

      - name: Run unit tests with coverage
        id: unit-tests
        # This step owns the heavy affected coverage slice. The surrounding job
        # timeout leaves room for install, build, and report upload overhead.
        timeout-minutes: 45
        run: |
          START=$SECONDS
          rm -rf .turbo/runs
          mkdir -p .turbo/runs
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            echo "Running affected unit coverage for PR against origin/${GITHUB_BASE_REF}"
            pnpm turbo run test:coverage --filter="...[origin/${GITHUB_BASE_REF}]" --concurrency=4 --summarize --log-order=grouped --cache-dir=.turbo
          else
            echo "Running full unit coverage"
            pnpm turbo run test:coverage --concurrency=4 --summarize --log-order=grouped --cache-dir=.turbo
          fi

          COVERAGE_FILES=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${COVERAGE_FILES}" >> "$GITHUB_OUTPUT"
          if [ "$COVERAGE_FILES" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "No coverage-final.json files generated (likely no affected test tasks)."
          fi
          echo "| Test | $(( SECONDS - START ))s |" >> $GITHUB_STEP_SUMMARY
        env:
          COVERAGE: "true"
          NODE_ENV: "test"
          TURBO_TEST_MODE: "coverage"

      - name: Enforce package coverage thresholds
        if: steps.unit-tests.outputs.has_coverage == 'true'
        run: pnpm coverage:enforce

      - name: Generate merged coverage report
        if: steps.unit-tests.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.unit-tests.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Comment PR with Coverage Summary
        if: steps.unit-tests.outputs.has_coverage == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Thresholds are enforced by scripts/enforce-coverage.mjs (single source of truth).
            // This PR comment is purely informational — it shows measured coverage only.

            function summarize(json) {
              let stTot = 0, stCov = 0, fnTot = 0, fnCov = 0, brTot = 0, brCov = 0, lnTot = 0, lnCov = 0;
              for (const file of Object.values(json)) {
                const s = file.s; stTot += Object.keys(s).length; stCov += Object.values(s).filter(v => v>0).length;
                const f = file.f; fnTot += Object.keys(f).length; fnCov += Object.values(f).filter(v => v>0).length;
                const b = file.b; for (const arr of Object.values(b)) { brTot += arr.length; brCov += arr.filter(v=>v>0).length; }
                const stm = file.statementMap; const lns = new Set();
                for (const { start, end } of Object.values(stm)) { for (let l = start.line; l <= end.line; l++) lns.add(l); }
                lnTot += lns.size; const coveredLines = new Set();
                for (const [k, v] of Object.entries(file.s)) {
                  if (v>0) { const { start, end } = file.statementMap[k]; for (let l = start.line; l <= end.line; l++) coveredLines.add(l); }
                }
                lnCov += coveredLines.size;
              }
              const pct = (cov, tot) => (tot ? (100 * cov) / tot : 0);
              return {
                lines: pct(lnCov, lnTot),
                functions: pct(fnCov, fnTot),
                branches: pct(brCov, brTot),
                statements: pct(stCov, stTot),
              };
            }

            function* walk(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) yield* walk(p);
                else yield p;
              }
            }

            function findPackageName(fromDir) {
              let curr = path.resolve(fromDir);
              for (let i = 0; i < 5; i++) {
                const pkgPath = path.join(curr, 'package.json');
                if (fs.existsSync(pkgPath)) {
                  try { return JSON.parse(fs.readFileSync(pkgPath, 'utf8')).name || path.basename(curr); } catch {}
                }
                curr = path.dirname(curr);
              }
              return path.basename(fromDir);
            }

            const roots = ['packages', 'apps'].filter((p) => fs.existsSync(p));
            const coverageFiles = [];
            for (const root of roots) {
              for (const file of walk(root)) {
                if (file.endsWith(path.join('coverage', 'coverage-final.json'))) coverageFiles.push(file);
              }
            }

            const rows = [];
            const fmt = (n) => `${n.toFixed(2)}%`;
            for (const file of coverageFiles.sort()) {
              const pkgDir = path.dirname(path.dirname(file));
              const pkgName = findPackageName(pkgDir);
              try {
                const json = JSON.parse(fs.readFileSync(file, 'utf8'));
                const s = summarize(json);
                rows.push(`| ${pkgName} | ${fmt(s.lines)} | ${fmt(s.functions)} | ${fmt(s.branches)} | ${fmt(s.statements)} |`);
              } catch (e) {
                rows.push(`| ${pkgName} | error | — | — | — |`);
              }
            }

            const header = `## ✅ Coverage Summary (All Workspaces with reports)\n\n` +
              `| Package | Lines | Functions | Branches | Statements |\n` +
              `|---|---:|---:|---:|---:|`;
            const body = rows.length ? [header, ...rows].join('\n') : `${header}\n| — | — | — | — | — |`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body + '\n\n_Values computed from coverage-final.json; thresholds enforced via `scripts/enforce-coverage.mjs`_',
            });

      - name: Bundle coverage files
        run: |
          set -e
          mkdir -p coverage-bundle
          find . -name "coverage-final.json" -path "*/coverage/*" -exec cp --parents {} coverage-bundle/ \;
          if [ ! "$(ls -A coverage-bundle 2>/dev/null)" ]; then
            echo "No coverage files found, creating empty marker"
            touch coverage-bundle/.empty
          fi
          tar -cvf coverage-bundle.tar coverage-bundle/
          ls -lh coverage-bundle.tar
          echo "Bundled $(find coverage-bundle -name '*.json' 2>/dev/null | wc -l) coverage files"

      - name: Upload coverage bundle
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage-bundle.tar
          retention-days: 1

      - name: Report Turbo test task timings
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        run: |
          set +e
          : > turbo-test-timings.md
          pnpm ci:timing-summary -- --runs-dir .turbo/runs --task test:coverage --warn-ms 1200000 --fail-ms 1800000 --total-warn-ms 1500000 --total-fail-ms 1800000 --output turbo-test-timings.md
          STATUS=$?
          set -e
          if [ -s turbo-test-timings.md ]; then
            cat turbo-test-timings.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Turbo timing summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Report Turbo unit coverage diagnostics
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        run: |
          set +e
          pnpm ci:turbo-diagnostics -- --runs-dir .turbo/runs --task test:coverage --output turbo-unit-coverage-diagnostics.md
          STATUS=$?
          set -e
          if [ -s turbo-unit-coverage-diagnostics.md ]; then
            cat turbo-unit-coverage-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Turbo unit coverage diagnostics were generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Append timing table footer
        if: ${{ !cancelled() }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Check the step timings above for optimization opportunities._" >> $GITHUB_STEP_SUMMARY

  # Dynamic matrix: web E2E uses the same functional project and shard count on
  # PRs and main so the merge gate proves the suite that runs after merge.
  # Four shards with two Playwright workers each keeps the same total browser
  # concurrency as the old eight single-worker shards while halving per-job setup.
  determine-matrix:
    name: Determine E2E Matrix
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web-shards: ${{ steps.set-matrix.outputs.web-shards }}
      web-shard-total: ${{ steps.set-matrix.outputs.web-shard-total }}
      desktop-shards: ${{ steps.set-matrix.outputs.desktop-shards }}
      desktop-shard-total: ${{ steps.set-matrix.outputs.desktop-shard-total }}
    steps:
      - name: Set shard matrix
        id: set-matrix
        run: |
          echo 'web-shards=["1","2","3","4"]' >> "$GITHUB_OUTPUT"
          echo 'web-shard-total=["4"]' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'desktop-shards=["1","2"]' >> "$GITHUB_OUTPUT"
            echo 'desktop-shard-total=["2"]' >> "$GITHUB_OUTPUT"
          else
            echo 'desktop-shards=["1","2","3","4"]' >> "$GITHUB_OUTPUT"
            echo 'desktop-shard-total=["4"]' >> "$GITHUB_OUTPUT"
          fi

  # Build web app and upload as artifact for E2E jobs
  prepare-web:
    name: Build Web App
    if: github.event_name != 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build web application
        run: pnpm run build --filter @brainstrike/web

      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  # Build desktop app and upload as artifact for E2E jobs
  prepare-desktop:
    name: Build Desktop App
    if: github.event_name != 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Build desktop application
        run: pnpm run build --filter @brainstrike/desktop

      - name: Upload desktop dist
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: apps/desktop/dist/
          retention-days: 1

  # Vitest 4 Browser Mode tests (WASM/IndexedDB validation)
  browser-tests:
    name: Browser Tests (Vitest 4)
    if: github.event_name != 'workflow_dispatch'
    needs: checks # Only run if checks pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./packages/storage/package.json').devDependencies['@vitest/browser-playwright']")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-vitest-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers for Vitest
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          # Install browsers using Playwright from within storage package
          # to ensure version compatibility with @vitest/browser-playwright
          cd packages/storage
          pnpm exec playwright install chromium chromium-headless-shell --with-deps

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd packages/storage
          pnpm exec playwright install-deps chromium

      - name: Build packages
        run: pnpm run build --filter @brainstrike/db --filter @brainstrike/storage

      - name: Run browser tests
        timeout-minutes: 40
        run: pnpm run test:browser

      - name: Upload browser test traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-traces
          path: |
            packages/*/test-results/**/*.zip
            packages/*/test-results/**/*.png
          retention-days: 1
          if-no-files-found: ignore

  # E2E tests run in parallel with sharding. Keep PR coverage complete, but use
  # fewer jobs with two Playwright workers each to reduce repeated runner setup.
  # Origin-destructive reset flows are excluded here and covered by
  # e2e-destructive so they cannot delete another worker's active IndexedDB.
  e2e:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: github.event_name != 'workflow_dispatch'
    needs: [prepare-web, determine-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.determine-matrix.outputs.web-shards) }}
        shardTotal: ${{ fromJSON(needs.determine-matrix.outputs.web-shard-total) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build workspace dependencies (Turbo remote cache hit from prepare-web)
        run: pnpm run build --filter @brainstrike/web

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests (shard)
        timeout-minutes: 30
        run: |
          cd apps/web
          echo "Running functional E2E tests"
          unset NO_COLOR
          pnpm exec playwright test --project=functional --workers=2 --grep-invert "@destructive" --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Bundle blob report
        if: failure()
        run: |
          set -e
          cd apps/web
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf blob-report-${{ matrix.shardIndex }}.tar blob-report/
            ls -lh blob-report-${{ matrix.shardIndex }}.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No blob report found for shard ${{ matrix.shardIndex }}"
          fi

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/web/blob-report-${{ matrix.shardIndex }}.tar
          retention-days: 1
          if-no-files-found: warn

  e2e-destructive:
    name: E2E Destructive Tests
    if: github.event_name != 'workflow_dispatch'
    needs: [prepare-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build workspace dependencies (Turbo remote cache hit from prepare-web)
        run: pnpm run build --filter @brainstrike/web

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run destructive E2E tests
        timeout-minutes: 15
        run: |
          cd apps/web
          echo "Running destructive functional E2E tests in isolation"
          unset NO_COLOR
          pnpm exec playwright test --project=functional --workers=1 --grep "@destructive"
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Bundle blob report
        if: failure()
        run: |
          set -e
          cd apps/web
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf destructive-blob-report.tar blob-report/
            ls -lh destructive-blob-report.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No destructive blob report found"
          fi

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: destructive-blob-report
          path: apps/web/destructive-blob-report.tar
          retention-days: 1
          if-no-files-found: warn

  # Desktop E2E tests (PR) - runs concurrently with web E2E on PRs
  # With 2+2 shards on PRs, lower concurrency avoids the flakiness seen with 4+4
  desktop-e2e-pr:
    name: Desktop E2E Smoke
    if: github.event_name == 'pull_request'
    needs: [prepare-desktop, determine-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.determine-matrix.outputs.desktop-shards) }}
        shardTotal: ${{ fromJSON(needs.determine-matrix.outputs.desktop-shard-total) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Setup desktop E2E
        uses: ./.github/actions/setup-desktop-e2e

      - name: Run Desktop E2E smoke tests (shard)
        timeout-minutes: 40
        working-directory: apps/desktop
        run: |
          # Use a deterministic X server number per shard to avoid collisions
          # Shard 1 = :91, Shard 2 = :92, etc. (base 90 + shardIndex)
          SERVER_NUM=$((90 + ${{ matrix.shardIndex }}))
          export DISPLAY=":${SERVER_NUM}"

          # Clean up any stale X lock files for this server number
          LOCK_FILE="/tmp/.X${SERVER_NUM}-lock"
          [ -f "$LOCK_FILE" ] && sudo rm -f "$LOCK_FILE"

          # Start Xvfb in background with explicit pre-warming
          echo "Starting Xvfb on display ${DISPLAY} for shard ${{ matrix.shardIndex }}"
          Xvfb ${DISPLAY} -screen 0 1280x960x24 -ac +extension GLX &
          XVFB_PID=$!

          # Pre-warm: Wait for Xvfb to fully initialize
          echo "Waiting for Xvfb to initialize..."
          sleep 3

          # Verify Xvfb is running and display is accessible
          if ! kill -0 $XVFB_PID 2>/dev/null; then
            echo "ERROR: Xvfb process died unexpectedly"
            exit 1
          fi
          echo "Xvfb running with PID $XVFB_PID on display ${DISPLAY}"

          # Run smoke tests with explicit DISPLAY
          echo "Starting Playwright smoke tests..."
          unset NO_COLOR
          pnpm exec playwright test --project=smoke --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          TEST_EXIT_CODE=$?

          # Cleanup
          kill $XVFB_PID 2>/dev/null || true
          exit $TEST_EXIT_CODE
        env:
          NODE_ENV: "test"
          CI: "true"
          RUN_SALT: ${{ github.run_id }}
          ELECTRON_ENABLE_STACK_DUMPING: "false"
          ELECTRON_DISABLE_GPU: "1"

      - name: Bundle blob report (desktop shard)
        if: failure()
        run: |
          set -e
          cd apps/desktop
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf desktop-blob-report-${{ matrix.shardIndex }}.tar blob-report/
            ls -lh desktop-blob-report-${{ matrix.shardIndex }}.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No blob report found for desktop shard ${{ matrix.shardIndex }}"
          fi

      - name: Upload blob report (desktop shard)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-blob-report-${{ matrix.shardIndex }}
          path: apps/desktop/desktop-blob-report-${{ matrix.shardIndex }}.tar
          retention-days: 1
          if-no-files-found: warn

  # Desktop E2E tests (main) - runs AFTER web E2E to prevent Electron flakiness
  # WARNING: Do NOT change to parallel execution on main. See docs/DESKTOP-E2E-FLAKINESS-HANDOFF.md
  # PR #544 tried parallel (needs: [checks]) and flakiness returned within 5 days (PR #555).
  # Root cause: too many concurrent GHA jobs overwhelm infrastructure, not runner isolation.
  desktop-e2e-main:
    name: Desktop E2E Regression
    if: github.event_name != 'pull_request'
    needs: [prepare-desktop, e2e, determine-matrix] # Sequential on main - wait for web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.determine-matrix.outputs.desktop-shards) }}
        shardTotal: ${{ fromJSON(needs.determine-matrix.outputs.desktop-shard-total) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Setup desktop E2E
        uses: ./.github/actions/setup-desktop-e2e

      - name: Run Desktop E2E tests (shard)
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          # Use a deterministic X server number per shard to avoid collisions
          # Shard 1 = :91, Shard 2 = :92, etc. (base 90 + shardIndex)
          SERVER_NUM=$((90 + ${{ matrix.shardIndex }}))
          export DISPLAY=":${SERVER_NUM}"

          # Clean up any stale X lock files for this server number
          LOCK_FILE="/tmp/.X${SERVER_NUM}-lock"
          [ -f "$LOCK_FILE" ] && sudo rm -f "$LOCK_FILE"

          # Start Xvfb in background with explicit pre-warming
          echo "Starting Xvfb on display ${DISPLAY} for shard ${{ matrix.shardIndex }}"
          Xvfb ${DISPLAY} -screen 0 1280x960x24 -ac +extension GLX &
          XVFB_PID=$!

          # Pre-warm: Wait for Xvfb to fully initialize
          echo "Waiting for Xvfb to initialize..."
          sleep 3

          # Verify Xvfb is running and display is accessible
          if ! kill -0 $XVFB_PID 2>/dev/null; then
            echo "ERROR: Xvfb process died unexpectedly"
            exit 1
          fi
          echo "Xvfb running with PID $XVFB_PID on display ${DISPLAY}"

          # Run regression tests (non-smoke) with explicit DISPLAY
          echo "Starting Playwright regression tests..."
          unset NO_COLOR
          pnpm exec playwright test --project=regression --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          TEST_EXIT_CODE=$?

          # Cleanup
          kill $XVFB_PID 2>/dev/null || true
          exit $TEST_EXIT_CODE
        env:
          NODE_ENV: "test"
          CI: "true"
          RUN_SALT: ${{ github.run_id }}
          ELECTRON_ENABLE_STACK_DUMPING: "false"
          ELECTRON_DISABLE_GPU: "1"

      - name: Bundle blob report (desktop shard)
        if: failure()
        run: |
          set -e
          cd apps/desktop
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf desktop-blob-report-${{ matrix.shardIndex }}.tar blob-report/
            ls -lh desktop-blob-report-${{ matrix.shardIndex }}.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No blob report found for desktop shard ${{ matrix.shardIndex }}"
          fi

      - name: Upload blob report (desktop shard)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-blob-report-${{ matrix.shardIndex }}
          path: apps/desktop/desktop-blob-report-${{ matrix.shardIndex }}.tar
          retention-days: 1
          if-no-files-found: warn

  desktop-e2e-backgrounding:
    name: Desktop E2E Backgrounding Regression
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps

      - name: Build desktop application
        run: pnpm run build --filter @brainstrike/desktop

      - name: Run desktop backgrounding regression tests
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          unset NO_COLOR
          export DISPLAY=":95"
          XVFB_STDOUT_LOG="/tmp/brainstrike-xvfb-stdout.log"
          XVFB_STDERR_LOG="/tmp/brainstrike-xvfb-stderr.log"

          LOCK_FILE="/tmp/.X95-lock"
          [ -f "$LOCK_FILE" ] && sudo rm -f "$LOCK_FILE"

          echo "Starting Xvfb on display ${DISPLAY} for backgrounding regression"
          Xvfb ${DISPLAY} -screen 0 1280x960x24 -ac +extension GLX >"$XVFB_STDOUT_LOG" 2>"$XVFB_STDERR_LOG" &
          XVFB_PID=$!

          echo "Waiting for Xvfb to initialize..."
          sleep 3

          if ! kill -0 $XVFB_PID 2>/dev/null; then
            echo "ERROR: Xvfb process died unexpectedly"
            [ -s "$XVFB_STDOUT_LOG" ] && cat "$XVFB_STDOUT_LOG"
            [ -s "$XVFB_STDERR_LOG" ] && cat "$XVFB_STDERR_LOG"
            exit 1
          fi
          echo "Xvfb running with PID $XVFB_PID on display ${DISPLAY}"

          echo "Starting Playwright backgrounding regression tests..."
          pnpm test:e2e:backgrounding
          TEST_EXIT_CODE=$?

          kill $XVFB_PID 2>/dev/null || true
          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            [ -s "$XVFB_STDOUT_LOG" ] && cat "$XVFB_STDOUT_LOG"
            [ -s "$XVFB_STDERR_LOG" ] && cat "$XVFB_STDERR_LOG"
          fi
          exit $TEST_EXIT_CODE
        env:
          NODE_ENV: "test"
          CI: "true"
          LOG_LEVEL: "warn"
          RUN_SALT: ${{ github.run_id }}
          ELECTRON_ENABLE_STACK_DUMPING: "false"
          ELECTRON_DISABLE_GPU: "1"

      - name: Bundle blob report (desktop backgrounding)
        if: failure()
        run: |
          set -e
          cd apps/desktop
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf desktop-backgrounding-blob-report.tar blob-report/
            ls -lh desktop-backgrounding-blob-report.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No blob report found for desktop backgrounding regression"
          fi

      - name: Upload blob report (desktop backgrounding)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-backgrounding-blob-report
          path: apps/desktop/desktop-backgrounding-blob-report.tar
          retention-days: 1
          if-no-files-found: warn

  # Merge E2E test reports
  # Note: exactly one of desktop-e2e-pr / desktop-e2e-main is always skipped
  # (PR runs -pr, main/push runs -main). The OR condition handles this correctly.
  merge-reports:
    name: Merge Test Reports
    if: github.event_name != 'workflow_dispatch' && always() && (needs.checks.result == 'success' || needs.e2e.result == 'success' || needs.e2e-destructive.result == 'success' || needs.desktop-e2e-pr.result == 'success' || needs.desktop-e2e-main.result == 'success')
    needs: [checks, e2e, e2e-destructive, desktop-e2e-pr, desktop-e2e-main]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download blob reports
        id: download-reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: '*blob-report*'
        continue-on-error: true

      - name: Extract blob report bundles
        if: steps.download-reports.outcome == 'success'
        run: |
          set -e
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "Extracting blob report tar bundles..."
            for artifact_dir in all-blob-reports/*/; do
              if [ -d "$artifact_dir" ]; then
                echo "Processing directory: $artifact_dir"
                for tar_file in "$artifact_dir"*.tar; do
                  if [ -f "$tar_file" ]; then
                    echo "Extracting: $tar_file"
                    tar -xvf "$tar_file" -C "$artifact_dir"
                    rm "$tar_file"
                    echo "Extracted $(basename "$tar_file")"
                  fi
                done
              fi
            done
            echo "Extraction complete"
          else
            echo "No blob reports to extract"
          fi

      - name: Check if blob reports exist
        id: check-reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports)" ]; then
            echo "reports-exist=true" >> $GITHUB_OUTPUT
            echo "Blob reports found:"
            ls -la all-blob-reports/
            echo "Extracted blob report count:"
            find all-blob-reports -type d -name "blob-report" | wc -l
          else
            echo "reports-exist=false" >> $GITHUB_OUTPUT
            echo "No blob reports found - shard jobs either passed without diagnostic upload or produced no report"
          fi

      - name: Setup monorepo
        if: steps.check-reports.outputs.reports-exist == 'true'
        uses: ./.github/actions/setup-monorepo

      - name: Merge Playwright reports
        if: steps.check-reports.outputs.reports-exist == 'true'
        run: |
          echo "Contents of blob report directories:"
          ls -la all-blob-reports/*/

          # Create a single directory with all blob files
          mkdir -p merged-blob-reports

          # Copy all blob report files to the merged directory
          for dir in all-blob-reports/*/; do
            if [ -d "$dir/blob-report" ]; then
              echo "Copying files from $dir/blob-report"
              cp -r "$dir"/blob-report/* merged-blob-reports/ || true
            fi
          done

          echo "Merged blob reports directory contents:"
          ls -la merged-blob-reports/

          # Debug: Check if merge config exists and is valid
          echo "Checking merge config..."
          ls -la playwright-merge.config.js
          node -c playwright-merge.config.js

          # Merge reports using custom merge config to handle both web and desktop
          echo "Starting merge process..."
          pnpm exec playwright merge-reports --config playwright-merge.config.js merged-blob-reports

      - name: Upload final test results
        if: steps.check-reports.outputs.reports-exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: all-test-results
          path: playwright-report-merged/
          retention-days: 1
          if-no-files-found: warn

  # Optional checks that don't block merging
  code-quality:
    name: Code Quality Checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build Knip prerequisites
        run: pnpm turbo run build --filter=@brainstrike/build-utils --filter=@brainstrike/server-config --summarize --log-order=grouped --cache-dir=.turbo

      - name: Audit production dependencies
        id: production-audit
        run: |
          set +e
          pnpm audit --prod --audit-level high
          audit_exit_code=$?
          set -e

          echo "exit_code=${audit_exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$audit_exit_code" -ne 0 ]; then
            echo "Production dependency audit reported findings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Knip analysis
        id: knip-analysis
        run: |
          REPORT_FILE="knip-report.md"
          OUTPUT=$(pnpm run knip -c knip.jsonc --cache --reporter markdown || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "Unused"; then
            echo "$OUTPUT" > $REPORT_FILE
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "## No unused code detected!" > $REPORT_FILE
            echo "" >> $REPORT_FILE
            echo "Great job! Knip didn't find any unused files, exports, or dependencies." >> $REPORT_FILE
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Knip Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let knipReport = '## Knip analysis failed to run\n\nPlease check the workflow logs for details.';
            if (fs.existsSync('knip-report.md')) {
              knipReport = fs.readFileSync('knip-report.md', 'utf8');
            }

            const body = `## Code Quality Analysis

            ${knipReport}

            > Knip helps identify unused code to reduce bundle size and improve maintainability.
            > This check is non-blocking but please consider cleaning up unused code.
            >
            > [Learn more about Knip](https://knip.dev)`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
