      - name: Upload blob report (desktop embedding group)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-embedding-blob-report-${{ matrix.group }}
          path: apps/desktop/desktop-embedding-blob-report-${{ matrix.group }}.tar
          retention-days: 1
          if-no-files-found: warn

  desktop-e2e-backgrounding:
    name: Desktop E2E Backgrounding Regression
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          skip-electron: 'false'

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps

      - name: Build desktop application
        run: pnpm run build --filter @brainstrike/desktop

      - name: Run desktop backgrounding regression tests
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          unset NO_COLOR
          export DISPLAY=":95"
          XVFB_STDOUT_LOG="/tmp/brainstrike-xvfb-stdout.log"
          XVFB_STDERR_LOG="/tmp/brainstrike-xvfb-stderr.log"

          LOCK_FILE="/tmp/.X95-lock"
          [ -f "$LOCK_FILE" ] && rm -f "$LOCK_FILE"

          echo "Starting Xvfb on display ${DISPLAY} for backgrounding regression"
          Xvfb ${DISPLAY} -screen 0 1280x960x24 -ac +extension GLX >"$XVFB_STDOUT_LOG" 2>"$XVFB_STDERR_LOG" &
          XVFB_PID=$!

          echo "Waiting for Xvfb to initialize..."
          sleep 3

          if ! kill -0 $XVFB_PID 2>/dev/null; then
            echo "ERROR: Xvfb process died unexpectedly"
            [ -s "$XVFB_STDOUT_LOG" ] && cat "$XVFB_STDOUT_LOG"
            [ -s "$XVFB_STDERR_LOG" ] && cat "$XVFB_STDERR_LOG"
            exit 1
          fi
          echo "Xvfb running with PID $XVFB_PID on display ${DISPLAY}"

          echo "Starting Playwright backgrounding regression tests..."
          pnpm test:e2e:backgrounding
          TEST_EXIT_CODE=$?

          kill $XVFB_PID 2>/dev/null || true
          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            [ -s "$XVFB_STDOUT_LOG" ] && cat "$XVFB_STDOUT_LOG"
            [ -s "$XVFB_STDERR_LOG" ] && cat "$XVFB_STDERR_LOG"
          fi
          exit $TEST_EXIT_CODE
        env:
          NODE_ENV: "test"
          CI: "true"
          LOG_LEVEL: "warn"
          RUN_SALT: ${{ github.run_id }}
          ELECTRON_ENABLE_STACK_DUMPING: "false"
          ELECTRON_DISABLE_GPU: "1"

      - name: Bundle blob report (desktop backgrounding)
        if: failure()
        run: |
          set -e
          cd apps/desktop
          if [ -d "blob-report" ] && [ "$(ls -A blob-report 2>/dev/null)" ]; then
            tar -cvf desktop-backgrounding-blob-report.tar blob-report/
            ls -lh desktop-backgrounding-blob-report.tar
            echo "Bundled $(find blob-report -type f | wc -l) files in tar"
          else
            echo "No blob report found for desktop backgrounding regression"
          fi

      - name: Upload blob report (desktop backgrounding)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-backgrounding-blob-report
          path: apps/desktop/desktop-backgrounding-blob-report.tar
          retention-days: 1
          if-no-files-found: warn

  # Merge E2E test reports
  # Note: exactly one of the PR/main desktop job sets is always skipped.
  # The OR condition handles this correctly.
  merge-reports:
    name: Merge Test Reports
    if: >-
      always() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'ci:full') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'ci:web-e2e') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'ci:desktop') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'ci:embedding')
      ) &&
      (needs.checks.result == 'success' || needs.e2e.result == 'success' || needs.e2e-stateful.result == 'success' || needs.e2e-destructive.result == 'success' || needs.desktop-e2e-pr.result == 'success' || needs.desktop-e2e-embedding-pr.result == 'success' || needs.desktop-e2e-main.result == 'success' || needs.desktop-e2e-embedding-main.result == 'success')
    needs: [checks, e2e, e2e-stateful, e2e-destructive, desktop-e2e-pr, desktop-e2e-embedding-pr, desktop-e2e-main, desktop-e2e-embedding-main]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download blob reports
        id: download-reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: '*blob-report*'
        continue-on-error: true

      - name: Extract blob report bundles
        if: steps.download-reports.outcome == 'success'
        run: |
          set -e
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "Extracting blob report tar bundles..."
            find all-blob-reports -type f -name "*.tar" -print0 | while IFS= read -r -d '' tar_file; do
              artifact_dir="$(dirname "$tar_file")"
              echo "Extracting: $tar_file"
              tar -xvf "$tar_file" -C "$artifact_dir"
              rm "$tar_file"
              echo "Extracted $(basename "$tar_file")"
            done
            echo "Extraction complete"
          else
            echo "No blob reports to extract"
          fi

      - name: Check if blob reports exist
        id: check-reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(find all-blob-reports -type f -path "*/blob-report/*" -print -quit)" ]; then
            echo "reports-exist=true" >> $GITHUB_OUTPUT
            echo "Blob report directories:"
            find all-blob-reports -type d -name "blob-report" | wc -l
            echo "Blob report files:"
            find all-blob-reports -type f -path "*/blob-report/*" | wc -l
          else
            echo "reports-exist=false" >> $GITHUB_OUTPUT
            echo "No blob reports found - shard jobs either passed without diagnostic upload or produced no report"
          fi

      - name: Setup monorepo
        if: steps.check-reports.outputs.reports-exist == 'true'
        uses: ./.github/actions/setup-monorepo

      - name: Merge Playwright reports
        if: steps.check-reports.outputs.reports-exist == 'true'
        run: |
          echo "Downloaded blob report tree:"
          find all-blob-reports -maxdepth 3 -print | sort

          # Create a single directory with all blob files
          mkdir -p merged-blob-reports

          # Copy all blob report files to the merged directory
          find all-blob-reports -type d -name "blob-report" -print0 | while IFS= read -r -d '' report_dir; do
            echo "Copying files from $report_dir"
            cp -r "$report_dir"/. merged-blob-reports/
          done

          echo "Merged blob reports directory contents:"
          find merged-blob-reports -maxdepth 2 -print | sort

          # Debug: Check if merge config exists and is valid
          echo "Checking merge config..."
          ls -la playwright-merge.config.js
          node -c playwright-merge.config.js

          # Merge reports using custom merge config to handle both web and desktop
          echo "Starting merge process..."
          pnpm exec playwright merge-reports --config playwright-merge.config.js merged-blob-reports

      - name: Upload final test results
        if: steps.check-reports.outputs.reports-exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: all-test-results
          path: playwright-report-merged/
          retention-days: 1
          if-no-files-found: warn

  required-pr-gate:
    name: Required PR Gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - pr-sentinel
      - checks
      - unit_coverage
      - browser-tests
      - prepare-web
      - prepare-desktop
      - e2e
      - e2e-stateful
      - e2e-destructive
      - desktop-e2e-pr
      - desktop-e2e-embedding-pr
      - merge-reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required PR jobs
        env:
          REQUIRED_NEEDS: ${{ toJSON(needs) }}
          REQUIRED_LABELS: ${{ needs.pr-sentinel.outputs.required-labels }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.REQUIRED_NEEDS);
          const requiredLabels = process.env.REQUIRED_LABELS.split(',').filter(Boolean);
          const alwaysRequiredJobs = ['pr-sentinel', 'checks'];

          const jobByLabel = new Map([
            ['ci:coverage', ['unit_coverage']],
            ['ci:browser', ['browser-tests']],
            ['ci:web-e2e', ['prepare-web', 'e2e', 'e2e-stateful', 'e2e-destructive']],
            ['ci:desktop', ['prepare-desktop', 'desktop-e2e-pr']],
            ['ci:embedding', ['prepare-desktop', 'desktop-e2e-embedding-pr']],
          ]);

          const failures = [];
          for (const jobName of alwaysRequiredJobs) {
            if (needs[jobName]?.result !== 'success') {
              failures.push(`${jobName}: ${needs[jobName]?.result ?? 'missing'}`);
            }
          }

          for (const [name, job] of Object.entries(needs)) {
            if (job.result === 'failure' || job.result === 'cancelled' || job.result === 'timed_out') {
              failures.push(`${name}: ${job.result}`);
            }
          }

          for (const label of requiredLabels) {
            const jobs = jobByLabel.get(label) ?? [];
            for (const jobName of jobs) {
              if (needs[jobName]?.result !== 'success') {
                failures.push(`${label} requires ${jobName}, got ${needs[jobName]?.result ?? 'missing'}`);
              }
            }
          }

          if (failures.length > 0) {
            console.error('Required PR gate failed:');
            for (const failure of failures) {
              console.error(`- ${failure}`);
            }
            process.exit(1);
          }
          console.log('Required PR gate passed.');
          NODE

  required-main-gate:
    name: Required Main Gate
    if: always() && github.event_name == 'push'
    needs:
      - checks
      - unit_coverage
      - browser-tests
      - prepare-web
      - prepare-desktop
      - e2e
      - e2e-stateful
      - e2e-destructive
      - desktop-e2e-main
      - desktop-e2e-embedding-main
      - merge-reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required main jobs
        env:
          REQUIRED_NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.REQUIRED_NEEDS);
          // Strict by design: every required main dependency must run and succeed.
          const failed = Object.entries(needs).filter(([, job]) => job.result !== 'success');
          if (failed.length > 0) {
            console.error('Required main gate failed:');
            for (const [name, job] of failed) {
              console.error(`- ${name}: ${job.result}`);
            }
            process.exit(1);
          }
          console.log('Required main gate passed.');
          NODE

  # Optional checks that don't block merging
  code-quality:
    name: Code Quality Checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build Knip prerequisites
        run: pnpm turbo run build --filter=@brainstrike/build-utils --filter=@brainstrike/server-config --summarize --log-order=grouped --cache-dir=.turbo

      - name: Audit production dependencies
        id: production-audit
        run: |
          set +e
          pnpm audit --prod --audit-level high
          audit_exit_code=$?
          set -e

          echo "exit_code=${audit_exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$audit_exit_code" -ne 0 ]; then
            echo "Production dependency audit reported findings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Knip analysis
        id: knip-analysis
        run: |
          REPORT_FILE="knip-report.md"
          OUTPUT=$(pnpm run knip -c knip.jsonc --cache --reporter markdown || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "Unused"; then
            echo "$OUTPUT" > $REPORT_FILE
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "## No unused code detected!" > $REPORT_FILE
            echo "" >> $REPORT_FILE
            echo "Great job! Knip didn't find any unused files, exports, or dependencies." >> $REPORT_FILE
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Knip Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let knipReport = '## Knip analysis failed to run\n\nPlease check the workflow logs for details.';
            if (fs.existsSync('knip-report.md')) {
              knipReport = fs.readFileSync('knip-report.md', 'utf8');
            }

            const body = `## Code Quality Analysis

            ${knipReport}

            > Knip helps identify unused code to reduce bundle size and improve maintainability.
            > This check is non-blocking but please consider cleaning up unused code.
            >
            > [Learn more about Knip](https://knip.dev)`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
