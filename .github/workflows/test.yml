      - name: Run stateful E2E tests
        timeout-minutes: 25
        run: |
          cd apps/web
          echo "Running stateful functional E2E tests with one worker per runner"
          unset NO_COLOR
          pnpm exec playwright test --project=functional --workers=1 --grep "@stateful" ${{ matrix.testFiles }}
        env:
