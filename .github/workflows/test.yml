# Runs nightly on main (owner decision 2026-10-17).
# Per-PR hosted CI is off; merges use the local gate in docs/agents/ci-quality.md.

name: Test

on:
  # 07:03 UTC, ahead of the E2E workflows' crons.
  schedule:
    - cron: '3 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # A variable, not a secret: the team slug appears in every package name, and a
  # secret value makes GitHub drop any job output containing it (BST-2105).
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  admission:
    name: Quiet-head admission
    # PR synchronization is bursty: the measured 2026-07-15..19 sample reached
    # 44 concurrent Linux jobs, while 31.3% of Test runs were ultimately
    # cancelled. Hold the fan-out on GitHub's $0.002/min 1-core runner so a
    # follow-up push can cancel this cheap sleep instead of seven build/test
    # runners. Scheduled and workflow_dispatch events pass through immediately.
    if: github.repository == 'seandearnaley/brainstrike'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.admission.outputs.result }}
    steps:
      - name: Wait for pull request activity to settle
        if: github.event_name == 'pull_request'
        run: sleep 120

      - name: Admit the current pull request head
        id: admission
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') {
              core.notice('Quiet-head admission is immediate outside pull requests.');
              return 'true';
            }

            const eventPull = context.payload.pull_request;
            const pullNumber = eventPull?.number;
            const runHead = eventPull?.head?.sha;
            if (!pullNumber || typeof runHead !== 'string' || runHead.length === 0) {
              core.setFailed('Cannot establish the pull request number and run head from the event payload.');
              return 'false';
            }

            let pull;
            try {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }));
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.setFailed(`Cannot establish the current head for PR #${pullNumber}: ${message}`);
              return 'false';
            }

            const currentHead = pull.head.sha;
            if (typeof currentHead !== 'string' || currentHead.length === 0) {
              core.setFailed(`GitHub returned no current head SHA for PR #${pullNumber}.`);
              return 'false';
            }

            if (currentHead !== runHead) {
              core.notice(
                `PR #${pullNumber} advanced from ${runHead} to ${currentHead}; expensive jobs will not start for the superseded head.`
              );
              return 'false';
            }

            core.notice(`PR #${pullNumber} head ${runHead} remained quiet for 120 seconds; releasing the full test graph.`);
            return 'true';

  static:
    name: Static
    outputs:
      unit-matrix: ${{ steps.unit-shards.outputs.matrix }}
      unit-shard-count: ${{ steps.unit-shards.outputs.count }}
    if: github.repository == 'seandearnaley/brainstrike' && always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    # Series C R9b: arm64 runners became available for private repos on
    # 2026-01-29, and cost 37% less per minute than ubuntu-latest (x64).
    # Probe P1 measured this job's full step suite (install, secret scan,
    # script tests, lane-manifest checks, lint, type-check) GENUINELY
    # RUNNING and PASSING on ubuntu-24.04-arm, with wall-clock parity to x64
    # (~3.0m either arch — arm64 is NOT faster, only cheaper per minute).
    # See docs/agents/ci-quality.md / the Series C design doc for the probe
    # results. `.turbo` cache key (setup-workspace/action.yml) already
    # includes `runner.arch`, so this move cannot cross-restore an
    # incompatible cache layer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Static check."
          exit 1

      # Checkout MUST stay here, ahead of the composite: a local `uses: ./...`
      # action is read off the runner's filesystem, so the repo has to be on
      # disk before it can resolve. See setup-workspace/action.yml's header.
      # Full history also supplies the exact PR base used by Unit admission.
      # MCP lab detection still compares the merge commit to its first parent.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # BST-1324: MUST run before `Setup workspace` — the composite ends with
      # `pnpm install --frozen-lockfile`, which is exactly where a textually
      # merged lockfile kills the job (#2483/#2485), so a guard placed after it
      # can never fire on the file it exists to catch. The script is
      # dependency-free by design (runner's system Node, bare checkout, no
      # node_modules); scripts/__tests__/verify-lockfile-catalog-conformance.
      # test.mjs re-runs the same check with full context under
      # `pnpm test:scripts` below, which also covers the install-silent class.
      - name: Lockfile catalog conformance (pre-install)
        run: node scripts/verify-lockfile-catalog-conformance.mjs

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      # Preview exactly the Unit task/filter selection before allocating any
      # shard runner. Reuse Static's installation; no additional runner or
      # package/command registry. Push and manual runs retain every row.
      - name: Select affected Unit shards
        id: unit-shards
        env:
          UNIT_MATRIX: >-
            {
              "include": [
                {
                  "shard": "db-1",
                  "partition": "db",
                  "pr_filters": "--filter=\"@brainstrike/db\"",
                  "push_filters": "--filter=\"@brainstrike/db\"",
                  "vitest_shard": "1/2"
                },
                {
                  "shard": "db-2",
                  "partition": "db",
                  "pr_filters": "--filter=\"@brainstrike/db\"",
                  "push_filters": "--filter=\"@brainstrike/db\"",
                  "vitest_shard": "2/2"
                },
                {
                  "shard": "agent-1",
                  "partition": "agent",
                  "pr_filters": "--filter=\"@brainstrike/agent\"",
                  "push_filters": "--filter=\"@brainstrike/agent\"",
                  "vitest_shard": "1/2"
                },
                {
                  "shard": "agent-2",
                  "partition": "agent",
                  "pr_filters": "--filter=\"@brainstrike/agent\"",
                  "push_filters": "--filter=\"@brainstrike/agent\"",
                  "vitest_shard": "2/2"
                },
                {
                  "shard": "desktop-1",
                  "partition": "desktop",
                  "pr_filters": "--filter=\"@brainstrike/desktop\"",
                  "push_filters": "--filter=\"@brainstrike/desktop\"",
                  "vitest_shard": "1/3"
                },
                {
                  "shard": "desktop-2",
                  "partition": "desktop",
                  "pr_filters": "--filter=\"@brainstrike/desktop\"",
                  "push_filters": "--filter=\"@brainstrike/desktop\"",
                  "vitest_shard": "2/3"
                },
                {
                  "shard": "desktop-3",
                  "partition": "desktop",
                  "pr_filters": "--filter=\"@brainstrike/desktop\"",
                  "push_filters": "--filter=\"@brainstrike/desktop\"",
                  "vitest_shard": "3/3"
                },
                {
                  "shard": "heavy",
                  "partition": "heavy",
                  "pr_filters": "--filter=\"@brainstrike/ui\" --filter=\"@brainstrike/file-explorer-ui\" --filter=\"@brainstrike/app-shell\"",
                  "push_filters": "--filter=\"@brainstrike/ui\" --filter=\"@brainstrike/file-explorer-ui\" --filter=\"@brainstrike/app-shell\"",
                  "vitest_shard": ""
                },
                {
                  "shard": "rest",
                  "partition": "rest",
                  "pr_filters": "--filter=\"!@brainstrike/db\" --filter=\"!@brainstrike/agent\" --filter=\"!@brainstrike/desktop\" --filter=\"!@brainstrike/ui\" --filter=\"!@brainstrike/file-explorer-ui\" --filter=\"!@brainstrike/app-shell\"",
                  "vitest_shard": "",
                  "push_filters": "--filter=\"!@brainstrike/db\" --filter=\"!@brainstrike/agent\" --filter=\"!@brainstrike/desktop\" --filter=\"!@brainstrike/ui\" --filter=\"!@brainstrike/file-explorer-ui\" --filter=\"!@brainstrike/app-shell\""
                }
              ]
            }
          EVENT_NAME: ${{ github.event_name }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          COVERAGE: "false"
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: node scripts/select-unit-shards.mjs

      - name: Secret scan
        run: pnpm secrets:scan

      # BST-967: the package-boundary gate. `turbo boundaries` scans build
      # output as well as source and has no way to exclude it, so
      # scripts/turbo-boundaries.mjs runs it and judges only findings in files
      # git does not ignore — anything else (a parse mismatch, a finding with
      # no file, git failing) still fails. This checkout has no dist/ either
      # way; the wrapper is what makes the same gate reproducible locally.
      # Keeping it ahead of dist-producing steps is now about scan cost, not
      # correctness. Sanctioned crossings carry inline `@boundaries-ignore
      # <reason>` comments; the contract tests in
      # scripts/__tests__/turbo-boundaries-gate.test.mjs prove this gate can
      # fail, that generated output cannot mask a source violation, and that
      # every ignore carries a reason.
      - name: Package boundaries
        run: pnpm run boundaries

      # Includes scripts/__tests__/verify-playwright-pin-sync.test.mjs — the
      # single-source guard that the Playwright container image tag pinned in
      # test.yml/web-e2e.yml/performance.yml matches @playwright/test's
      # installed version. `container.image:` cannot consume a workflow
      # expression, so the tag stays a literal in all three files and this
      # guard is the verification (throws on drift, and throws if it can no
      # longer find a pin at all rather than passing vacuously).
      - name: Script tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        env:
          TURBO_CONCURRENCY: 4
        run: pnpm run type-check

      # The lab is self-contained (it spawns its own reference servers), so it
      # needs to run when turbo's package graph says @brainstrike/mcp-test-lab
      # or one of its dependencies changed, or when its wrapper, this workflow
      # or the setup composite changed. Turbo also marks every package changed
      # on a global-file edit. The range is the checked-out merge commit
      # against its first parent: the PR event's base.sha goes stale when the
      # base branch moves, and is then absent from the depth-2 clone.
      - name: Detect MCP lab changes
        id: mcp-paths
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          head="$(git rev-parse HEAD)"
          pnpm -s exec turbo ls --filter="...[${base}...${head}]" --output=json > "$RUNNER_TEMP/turbo-changed.json"
          changed="$(node -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");const i=s.indexOf("{");if(i<0){throw new Error("turbo ls printed no JSON")}process.stdout.write(String(JSON.parse(s.slice(i)).packages.items.some((p)=>p.name==="@brainstrike/mcp-test-lab")))' "$RUNNER_TEMP/turbo-changed.json")"
          if [ "$changed" != true ] && ! git diff --quiet "$base" "$head" -- scripts/run-mcp-verification.mjs package.json .github/workflows/test.yml .github/actions/setup-workspace; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: MCP representative verification
        if: github.event_name != 'pull_request' || steps.mcp-paths.outputs.changed == 'true'
        run: pnpm run verify:mcp -- --profile pr --output artifacts/pr-evidence.json

  unit-shard:
    name: Unit (${{ matrix.shard }})
    if: needs.admission.outputs.admitted == 'true' && needs.static.outputs.unit-shard-count != '0'
    needs: [admission, static]
    # The Unit matrix runs on the same explicit 4-vCPU/16-GB Ubicloud class as
    # the other Linux x64 jobs. GitHub's hosted ARM pool terminated the `rest`
    # shard without a test assertion on five consecutive attempts across two
    # exact PR heads (runs 30158896583 and 30175303301, 2026-07-25). Moving the
    # complete matrix keeps one fixed runner contract — no per-shard selection
    # and no automatic fallback — while preserving every test, filter, and the
    # required `Unit` fan-in below. `.turbo` cache keys include `runner.arch`,
    # so this cannot cross-restore an incompatible ARM cache layer.
    runs-on: ubicloud-standard-4
    # Desktop is a separate package partition: its serial unit + integration
    # execution dominated recent runs (8m + 12m). Three native Vitest shards
    # preserve every file and one worker per VM without making PGlite suites
    # compete on the same host. The remaining UI packages keep their own row.
    # DB and Agent retain two native shards each. Rest owns every other
    # affected package.
    # scripts/__tests__/unit-shard-partition.test.mjs verifies complete,
    # disjoint coverage; Unit below remains the required fan-in.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.unit-matrix) }}
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Unit check."
          exit 1

      # `fetch-depth: 0` is REQUIRED here: task-aware affected selection needs
      # the exact PR base and tested checkout commits, including stacked bases. Checkout stays in the
      # caller (not the composite) — see setup-workspace/action.yml's header.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # THE LINUX HALF OF THE FENCE SECURITY SUITES (BST-1071).
      #
      # packages/agent has three suites that run against a REAL OS sandbox:
      # fence-executor (the contract), run-python-tool (end to end) and the
      # escape-resistance red team. On macOS that is Seatbelt, which needs
      # nothing installed. On Linux it is @anthropic-ai/sandbox-runtime's
      # bubblewrap backend, which shells out to three binaries the runner image
      # does not carry — `bwrap`, `socat` (srt's network bridge) and `rg` (its
      # mandatory-deny scan).
      #
      # Without them `SandboxManager.checkDependenciesAsync()` reports errors
      # and all three suites SKIP THEMSELVES — quietly, and GREEN. That is what
      # CI did until this step existed, while `docs/agents/code-execution.md`
      # and `fence-escape-resistance.README.md` both required an srt bump to be
      # re-greened on macOS AND Linux. Only the ungated version-pin assertion
      # ever ran here. `BRAINSTRIKE_FENCE_DEPS_REQUIRED` on the integration
      # steps below is what stops that from silently coming back: with it set,
      # a missing dependency FAILS the lane instead of skipping it.
      #
      # `kernel.apparmor_restrict_unprivileged_userns=0` is load-bearing, not
      # tidying. Measured on this runner class (Ubuntu 24.04.4, kernel
      # 6.14.0-azure, bubblewrap 0.9.0) the binaries install fine and the
      # dependency check goes green, but bubblewrap still cannot build a
      # sandbox:
      #
      #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      #     bwrap: setting up uid map: Permission denied
      #
      # Ubuntu 23.10+ ships that restriction on, and the image carries no
      # AppArmor profile granting bwrap `userns create` (only the generic
      # `unprivileged_userns` and `lxc-usernsexec` profiles). Every fenced run
      # then dies before executing a line, which took the suites from 27 quiet
      # skips to 44 hard failures — a red required lane that proves nothing.
      # Lifting the restriction is Ubuntu's own documented remediation, the
      # runner is an ephemeral VM that already runs this repo's code with
      # passwordless sudo, and it changes only whether bwrap can build its
      # namespace — NOT what the fence then denies inside it, which is the
      # entire subject of these suites.
      #
      # It runs on every shard rather than only the one that currently owns
      # packages/agent: shard membership is a filter list two screens up, and a
      # dependency that silently stops being installed when a package moves
      # shards is the exact failure this step exists to end.

      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install the Linux OS-fence dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fail HERE, with the kernel's own message, rather than 40 assertion
          # failures deep inside a security suite.
          bwrap --ro-bind / / --dev /dev --unshare-all --die-with-parent /bin/echo bwrap-ok
          # The suites need an interpreter to fence, and all three skip
          # themselves without one. The runner image has always carried it;
          # asserting it here means a future image that drops it fails as
          # provisioning rather than as a lane that promised proofs it did not
          # run (BRAINSTRIKE_FENCE_DEPS_REQUIRED would catch it either way, but
          # this names the cause in one line).
          python3 --version

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      # NO standalone build step (B4). Test lanes resolve workspace imports
      # from SOURCE (the B3 #1651 registry + the app vitest alias maps), so
      # tests no longer need `dist` to exist, and `test.dependsOn` is the
      # no-build `topo` transit node instead of `^build` (turbo.jsonc). The few
      # lanes that genuinely consume built artifacts (packages/utils' own-dist
      # test, packages/db's nested-tsc test) declare exact `#build` edges in
      # their own turbo.json, and Turbo SELF-BUILDS exactly those. Desktop's
      # native restart verifier additionally declares agent/assistant-data builds:
      # its child Node processes resolve public exports outside Vitest aliases.
      # The predecessor step's #1066/#1207 rationale
      # ("exports maps pointing at dist fail to resolve at test time") is
      # retired by source resolution, and unlike that incident a regression
      # here fails LOUDLY on the always-clean CI runner instead of passing
      # against stale dist. The Build job below still exercises the full build.

      # Native task-aware affected selection intersects each package partition
      # with the exact base/checkout pair. Explicit SCM refs avoid Turbo's
      # inferred main~1 range, including on stacked PRs and merge commits.
      # Cross-package inputs select their actual readers without making every
      # document a global cache dependency.
      # Push/manual and local checks continue to execute the complete suite.
      #
      # TURBO_TEST_MODE=unit and TEST_TIMEOUT_MULTIPLIER=2 are set EXPLICITLY
      # here so the `test` task cache key (both are in turbo.jsonc `test.env`)
      # matches the push path below AND the local `pnpm test` / `pnpm check`
      # scripts. The dedicated multiplier gives local tests CI's timeout policy
      # without setting CI and changing unrelated workload (BST-1050).
      # --concurrency=4 preserves the prior `--workspace-concurrency=4` cap.
      #
      # PHASE SPLIT (two sequential turbo invocations, one named step each).
      # `test` and `test:integration` previously ran in a SINGLE
      # `turbo run test test:integration --concurrency=4`. On whole-repo-
      # selection PRs (any global-file edit) that starved the runner: once the
      # cacheable `test` lanes fill from cache, all 4 turbo slots end up occupied
      # exclusively by the heavy UNCACHED lanes — the `test:integration` suites
      # (embeddings, agent, app-shell, desktop, web, file-import) plus the
      # whole-task-uncached `db#test` — i.e. 4 concurrent real-PGlite/wall-clock
      # suites on a small hosted runner (PR #1650 run 29294546967: job-timeout,
      # then lost-runner, then a 4-lane turbo cancellation cascade). The lanes
      # are individually sound (local `--concurrency=1` = 128/128 green); this is
      # the documented PGlite-under-CI-load flake class manifesting through lane
      # CONCURRENCY, so the fix is at source in CI.
      #
      # Phase 1 runs the cacheable `test` lanes (+ the whole-task-uncached
      # db/secure-fs-native `test` lanes, mostly light or singular) at
      # --concurrency=4. Phase 2 runs ONLY the uncached env-sensitive
      # `test:integration` lanes (root turbo.jsonc, `cache: false`) capped at
      # --concurrency=2 so at most two real-subsystem suites run at once. Two
      # named steps (not one `&&` step) give clearer failure attribution in the
      # UI; turbo re-resolves quickly on the second invocation. turbo.jsonc's
      # `test:integration` has `dependsOn: ["topo"]` (the B4 no-build transit
      # node), plus explicit package-local built-artifact edges. turbo skips each
      # task for packages that do not define it (no `--if-present` needed).
      # COVERAGE="false" (2026-07-20): the PR path previously omitted this,
      # and per-package vitest configs enable V8 coverage whenever CI==='true'
      # unless COVERAGE overrides it — so every PR unit run silently paid
      # coverage-instrumentation overhead whose output nothing consumed (the
      # push path already set it; coverage.yml/nightly-coverage.yml own real
      # coverage). turbo.jsonc keeps COVERAGE in `passThroughEnv` (out of the
      # cache key), so PR and push runs still share cache entries — and now
      # also genuinely run the same uninstrumented workload.
      - name: Pull request affected unit tests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          AGENT_TEST_SHARD: ${{ matrix.partition == 'agent' && matrix.vitest_shard || '' }}
          AGENT_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'agent' && 'true' || 'false' }}
          DESKTOP_TEST_SHARD: ${{ matrix.partition == 'desktop' && matrix.vitest_shard || '' }}
          DESKTOP_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'desktop' && 'true' || 'false' }}
          COVERAGE: "false"
          DB_TEST_SHARD: ${{ matrix.partition == 'db' && matrix.vitest_shard || '' }}
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: node scripts/run-test-command.mjs -- pnpm turbo run test ${{ matrix.pr_filters }} --affected --concurrency=4

      - name: Pull request affected integration tests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          # This lane installed bubblewrap/socat/ripgrep above, so the
          # real-fence suites must RUN here. Set, a missing dependency is a
          # lane defect that fails collection instead of a host quirk the
          # suites skip over; see packages/agent/src/__tests__/fixtures/
          # fence-host-gate.ts. Deliberately NOT set in the coverage lanes,
          # which install nothing and keep the loud-skip behaviour.
          BRAINSTRIKE_FENCE_DEPS_REQUIRED: "1"
          AGENT_TEST_SHARD: ${{ matrix.partition == 'agent' && matrix.vitest_shard || '' }}
          AGENT_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'agent' && 'true' || 'false' }}
          DESKTOP_TEST_SHARD: ${{ matrix.partition == 'desktop' && matrix.vitest_shard || '' }}
          DESKTOP_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'desktop' && 'true' || 'false' }}
          COVERAGE: "false"
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: node scripts/run-test-command.mjs -- pnpm turbo run test:integration ${{ matrix.pr_filters }} --affected --concurrency=2

      # Push (main) + workflow_dispatch: full non-affected suite routed through
      # turbo so the remote cache (TURBO_TOKEN/TURBO_TEAM inherited from the
      # workflow `env:` block) covers these runs too, and so push and PR runs
      # share cache entries. TURBO_TEST_MODE=unit (below) keeps the `test` task
      # cache key identical to the PR path and the local `pnpm test` script.
      # Same PHASE SPLIT as the PR path: phase 1 runs the cacheable `test` lanes
      # at --concurrency=4 (matches the PR path and the root `pnpm test`
      # script), phase 2 runs the uncached env-sensitive `test:integration`
      # lanes capped at --concurrency=2 so at most two real-subsystem suites run
      # at once. See the PR-path comment above for the starvation rationale.
      #
      # @brainstrike/embeddings is NO LONGER excluded (Series A4, #1629): its
      # env-sensitive files now carry the `*.integration.test.*` suffix and run
      # in the uncached `test:integration` lane, so its pure `test` lane is
      # cacheable and is finally CI-covered on push. The manual model-download
      # tier stays out of CI by FILENAME (`*.models.test.*`, selected only by
      # `test:models` via vitest.models.config.mts) — not by this package
      # filter — so dropping the filter cannot pull model downloads into CI.
      - name: Push and manual unit tests
        if: github.event_name != 'pull_request'
        env:
          AGENT_TEST_SHARD: ${{ matrix.partition == 'agent' && matrix.vitest_shard || '' }}
          AGENT_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'agent' && 'true' || 'false' }}
          DESKTOP_TEST_SHARD: ${{ matrix.partition == 'desktop' && matrix.vitest_shard || '' }}
          DESKTOP_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'desktop' && 'true' || 'false' }}
          COVERAGE: "false"
          DB_TEST_SHARD: ${{ matrix.partition == 'db' && matrix.vitest_shard || '' }}
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: node scripts/run-test-command.mjs -- pnpm turbo run test ${{ matrix.push_filters }} --concurrency=4

      - name: Push and manual integration tests
        if: github.event_name != 'pull_request'
        env:
          # See the pull-request integration step above.
          BRAINSTRIKE_FENCE_DEPS_REQUIRED: "1"
          AGENT_TEST_SHARD: ${{ matrix.partition == 'agent' && matrix.vitest_shard || '' }}
          AGENT_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'agent' && 'true' || 'false' }}
          DESKTOP_TEST_SHARD: ${{ matrix.partition == 'desktop' && matrix.vitest_shard || '' }}
          DESKTOP_TEST_SHARD_REQUIRED: ${{ matrix.partition == 'desktop' && 'true' || 'false' }}
          COVERAGE: "false"
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: node scripts/run-test-command.mjs -- pnpm turbo run test:integration ${{ matrix.push_filters }} --concurrency=2

  # Fan-in job preserving the required-check name "Unit": branch protection
  # points at this single check, not at the per-shard matrix jobs, so shard
  # membership can change without touching repo settings.
  #
  # A verified empty selection may skip the matrix; every nonempty selection
  # must succeed. Selection failure, missing output, cancellation and a skipped
  # nonempty matrix fail Unit instead of silently satisfying branch protection.
  unit:
    name: Unit
    if: github.repository == 'seandearnaley/brainstrike' && always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission, static, unit-shard]
    # This fan-in only checks one dependency result and completes in ~3s. Use
    # GitHub's 1-core slim runner so per-job minute rounding does not charge the
    # ARM compute rate for a job that performs no build or test work.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Unit check."
          exit 1

      - name: Check shard results
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          SHARD_COUNT: ${{ needs.static.outputs.unit-shard-count }}
          SHARD_RESULT: ${{ needs.unit-shard.result }}
        run: |
          set -euo pipefail
          if [ "$STATIC_RESULT" != "success" ]; then
            echo "::error::Static or affected selection failed; Unit cannot pass."
            exit 1
          fi
          case "$SHARD_COUNT" in
            '' | *[!0-9]*) echo "::error::Missing or invalid shard count"; exit 1 ;;
          esac
          echo "unit-shard result: $SHARD_RESULT ($SHARD_COUNT selected)"
          if [ "$SHARD_COUNT" = "0" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "Turbo verified that no Unit tasks are affected."
          elif [ "$SHARD_COUNT" = "0" ] || [ "$SHARD_RESULT" != "success" ]; then
            exit 1
          fi

  # The `coverage` job MOVED to .github/workflows/coverage.yml. It needs a
  # `coverage`-label trigger, which would mean subscribing THIS workflow to
  # the `pull_request` `labeled` action — and this workflow is the sole
  # producer of every required status check, so every label add would then
  # report those checks as `skipped` and grey out the merge box (measured on
  # PR #1664). See the header comment in coverage.yml for the full rationale.
  # Coverage is advisory; nightly-coverage.yml remains the threshold gate.
  # This is enforced, not just asserted: the ruleset requires only Static, Unit,
  # Build, Web E2E and Desktop E2E, so Codecov statuses cannot block a merge, and
  # codecov.yml marks them `informational` to stop them rendering a misleading
  # red X. scripts/verify-codecov-status-contract.mjs guards that pairing; see
  # docs/archive/agent-contract-history/ci-quality/codecov-non-gating.md.

  build:
    name: Build
    if: github.repository == 'seandearnaley/brainstrike' && always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Build check."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Build
        # Invoked as `pnpm turbo` DIRECTLY rather than through the root
        # `pnpm run build` script, and that is load-bearing for any flag added
        # here: `pnpm run build -- <flags>` preserves the `--`, so turbo reads
        # them as PASS-THROUGH args and appends them to every package's own
        # build script, where pnpm tacks them onto the last command of the `&&`
        # chain. Measured on the first run of BST-1005: `tsup ...
        # --continue=dependencies-successful` and a node-gyp build both died
        # that way. The Unit shards already call `pnpm turbo run test` directly
        # for the same reason. Mirrors the root script's own turbo flags.
        #
        # `--continue=dependencies-successful` reports every independent
        # failure in one run instead of cancelling siblings at the first error
        # — the point of a build gate is to show all of what is broken.
        #
        # NOT affected-filtered (BST-1005, measured): both E2E smoke jobs run
        # on EVERY PR (AGENTS.md CI contract, and audit-bolt-readiness.mjs
        # counts a skipped required check as not-ready), so this job must
        # always produce the web and desktop bundles they consume. Those two
        # apps' dependency closure is 46 of 47 workspace packages, so a
        # `...[origin/$BASE_REF]` filter here can skip at most ONE package
        # (@brainstrike/tsconfig) while turbo's cache already replays the rest.
        env:
          TAILWIND_DEBUG: '1'
        run: pnpm turbo run build --summarize --log-order=grouped --continue=dependencies-successful

      - name: Validate CSS bundle
        run: |
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          fi

          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          fi

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            apps/desktop/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  native-windows:
    name: Native Windows
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: windows-latest
    # BST-1712: 20 -> 30. A retry the job timeout guillotines is not a retry.
    # The observed abort wasted 240s of dead wait before node-gyp gave up, and
    # the failing run had already spent 9m of its 20 by then; two such attempts
    # plus a good one plus build/test does not fit under 20. 30 is this repo's
    # standard failure ceiling (docs/agents/ci-quality.md), not a latency target
    # — the healthy path is unchanged and still finishes well inside 20.
    timeout-minutes: 30
    env:
      # BST-1375: pin node-gyp's dev dir (default `%LOCALAPPDATA%\node-gyp\Cache`)
      # to a path the cache steps below can name. node-gyp reads this the same
      # way it reads any npm config, and it survives pnpm's script runner, so
      # the lifecycle-invoked `node-gyp rebuild` of both native packages honours
      # it. This is NOT about path length — see the comment on the restore step.
      npm_config_devdir: ${{ github.workspace }}\.node-gyp
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # BST-1375: the Node HEADER TARBALL, cached so it is not downloaded here.
      #
      # This job installs TWO packages that build native addons, and neither has
      # the headers: `secure-fs-native` (implicit `node-gyp rebuild`, from
      # `gypfile: true`) and `windows-job-native` (an explicit install script
      # that shells out to node-gyp on win32). pnpm runs workspace install
      # scripts CONCURRENTLY — measured locally: two projects' install scripts
      # start within 1ms of each other — so both processes GET the same ~30MB
      # `node-vX-headers.tar.gz` from nodejs.org at the same moment. Twice in
      # 290 Native Windows attempts one of those two streams returned 200 and
      # was then aborted mid-body ~80s later (`TypeError: terminated`, undici
      # `Fetch.onAborted`), failing the whole `Setup workspace` step. The
      # `TAR_ENTRY_ERROR ENOENT` lines that dominate the log are downstream
      # noise: node-gyp's rollback deletes the temp dir while tar is still
      # writing into it. The paths involved are ~133 characters, so MAX_PATH and
      # long-path settings have nothing to do with it, and node-gyp extracts to
      # `os.tmpdir()` rather than the dev dir, so a shorter devdir would not
      # have moved that path either.
      #
      # A restored dev dir removes the download outright: node-gyp's `--ensure`
      # stats it, reads `installVersion`, re-checks `<arch>/node.lib` on Windows
      # and reports "version is good" without issuing a single HTTP request
      # (verified against the pinned node-gyp 13.0.1). No download, nothing to
      # abort. A cold cache still downloads twice and keeps today's exposure —
      # this narrows the window rather than making the fetch itself robust.
      #
      # BST-1712 closed that remaining window: a cold cache is now a RETRIED
      # install (see the Setup workspace step). Cache is the fast path, retry is
      # the backstop; neither replaces the other, because a cold cache is not
      # rare — key misses happen on every Node patch bump and on LRU eviction,
      # and run 34353973428 was exactly a `Cache not found for input keys` run.
      #
      # Restore is prefix-only: the save key is this `.nvmrc`-hash prefix plus
      # the version setup-node resolves inside the composite below, which is
      # not known yet here. `.nvmrc` pins an exact version, not a major, so a
      # Node bump changes the prefix itself and can never hit a stale entry.
      - name: Restore node-gyp headers
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}\.node-gyp
          key: ${{ runner.os }}-${{ runner.arch }}-node-gyp-${{ hashFiles('.nvmrc') }}-
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-gyp-${{ hashFiles('.nvmrc') }}-

      # No turbo-cache: this job doesn't route through turbo. `shell: bash` in
      # the composite's install step works on windows-latest via the runner's
      # bundled Git Bash, same as every other step in this composite already
      # running fine cross-platform.
      #
      # BST-1712: the cold-cache path is retried. The comment above already
      # predicted this gap ("a cold cache still downloads twice and keeps
      # today's exposure"), and run 34353973428 walked straight into it:
      # `Cache not found for input keys`, both packages GET the tarball ~0.9s
      # apart, both get 200, and 240s later one stream aborts in undici's
      # `client-h2.js` — two concurrent ~30MB bodies multiplexed over one HTTP/2
      # connection to nodejs.org, one of which the server dropped mid-body.
      #
      # node-gyp's own undici `RetryHandler` is IN that stack, so "node-gyp
      # already retries" is not an answer: undici's retry covers connect/idle
      # errors, not a 200 whose body is aborted part-way. The attempt has to be
      # restarted from outside node-gyp, which means restarting the install.
      #
      # 3 attempts, and the retries are cheap: node_modules is already
      # materialised after attempt 1, so a repeat pass re-runs only the failed
      # lifecycle scripts (see the composite's comment for the measurement).
      - name: Setup workspace
        id: setup
        uses: ./.github/actions/setup-workspace
        with:
          install-attempts: '3'

      # Explicit build first: the package's `test` script deliberately does NOT
      # build inline anymore (an inline `pnpm build &&` raced turbo's own
      # `build` task — two concurrent node-gyp rebuilds in one directory; see
      # packages/secure-fs-native/turbo.json). Under turbo the dependsOn edge
      # supplies the addon; this job bypasses turbo, so it builds explicitly.
      - name: Build and test secure filesystem capability
        run: |
          pnpm --filter @brainstrike/secure-fs-native build
          pnpm --filter @brainstrike/secure-fs-native test

      - name: Build and test Agent DevTools process ownership
        run: |
          pnpm --filter @brainstrike/windows-job-native build
          pnpm --filter @brainstrike/windows-job-native test

      # BST-1920: better-sqlite3 and sqlite-vec are shipped PREBUILT and are
      # never compiled here (better-sqlite3 is denied in `allowBuilds`), so there
      # is no build step: this proves the win32-x64 binaries load under Node and
      # round-trip a vec0 table.
      - name: Test SQLite native prebuilds
        run: pnpm --filter @brainstrike/sqlite-native test

      # `always()`: the headers are valid whether or not the C++ compiled, and a
      # test failure is exactly when the next run should not re-download them.
      #
      # The version guard is not politeness. If `Setup workspace` failed before
      # setup-node resolved a version, this key would collapse onto the restore
      # step's prefix — and an entry saved under the bare prefix EXACT-matches
      # future restores, shadowing the good version-keyed entry that
      # `restore-keys` would otherwise have found. Refusing to write a key that
      # would be wrong beats writing one that silently outranks the right one.
      #
      # The outcome guard covers the OTHER failure window: the header download
      # runs inside the composite's install step, AFTER setup-node — and a
      # composite exposes its outputs even when a later embedded step fails. A
      # failed download rolls back only the NEW version's dev dir, so on a
      # patch bump a cross-version restore survives in the devdir; without this
      # guard `always()` would archive that older tree under the new exact key,
      # which is immutable and preferred by restore-keys (newest) from then on.
      # A test/build failure leaves the setup outcome `success`, so the
      # keep-the-cache-warm intent of `always()` is unaffected.
      - name: Save node-gyp headers
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.node-version != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}\.node-gyp
          key: ${{ runner.os }}-${{ runner.arch }}-node-gyp-${{ hashFiles('.nvmrc') }}-${{ steps.setup.outputs.node-version }}

  native-electron:
    name: Native Electron Package
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Provision Linux desktop services
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes dbus-x11 gnome-keyring xdg-utils

      # Both the native smoke (`electron`) and electron-builder need the same
      # Electron release archive. Provision it once with bounded transfers and
      # retries, extract it for the smoke, then pass the verified zip to
      # electron-builder so this job has one visible download boundary instead
      # of two implicit fetches.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p,fs.constants.X_OK);if(fs.statSync(p).size===0){throw new Error('empty Electron binary at '+p)}console.log('Electron binary present at '+p)"
          echo "ELECTRON_DIST=$ELECTRON_ZIP" >> "$GITHUB_ENV"

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --filter=@brainstrike/mcp-test-lab --filter=@brainstrike/mcp-app-host --concurrency=4

      - name: Load the native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:electron

      - name: Package the desktop application
        env:
          # Bakes the E2E-only MCP Tasks harness chunk into THIS package for the
          # packaged Tasks verifier below; release packaging never sets it.
          VITE_MCP_TASK_HARNESS: '1'
        run: |
          set -euo pipefail
          test -n "${ELECTRON_DIST:-}"
          pnpm --filter @brainstrike/desktop run pack -- --config.electronDist="$ELECTRON_DIST" 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"
          # BST-1920: `npmRebuild: false` makes the shipped prebuilds the only
          # native binaries better-sqlite3 and sqlite-vec ever have. If
          # electron-builder stops saying it skipped the rebuild, it recompiled.
          grep -q 'skipped dependencies rebuild' "$RUNNER_TEMP/electron-builder.log"

      - name: Verify packaged MCP Apps bridge
        run: dbus-run-session -- pnpm --filter @brainstrike/desktop run test:e2e:lane:packaged-mcp-apps-bridge
      - name: Verify packaged MCP Tasks lifecycle
        run: dbus-run-session -- pnpm --filter @brainstrike/desktop run test:e2e:lane:packaged-mcp-tasks

      - name: Verify packaged MCP Apps lifecycle
        run: dbus-run-session -- pnpm --filter @brainstrike/desktop run test:e2e:lane:packaged-mcp-apps

      - name: Load the packaged native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:packaged

      - name: Load the native SQLite prebuilds in Electron
        run: pnpm --filter @brainstrike/sqlite-native test:electron

      - name: Load the packaged native SQLite prebuilds
        run: pnpm --filter @brainstrike/sqlite-native test:packaged

      - name: Load the packaged @parcel/watcher binding in Electron (BST-568)
        run: pnpm --filter @brainstrike/file-system test:packaged

      - name: Verify packaged MCP core lifecycle
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_CONFIG_HOME="$(mktemp -d)"
            export XDG_DATA_HOME="$(mktemp -d)"
            export XDG_CURRENT_DESKTOP=GNOME
            eval "$(gnome-keyring-daemon --unlock --components=secrets <<< "")"
            pnpm --filter @brainstrike/desktop run test:e2e:lane:packaged-mcp-core
          '

      - name: Upload packaged MCP test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: mcp-packaged-core-${{ github.sha }}
          path: apps/desktop/blob-report
          if-no-files-found: warn

  browser-tests:
    name: Browser tests
    # Vitest 4 browser-mode suites (real Chromium): packages/db PGlite WASM
    # semantics (BST-64/BST-994 — unskipped after eight months), packages/ui,
    # packages/assistant-ui assistant browser suites, packages/storage web adapter,
    # and embedding-worker cache concurrency in real Chromium. Before this job
    # existed, `test:browser` ran NOWHERE in CI — only in the local `pnpm
    # check` gate — while turbo.jsonc's task comment claimed otherwise.
    # Not (yet) a required check: branch protection is Sean's call; this lane
    # must first prove itself deterministic.
    if: github.repository == 'seandearnaley/brainstrike' && always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    # Cost-first runner migration (2026-08-28): this lane used 1,928 rounded
    # GitHub Linux minutes in the 7.76-day audit. The same pinned Playwright
    # container contract is already green in the Ubicloud Web E2E job, and the
    # explicit 4-vCPU shape matches TURBO_CONCURRENCY below. There is no
    # provider fallback: allocation must queue or fail visibly.
    runs-on: ubicloud-standard-4
    # Same official Playwright image + pin as Web E2E — browsers baked in, no
    # cdn.playwright.dev download at job time. KEEP IN SYNC: the image tag MUST
    # equal @playwright/test's version (scripts/verify-playwright-pin-sync.mjs
    # is the drift check; bump together with the pins in test.yml/web-e2e.yml/
    # performance.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Five browser-test packages on a 4-core hosted runner: cap turbo the
      # same way the static job does, so the in-job builds and the browser
      # suites don't oversubscribe the runner.
      TURBO_CONCURRENCY: "4"
      # The root devDependency @mermaid-js/mermaid-cli pulls in puppeteer,
      # whose postinstall downloads two Chrome builds that nothing in this lane
      # uses (the suites run Playwright's Chromium from the image). As pwuser
      # this image has no `unzip`, so @puppeteer/browsers 3.2.5 falls back to
      # its yauzl extractor, and with the resolved optional yauzl@2.10.0 a
      # large zip entry never finishes: the promise never settles, Node exits 13
      # on the unsettled top-level await, and `pnpm install` fails (run
      # 39029250373; reproduced offline with a 60 MB entry). Puppeteer's
      # documented PUPPETEER_SKIP_DOWNLOAD skips that unused download. The
      # dependency defect itself is BST-2078.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to run Browser tests on an unadmitted head."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # `test:browser` dependsOn build, so the pure-TS db/ui/assistant-ui/storage/
      # embedding-worker closure builds in-job. The remote Turbo cache carries
      # most of it; this local
      # .turbo layer is the same outage hedge the setup-workspace composite
      # provides (same key scheme — the composite itself can't be used here
      # because its fixed full `pnpm install` would hit node-gyp in this
      # toolchain-less container).
      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Install dependencies
        # This container has no C toolchain or sudo; the browser-test packages
        # (db, ui, assistant-ui, storage, embedding-worker, mcp-app-host) and
        # their dependency closures are pure TS, so desktop and the three
        # native addon projects are excluded from install. windows-job-native
        # has compiled on Linux since M3 (#3543) and failed this install with
        # `not found: make` once it was a shared dependency (BST-2080).
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native' --filter '!@brainstrike/windows-job-native'

      - name: Run browser tests
        # Explicit --filter per browser-test package: an UNFILTERED root
        # `pnpm test:browser` puts all 47 workspace packages in turbo scope and
        # builds both desktop native addons, which this toolchain-less pwuser
        # container cannot compile (proven by this lane's first run). The
        # filtered scope is the five packages + their pure-TS closure.
        # KEEP IN SYNC with packages defining a test:browser script —
        # scripts/__tests__/browser-lane-filter-contract.test.mjs fails
        # `pnpm test:scripts` (Static job) if a package gains test:browser
        # without being added here.
        run: pnpm test:browser --filter=@brainstrike/assistant-ui --filter=@brainstrike/canonical-ingestion --filter=@brainstrike/db --filter=@brainstrike/embedding-worker --filter=@brainstrike/mcp-app-host --filter=@brainstrike/storage --filter=@brainstrike/ui --filter=@brainstrike/web-state-store --filter=@brainstrike/web-writer

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          include-hidden-files: true
          path: |
            packages/db/test-results/
            packages/assistant-ui/test-results/
            packages/embedding-worker/test-results/
            packages/ui/test-results/
            packages/storage/test-results/
            packages/mcp-app-host/test-results/
            packages/canonical-ingestion/test-results/
            packages/web-state-store/test-results/
            packages/web-writer/test-results/
            packages/db/.vitest/attachments/failure-screenshots/
            packages/assistant-ui/.vitest/attachments/failure-screenshots/
            packages/embedding-worker/.vitest/attachments/failure-screenshots/
            packages/ui/.vitest/attachments/failure-screenshots/
            packages/storage/.vitest/attachments/failure-screenshots/
            packages/mcp-app-host/.vitest/attachments/failure-screenshots/
            packages/canonical-ingestion/.vitest/attachments/failure-screenshots/
            packages/web-state-store/.vitest/attachments/failure-screenshots/
            packages/web-writer/.vitest/attachments/failure-screenshots/
          retention-days: 1
          if-no-files-found: ignore

  web-e2e:
    name: Web E2E
    if: >-
      github.repository == 'seandearnaley/brainstrike' &&
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build]
    runs-on: ubicloud-standard-4
    # Official browser/system-dependency fleet; fixed CfT is provisioned below.
    # Root is Playwright's documented mode for trusted E2E and permits explicit
    # system-tool installation. No custom image publication is required.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 0
    timeout-minutes: 25
    env:
      NODE_ENV: production
      PORT: "8080"
      BASE_URL: http://127.0.0.1:8080
      # Browsers are preinstalled here in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      pnpm_config_verify_deps_before_run: error
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Web E2E check."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install web test system tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends unzip lsof procps

      # `jobs.<id>.env` cannot read the `runner` context, so the directory is
      # exported here for every later step (playwright.config.mts reads it).
      - name: Provision qualified web Chromium
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BRAINSTRIKE_WEB_CHROMIUM_DIR="$RUNNER_TEMP/web-chromium"
          echo "BRAINSTRIKE_WEB_CHROMIUM_DIR=$BRAINSTRIKE_WEB_CHROMIUM_DIR" >> "$GITHUB_ENV"
          test "$(node --version)" = "v$(cat .nvmrc)"
          mkdir -p apps/web/test-results
          node scripts/provision-web-chromium.mjs "$BRAINSTRIKE_WEB_CHROMIUM_DIR" > apps/web/test-results/web-chromium-provisioning.json

      - name: Install dependencies
        # Exclude desktop and the native addon projects: this container has no
        # C toolchain, this job runs the downloaded web build rather than
        # building it, and web E2E loads no native surface. windows-job-native
        # compiles on Linux since M3 (#3543) (BST-2080). Do NOT revert to a bare
        # full install; node-gyp will fail before Playwright starts.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native' --filter '!@brainstrike/windows-job-native'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Run web smoke
        run: pnpm --filter @brainstrike/web run test:e2e:lane:smoke

      - name: Upload web smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-main-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  # BST-1762: desktop smoke runs as two lanes on separate runners. One serial
  # lane of 47 passing cases took 722-871 s of its 900 s Playwright ceiling
  # across 24 green runs (2026-09-12..15) and timed out at 898 s in run
  # 34988958978. Per-case CI means summed to 466 s for the delegated specs and
  # 337 s for every other spec, so each lane gets its own runner and 900 s
  # ceiling. The required `Desktop E2E` check is the fan-in after them, so the
  # ruleset is unchanged.
  # Lane spec lists and this job graph are pinned by
  # scripts/__tests__/ai-tools-e2e-pr-gate-contract.test.mjs.
  desktop-e2e-smoke:
    name: Desktop E2E (smoke)
    if: >-
      github.repository == 'seandearnaley/brainstrike' &&
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the desktop smoke lane."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — it does NOT use a `playwright install chromium` browser. So we
      # only need the Chromium system libraries (apt), not the browser binary
      # download from cdn.playwright.dev (which was stalling and hanging the
      # job). `install-deps` is apt-only and does not touch the browser CDN.

      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # The desktop smoke launches the REAL Electron binary via
      # `_electron.launch`. Electron 43 exposes install.js only as a bin and has
      # no install lifecycle, so pnpm cannot provision the binary. Download the
      # prebuilt zip from GitHub Releases immediately before smoke so no later
      # step can disturb the executable, then hard-verify it exists.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session provides an ephemeral D-Bus session so Chromium
      # inside Electron doesn't spew `[ERROR:dbus/bus.cc:405] Failed to
      # connect to the bus` for every spawned process. Tests pass without
      # this (Electron handles the missing bus gracefully), but suppressing
      # the noise keeps the smoke log readable.
      # dbus-run-session is provided by the `dbus` package, pre-installed
      # on the ubuntu-latest runner.
      - name: Run desktop smoke
        working-directory: apps/desktop
        run: dbus-run-session -- pnpm run test:e2e:lane:smoke

      - name: Upload desktop smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-main-test-results
          path: apps/desktop/blob-report/
          retention-days: 1
          if-no-files-found: warn

  # Same provisioning as desktop-e2e-smoke; its step comments explain each step.
  desktop-e2e-delegated:
    name: Desktop E2E (delegated smoke)
    if: >-
      github.repository == 'seandearnaley/brainstrike' &&
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the desktop delegated smoke lane."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      - name: Run desktop delegated smoke
        working-directory: apps/desktop
        run: dbus-run-session -- pnpm run test:e2e:lane:smoke-delegated

      - name: Upload desktop delegated smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-delegated-test-results
          path: apps/desktop/blob-report/
          retention-days: 1
          if-no-files-found: warn

  # Fan-in job preserving the required-check name "Desktop E2E" over both smoke
  # lanes, like `unit` over `unit-shard`. It carries the lanes' exact condition,
  # so it skips exactly when they skip (not admitted, failed build, manual
  # dispatch) and fails when admission failed or any lane did not succeed.
  desktop-e2e:
    name: Desktop E2E
    if: >-
      github.repository == 'seandearnaley/brainstrike' &&
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build, desktop-e2e-smoke, desktop-e2e-delegated]
    # Reads two dependency results and completes in seconds, so it uses the
    # same slim runner as the Unit fan-in.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Desktop E2E check."
          exit 1

      - name: Check lane results
        env:
          LANE_RESULTS: ${{ needs.desktop-e2e-smoke.result }} ${{ needs.desktop-e2e-delegated.result }}
        run: |
          echo "Desktop smoke lane results: $LANE_RESULTS"
          if [ "$LANE_RESULTS" != "success success" ]; then
            echo "::error::Desktop smoke lanes did not all succeed: $LANE_RESULTS"
            exit 1
          fi

  # A red night must announce itself: nothing else re-checks main after a
  # merge. Every job's result goes to the shared Linear notifier, which files
  # one `nightly-alert` issue per red workflow and comments on later nights.
  notify-linear:
    name: Notify Linear
    needs: [admission, static, unit-shard, unit, build, native-windows, native-electron, browser-tests, web-e2e, desktop-e2e-smoke, desktop-e2e-delegated, desktop-e2e]
    if: ${{ github.repository == 'seandearnaley/brainstrike' && always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      workflow_name: ${{ github.workflow }}
      results: admission=${{ needs.admission.result }},static=${{ needs.static.result }},unit-shard=${{ needs.unit-shard.result }},unit=${{ needs.unit.result }},build=${{ needs.build.result }},native-windows=${{ needs.native-windows.result }},native-electron=${{ needs.native-electron.result }},browser-tests=${{ needs.browser-tests.result }},web-e2e=${{ needs.web-e2e.result }},desktop-e2e-smoke=${{ needs.desktop-e2e-smoke.result }},desktop-e2e-delegated=${{ needs.desktop-e2e-delegated.result }},desktop-e2e=${{ needs.desktop-e2e.result }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
