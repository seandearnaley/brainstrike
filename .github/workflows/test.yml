name: Test

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  admission:
    name: Quiet-head admission
    # PR synchronization is bursty: the measured 2026-07-15..19 sample reached
    # 44 concurrent Linux jobs, while 31.3% of Test runs were ultimately
    # cancelled. Hold the fan-out on GitHub's $0.002/min 1-core runner so a
    # follow-up push can cancel this cheap sleep instead of seven build/test
    # runners. Push and workflow_dispatch events pass through immediately.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.admission.outputs.result }}
    steps:
      - name: Wait for pull request activity to settle
        if: github.event_name == 'pull_request'
        run: sleep 120

      - name: Admit the current pull request head
        id: admission
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') {
              core.notice('Quiet-head admission is immediate outside pull requests.');
              return 'true';
            }

            const eventPull = context.payload.pull_request;
            const pullNumber = eventPull?.number;
            const runHead = eventPull?.head?.sha;
            if (!pullNumber || typeof runHead !== 'string' || runHead.length === 0) {
              core.setFailed('Cannot establish the pull request number and run head from the event payload.');
              return 'false';
            }

            let pull;
            try {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }));
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.setFailed(`Cannot establish the current head for PR #${pullNumber}: ${message}`);
              return 'false';
            }

            const currentHead = pull.head.sha;
            if (typeof currentHead !== 'string' || currentHead.length === 0) {
              core.setFailed(`GitHub returned no current head SHA for PR #${pullNumber}.`);
              return 'false';
            }

            if (currentHead !== runHead) {
              core.notice(
                `PR #${pullNumber} advanced from ${runHead} to ${currentHead}; expensive jobs will not start for the superseded head.`
              );
              return 'false';
            }

            core.notice(`PR #${pullNumber} head ${runHead} remained quiet for 120 seconds; releasing the full test graph.`);
            return 'true';

  static:
    name: Static
    if: always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    # Series C R9b: arm64 runners became available for private repos on
    # 2026-01-29, and cost 37% less per minute than ubuntu-latest (x64).
    # Probe P1 measured this job's full step suite (install, secret scan,
    # script tests, lane-manifest checks, lint, type-check) GENUINELY
    # RUNNING and PASSING on ubuntu-24.04-arm, with wall-clock parity to x64
    # (~3.0m either arch — arm64 is NOT faster, only cheaper per minute).
    # See docs/agents/ci-quality.md / the Series C design doc for the probe
    # results. `.turbo` cache key (setup-workspace/action.yml) already
    # includes `runner.arch`, so this move cannot cross-restore an
    # incompatible cache layer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Static check."
          exit 1

      # Checkout MUST stay here, ahead of the composite: a local `uses: ./...`
      # action is read off the runner's filesystem, so the repo has to be on
      # disk before it can resolve. See setup-workspace/action.yml's header.
      - name: Checkout
        uses: actions/checkout@v6

      # BST-1324: MUST run before `Setup workspace` — the composite ends with
      # `pnpm install --frozen-lockfile`, which is exactly where a textually
      # merged lockfile kills the job (#2483/#2485), so a guard placed after it
      # can never fire on the file it exists to catch. The script is
      # dependency-free by design (runner's system Node, bare checkout, no
      # node_modules); scripts/__tests__/verify-lockfile-catalog-conformance.
      # test.mjs re-runs the same check with full context under
      # `pnpm test:scripts` below, which also covers the install-silent class.
      - name: Lockfile catalog conformance (pre-install)
        run: node scripts/verify-lockfile-catalog-conformance.mjs

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Secret scan
        run: pnpm secrets:scan

      # BST-967: the package-boundary gate. `turbo boundaries` scans build
      # output as well as source and has no way to exclude it, so
      # scripts/turbo-boundaries.mjs runs it and judges only findings in files
      # git does not ignore — anything else (a parse mismatch, a finding with
      # no file, git failing) still fails. This checkout has no dist/ either
      # way; the wrapper is what makes the same gate reproducible locally.
      # Keeping it ahead of dist-producing steps is now about scan cost, not
      # correctness. Sanctioned crossings carry inline `@boundaries-ignore
      # <reason>` comments; the contract tests in
      # scripts/__tests__/turbo-boundaries-gate.test.mjs prove this gate can
      # fail, that generated output cannot mask a source violation, and that
      # every ignore carries a reason.
      - name: Package boundaries
        run: pnpm run boundaries

      # Includes scripts/__tests__/verify-playwright-pin-sync.test.mjs — the
      # single-source guard that the Playwright container image tag pinned in
      # test.yml/web-e2e.yml/performance.yml matches @playwright/test's
      # installed version. `container.image:` cannot consume a workflow
      # expression, so the tag stays a literal in all three files and this
      # guard is the verification (throws on drift, and throws if it can no
      # longer find a pin at all rather than passing vacuously).
      - name: Script tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        env:
          TURBO_CONCURRENCY: 4
        run: pnpm run type-check

  unit-shard:
    name: Unit (${{ matrix.shard }})
    if: always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    # The Unit matrix runs on the same explicit 4-vCPU/16-GB Ubicloud class as
    # the other Linux x64 jobs. GitHub's hosted ARM pool terminated the `rest`
    # shard without a test assertion on five consecutive attempts across two
    # exact PR heads (runs 30158896583 and 30175303301, 2026-07-25). Moving the
    # complete matrix keeps one fixed runner contract — no per-shard selection
    # and no automatic fallback — while preserving every test, filter, and the
    # required `Unit` fan-in below. `.turbo` cache keys include `runner.arch`,
    # so this cannot cross-restore an incompatible ARM cache layer.
    runs-on: ubicloud-standard-4
    # Foundational PRs (e.g. changes to @brainstrike/utils or lint presets)
    # pull in many dependent packages via pnpm's `...[ref]` filter. Keep Unit
    # aligned with Coverage so broad but valid changes do not time out mid-run.
    timeout-minutes: 60
    # SHARDING (2026-07-20, wall-clock audit in
    # docs/test-wall-clock-optimization-2026-07-20.md): on whole-repo-selection
    # PRs the single Unit job was the entire workflow critical path (measured
    # run 29718029263-era worst case 29718226412: Unit 42m, every other job done
    # by ~9m), and `db#test` alone accounted for ~30m of it. HISTORICAL DETAIL,
    # kept because it explains the ~30m figure: at audit time `db#test` was
    # five sequential per-lane Vitest boots. PR #1807 replaced that with one
    # `vitest run --project unit` over a migrate-once PGlite snapshot, so
    # db#test became one invocation whose files parallelize across forks.
    # BST-1046 now splits that one invocation with Vitest's native `--shard`
    # inside this single package; no cross-package sharding or custom file map
    # is involved. RE-MEASURED on the first db-touching PR after
    # that rewrite (run 30681934145), per turbo phase:
    #     turbo `test`             db 6m24s (1 pkg) | heavy 3m54s (3 pkgs) | rest 1m26s (11 pkgs)
    #     turbo `test:integration` db 0 tasks/0.2s  | heavy 3m18s (3 pkgs) | —
    #     job wall-clock           db 439s          | heavy 486s           | rest 327s
    # Read those together, because either row alone misleads. `db#test` IS
    # still the longest single test task by a wide margin (6m24s for ONE
    # package vs 3m54s across three) — that is what earns the dedicated shard.
    # But the db SHARD is no longer the workflow's long pole: heavy's JOB runs
    # longer because it also carries an integration phase db has none of (db
    # keeps its env-sensitive specs inside the unit project under a whole-task
    # `cache: false`, so it has no separate integration lane). Shrinking db
    # therefore buys no workflow wall-clock until heavy shrinks first.
    # TWO TRAPS when re-measuring, both of which produced a wrong answer here
    # before the logs were read:
    #   - job durations alone rank heavy above db and invite the conclusion
    #     that db is no longer the biggest suite. It is; the phases differ.
    #   - a shard whose `...[ref]` filter selects nothing no-ops in seconds and
    #     is INDISTINGUISHABLE from a fast one. Take numbers only from a PR
    #     that actually changes that shard's packages (a #2173-era db shard
    #     reads as 1m purely because the PR touched only packages/agent).
    # The matrix splits the package graph across four runners so the heavy
    # suites stop queuing behind each other:
    #   db-1/db-2 — @brainstrike/db only (whole-task-uncached, two native
    #               Vitest file shards of the same unit project).
    #   heavy — the four biggest remaining suites by measured vitest duration
    #           (desktop, ui, file-explorer-ui, app-shell).
    #   rest  — affected-set minus the five packages above (negation filters).
    # Filter grammar verified via `--dry=json`: `pkg...[ref]` selects pkg only
    # when pkg-or-its-dependency-closure changed in the range (empty selection
    # otherwise → the shard no-ops in seconds), multiple `--filter` flags
    # union, and `!pkg` negations subtract from the selection (a negation-only
    # filter set = everything minus). Shard membership and the two-phase
    # split below must stay consistent — a package must never appear in two
    # shards' positive filters, and every package named in a positive filter
    # here must be listed as a negation in `rest` (and vice-versa: a package
    # negated out of `rest` but given no positive shard would silently stop
    # being tested while the fan-in check still passes). This is not a
    # comment-only invariant: scripts/__tests__/unit-shard-partition.test.mjs
    # parses this matrix and fails `pnpm test:scripts` (the Static job) on any
    # such drift.
    # The required-check name "Unit" is preserved by the `unit` fan-in job
    # below — branch protection keeps pointing at "Unit", not at the shards.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: db-1
            partition: db
            pr_filters: --filter="@brainstrike/db...[origin/$BASE_REF]"
            push_filters: --filter="@brainstrike/db"
            vitest_shard: 1/2
          - shard: db-2
            partition: db
            pr_filters: --filter="@brainstrike/db...[origin/$BASE_REF]"
            push_filters: --filter="@brainstrike/db"
            vitest_shard: 2/2
          - shard: heavy
            partition: heavy
            pr_filters: >-
              --filter="@brainstrike/desktop...[origin/$BASE_REF]"
              --filter="@brainstrike/ui...[origin/$BASE_REF]"
              --filter="@brainstrike/file-explorer-ui...[origin/$BASE_REF]"
              --filter="@brainstrike/app-shell...[origin/$BASE_REF]"
            push_filters: >-
              --filter="@brainstrike/desktop"
              --filter="@brainstrike/ui"
              --filter="@brainstrike/file-explorer-ui"
              --filter="@brainstrike/app-shell"
            vitest_shard: ''
          - shard: rest
            partition: rest
            pr_filters: >-
              --filter="...[origin/$BASE_REF]"
              --filter="!@brainstrike/db"
              --filter="!@brainstrike/desktop"
              --filter="!@brainstrike/ui"
              --filter="!@brainstrike/file-explorer-ui"
              --filter="!@brainstrike/app-shell"
            vitest_shard: ''
            push_filters: >-
              --filter="!@brainstrike/db"
              --filter="!@brainstrike/desktop"
              --filter="!@brainstrike/ui"
              --filter="!@brainstrike/file-explorer-ui"
              --filter="!@brainstrike/app-shell"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Unit check."
          exit 1

      # `fetch-depth: 0` is REQUIRED here: the turbo filter below diffs against
      # `origin/$BASE_REF`, which needs full history. Checkout stays in the
      # caller (not the composite) — see setup-workspace/action.yml's header.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # THE LINUX HALF OF THE FENCE SECURITY SUITES (BST-1071).
      #
      # packages/agent has three suites that run against a REAL OS sandbox:
      # fence-executor (the contract), run-python-tool (end to end) and the
      # escape-resistance red team. On macOS that is Seatbelt, which needs
      # nothing installed. On Linux it is @anthropic-ai/sandbox-runtime's
      # bubblewrap backend, which shells out to three binaries the runner image
      # does not carry — `bwrap`, `socat` (srt's network bridge) and `rg` (its
      # mandatory-deny scan).
      #
      # Without them `SandboxManager.checkDependenciesAsync()` reports errors
      # and all three suites SKIP THEMSELVES — quietly, and GREEN. That is what
      # CI did until this step existed, while `docs/agents/code-execution.md`
      # and `fence-escape-resistance.README.md` both required an srt bump to be
      # re-greened on macOS AND Linux. Only the ungated version-pin assertion
      # ever ran here. `BRAINSTRIKE_FENCE_DEPS_REQUIRED` on the integration
      # steps below is what stops that from silently coming back: with it set,
      # a missing dependency FAILS the lane instead of skipping it.
      #
      # `kernel.apparmor_restrict_unprivileged_userns=0` is load-bearing, not
      # tidying. Measured on this runner class (Ubuntu 24.04.4, kernel
      # 6.14.0-azure, bubblewrap 0.9.0) the binaries install fine and the
      # dependency check goes green, but bubblewrap still cannot build a
      # sandbox:
      #
      #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      #     bwrap: setting up uid map: Permission denied
      #
      # Ubuntu 23.10+ ships that restriction on, and the image carries no
      # AppArmor profile granting bwrap `userns create` (only the generic
      # `unprivileged_userns` and `lxc-usernsexec` profiles). Every fenced run
      # then dies before executing a line, which took the suites from 27 quiet
      # skips to 44 hard failures — a red required lane that proves nothing.
      # Lifting the restriction is Ubuntu's own documented remediation, the
      # runner is an ephemeral VM that already runs this repo's code with
      # passwordless sudo, and it changes only whether bwrap can build its
      # namespace — NOT what the fence then denies inside it, which is the
      # entire subject of these suites.
      #
      # It runs on every shard rather than only the one that currently owns
      # packages/agent: shard membership is a filter list two screens up, and a
      # dependency that silently stops being installed when a package moves
      # shards is the exact failure this step exists to end.
      - name: Install the Linux OS-fence dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fail HERE, with the kernel's own message, rather than 40 assertion
          # failures deep inside a security suite.
          bwrap --ro-bind / / --dev /dev --unshare-all --die-with-parent /bin/echo bwrap-ok
          # The suites need an interpreter to fence, and all three skip
          # themselves without one. The runner image has always carried it;
          # asserting it here means a future image that drops it fails as
          # provisioning rather than as a lane that promised proofs it did not
          # run (BRAINSTRIKE_FENCE_DEPS_REQUIRED would catch it either way, but
          # this names the cause in one line).
          python3 --version

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      # NO standalone build step (B4). Test lanes resolve workspace imports
      # from SOURCE (the B3 #1651 registry + the app vitest alias maps), so
      # tests no longer need `dist` to exist, and `test.dependsOn` is the
      # no-build `topo` transit node instead of `^build` (turbo.jsonc). The few
      # lanes that genuinely consume built artifacts (packages/utils' own-dist
      # test, packages/db's nested-tsc test) declare exact `#build` edges in
      # their own turbo.json, and `turbo run test` SELF-BUILDS exactly those
      # (verified: the whole-repo test+test:integration graph contains 3 build
      # tasks — utils + its dep closure — and a full clean-state no-dist run is
      # green; see the B4 PR). The predecessor step's #1066/#1207 rationale
      # ("exports maps pointing at dist fail to resolve at test time") is
      # retired by source resolution, and unlike that incident a regression
      # here fails LOUDLY on the always-clean CI runner instead of passing
      # against stale dist. The Build job below still exercises the full build.

      # PR-affected unit tests routed THROUGH turbo so the remote cache
      # (TURBO_TOKEN/TURBO_TEAM, set at the workflow `env:` block above and
      # inherited by this step) covers test execution — the only expensive,
      # previously-uncached CI step.
      #
      # `--filter="...[origin/$BASE_REF]"` is turbo's EXPLICIT git-range filter:
      # `...[ref]` = packages changed since `ref` + their dependents. It is
      # deliberately NOT `--affected`: turbo's `--affected` derives its own
      # base/head and over-selects on merge commits, the exact reason the prior
      # pnpm-filter approach spelled the range out. Turbo's task graph skips
      # packages with no `test` script (no `--if-present` needed) and never runs
      # the workspace-root task under a plain `turbo run` (so the old pnpm-only
      # `!./` root exclusion is unnecessary — verified via `--dry=json`).
      #
      # SELECTION vs the retired `pnpm --filter "...[ref]"`: measured across four
      # real historical ranges (HEAD~1, origin/main~10/~20/~30 — see the PR body
      # for the exact package lists), turbo's selection is a strict SUPERSET of
      # pnpm's. It NEVER under-selects — every package the old pnpm path would
      # have tested is always selected, so a changed package can never be
      # silently skipped/under-tested. On ranges whose diff touches root/global
      # files (lockfile, pnpm-workspace.yaml) turbo may additionally pull in a
      # few leaf config packages pnpm did not; that is safe over-selection
      # (marginal CI time, usually a cache hit — never missed coverage).
      #
      # TURBO_TEST_MODE=unit and TEST_TIMEOUT_MULTIPLIER=2 are set EXPLICITLY
      # here so the `test` task cache key (both are in turbo.jsonc `test.env`)
      # matches the push path below AND the local `pnpm test` / `pnpm check`
      # scripts. The dedicated multiplier gives local tests CI's timeout policy
      # without setting CI and changing unrelated workload (BST-1050).
      # --concurrency=4 preserves the prior `--workspace-concurrency=4` cap.
      #
      # PHASE SPLIT (two sequential turbo invocations, one named step each).
      # `test` and `test:integration` previously ran in a SINGLE
      # `turbo run test test:integration --concurrency=4`. On whole-repo-
      # selection PRs (any global-file edit) that starved the runner: once the
      # cacheable `test` lanes fill from cache, all 4 turbo slots end up occupied
      # exclusively by the heavy UNCACHED lanes — the `test:integration` suites
      # (embeddings, agent, app-shell, desktop, web, file-import) plus the
      # whole-task-uncached `db#test` — i.e. 4 concurrent real-PGlite/wall-clock
      # suites on a small hosted runner (PR #1650 run 29294546967: job-timeout,
      # then lost-runner, then a 4-lane turbo cancellation cascade). The lanes
      # are individually sound (local `--concurrency=1` = 128/128 green); this is
      # the documented PGlite-under-CI-load flake class manifesting through lane
      # CONCURRENCY, so the fix is at source in CI.
      #
      # Phase 1 runs the cacheable `test` lanes (+ the whole-task-uncached
      # db/secure-fs-native `test` lanes, mostly light or singular) at
      # --concurrency=4. Phase 2 runs ONLY the uncached env-sensitive
      # `test:integration` lanes (root turbo.jsonc, `cache: false`) capped at
      # --concurrency=2 so at most two real-subsystem suites run at once. Two
      # named steps (not one `&&` step) give clearer failure attribution in the
      # UI; turbo re-resolves quickly on the second invocation. turbo.jsonc's
      # `test:integration` has `dependsOn: ["topo"]` (the B4 no-build transit
      # node), so phase 2's graph builds nothing and is cheap. turbo skips each
      # task for packages that do not define it (no `--if-present` needed).
      # COVERAGE="false" (2026-07-20): the PR path previously omitted this,
      # and per-package vitest configs enable V8 coverage whenever CI==='true'
      # unless COVERAGE overrides it — so every PR unit run silently paid
      # coverage-instrumentation overhead whose output nothing consumed (the
      # push path already set it; coverage.yml/nightly-coverage.yml own real
      # coverage). turbo.jsonc keeps COVERAGE in `passThroughEnv` (out of the
      # cache key), so PR and push runs still share cache entries — and now
      # also genuinely run the same uninstrumented workload.
      - name: Pull request affected unit tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          COVERAGE: "false"
          DB_TEST_SHARD: ${{ matrix.vitest_shard }}
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test ${{ matrix.pr_filters }} --concurrency=4

      - name: Pull request affected integration tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          # This lane installed bubblewrap/socat/ripgrep above, so the
          # real-fence suites must RUN here. Set, a missing dependency is a
          # lane defect that fails collection instead of a host quirk the
          # suites skip over; see packages/agent/src/__tests__/fixtures/
          # fence-host-gate.ts. Deliberately NOT set in the coverage lanes,
          # which install nothing and keep the loud-skip behaviour.
          BRAINSTRIKE_FENCE_DEPS_REQUIRED: "1"
          COVERAGE: "false"
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test:integration ${{ matrix.pr_filters }} --concurrency=2

      # Push (main) + workflow_dispatch: full non-affected suite routed through
      # turbo so the remote cache (TURBO_TOKEN/TURBO_TEAM inherited from the
      # workflow `env:` block) covers these runs too, and so push and PR runs
      # share cache entries. TURBO_TEST_MODE=unit (below) keeps the `test` task
      # cache key identical to the PR path and the local `pnpm test` script.
      # Same PHASE SPLIT as the PR path: phase 1 runs the cacheable `test` lanes
      # at --concurrency=4 (matches the PR path and the root `pnpm test`
      # script), phase 2 runs the uncached env-sensitive `test:integration`
      # lanes capped at --concurrency=2 so at most two real-subsystem suites run
      # at once. See the PR-path comment above for the starvation rationale.
      #
      # @brainstrike/embeddings is NO LONGER excluded (Series A4, #1629): its
      # env-sensitive files now carry the `*.integration.test.*` suffix and run
      # in the uncached `test:integration` lane, so its pure `test` lane is
      # cacheable and is finally CI-covered on push. The manual model-download
      # tier stays out of CI by FILENAME (`*.models.test.*`, selected only by
      # `test:models` via vitest.models.config.mts) — not by this package
      # filter — so dropping the filter cannot pull model downloads into CI.
      - name: Push and manual unit tests
        if: github.event_name != 'pull_request'
        env:
          COVERAGE: "false"
          DB_TEST_SHARD: ${{ matrix.vitest_shard }}
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test ${{ matrix.push_filters }} --concurrency=4

      - name: Push and manual integration tests
        if: github.event_name != 'pull_request'
        env:
          # See the pull-request integration step above.
          BRAINSTRIKE_FENCE_DEPS_REQUIRED: "1"
          COVERAGE: "false"
          TEST_TIMEOUT_MULTIPLIER: "2"
          TURBO_TEST_MODE: unit
        run: pnpm turbo run test:integration ${{ matrix.push_filters }} --concurrency=2

  # Fan-in job preserving the required-check name "Unit": branch protection
  # points at this single check, not at the per-shard matrix jobs, so shard
  # membership can change without touching repo settings.
  #
  # It carries the SAME quiet-head admission gate as `unit-shard` (and every
  # other job): when the head is not admitted, both the shards and this fan-in
  # skip together, so the required "Unit" check is neutral (not a red failure)
  # exactly as it was when Unit was a single job. When the job DOES run
  # (admitted, or admission itself failed), `needs.unit-shard.result` is a
  # definitive success/failure — anything but `success` fails this job loudly
  # instead of greying out the merge box (an admission failure propagates here
  # because `unit-shard`'s own "Require successful admission" step fails it).
  unit:
    name: Unit
    if: always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission, unit-shard]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Unit check."
          exit 1

      - name: Check shard results
        env:
          SHARD_RESULT: ${{ needs.unit-shard.result }}
        run: |
          echo "unit-shard result: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            exit 1
          fi

  # The `coverage` job MOVED to .github/workflows/coverage.yml. It needs a
  # `coverage`-label trigger, which would mean subscribing THIS workflow to
  # the `pull_request` `labeled` action — and this workflow is the sole
  # producer of every required status check, so every label add would then
  # report those checks as `skipped` and grey out the merge box (measured on
  # PR #1664). See the header comment in coverage.yml for the full rationale.
  # Coverage is advisory; nightly-coverage.yml remains the threshold gate.
  # This is enforced, not just asserted: the ruleset requires only Static, Unit,
  # Build, Web E2E and Desktop E2E, so Codecov statuses cannot block a merge, and
  # codecov.yml marks them `informational` to stop them rendering a misleading
  # red X. scripts/verify-codecov-status-contract.mjs guards that pairing; see
  # docs/agents/ci-quality.md § "Codecov statuses are non-gating".

  build:
    name: Build
    if: always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Build check."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Build
        # Invoked as `pnpm turbo` DIRECTLY rather than through the root
        # `pnpm run build` script, and that is load-bearing for any flag added
        # here: `pnpm run build -- <flags>` preserves the `--`, so turbo reads
        # them as PASS-THROUGH args and appends them to every package's own
        # build script, where pnpm tacks them onto the last command of the `&&`
        # chain. Measured on the first run of BST-1005: `tsup ...
        # --continue=dependencies-successful` and a node-gyp build both died
        # that way. The Unit shards already call `pnpm turbo run test` directly
        # for the same reason. Mirrors the root script's own turbo flags.
        #
        # `--continue=dependencies-successful` reports every independent
        # failure in one run instead of cancelling siblings at the first error
        # — the point of a build gate is to show all of what is broken.
        #
        # NOT affected-filtered (BST-1005, measured): both E2E smoke jobs run
        # on EVERY PR (AGENTS.md CI contract, and audit-bolt-readiness.mjs
        # counts a skipped required check as not-ready), so this job must
        # always produce the web and desktop bundles they consume. Those two
        # apps' dependency closure is 46 of 47 workspace packages, so a
        # `...[origin/$BASE_REF]` filter here can skip at most ONE package
        # (@brainstrike/tsconfig) while turbo's cache already replays the rest.
        env:
          TAILWIND_DEBUG: '1'
        run: pnpm turbo run build --summarize --log-order=grouped --continue=dependencies-successful

      - name: Validate CSS bundle
        run: |
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          fi

          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          fi

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            apps/desktop/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  native-windows:
    name: Native Windows
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No turbo-cache: this job doesn't route through turbo. `shell: bash` in
      # the composite's install step works on windows-latest via the runner's
      # bundled Git Bash, same as every other step in this composite already
      # running fine cross-platform.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Explicit build first: the package's `test` script deliberately does NOT
      # build inline anymore (an inline `pnpm build &&` raced turbo's own
      # `build` task — two concurrent node-gyp rebuilds in one directory; see
      # packages/secure-fs-native/turbo.json). Under turbo the dependsOn edge
      # supplies the addon; this job bypasses turbo, so it builds explicitly.
      - name: Build and test secure filesystem capability
        run: |
          pnpm --filter @brainstrike/secure-fs-native build
          pnpm --filter @brainstrike/secure-fs-native test

      - name: Build and test Agent DevTools process ownership
        run: |
          pnpm --filter @brainstrike/windows-job-native build
          pnpm --filter @brainstrike/windows-job-native test

  native-electron:
    name: Native Electron Package
    if: needs.admission.outputs.admitted == 'true'
    needs: [admission]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --concurrency=4

      - name: Load the native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:electron

      - name: Package the desktop application
        run: pnpm --filter @brainstrike/desktop run pack

      - name: Load the packaged native capability in Electron
        run: pnpm --filter @brainstrike/secure-fs-native test:packaged

      - name: Load the packaged @parcel/watcher binding in Electron (BST-568)
        run: pnpm --filter @brainstrike/file-system test:packaged

  browser-tests:
    name: Browser tests
    # Vitest 4 browser-mode suites (real Chromium): packages/db PGlite WASM
    # semantics (BST-64/BST-994 — unskipped after eight months), packages/ui,
    # packages/assistant-ui assistant browser suites, packages/storage web adapter. Before this job
    # existed, `test:browser` ran NOWHERE in CI — only in the local `pnpm
    # check` gate — while turbo.jsonc's task comment claimed otherwise.
    # Not (yet) a required check: branch protection is Sean's call; this lane
    # must first prove itself deterministic.
    if: always() && (needs.admission.result != 'success' || needs.admission.outputs.admitted == 'true')
    needs: [admission]
    # GitHub-hosted on purpose: the Ubicloud pool is contractually limited to
    # the five measured jobs (scripts/__tests__/ubicloud-runner-contract.
    # test.mjs) and a new unproven lane should not expand the paid-runner
    # contract. Move only with a wall-clock measurement and a contract update.
    runs-on: ubuntu-latest
    # Same official Playwright image + pin as Web E2E — browsers baked in, no
    # cdn.playwright.dev download at job time. KEEP IN SYNC: the image tag MUST
    # equal @playwright/test's version (scripts/verify-playwright-pin-sync.mjs
    # is the drift check; bump together with the pins in test.yml/web-e2e.yml/
    # performance.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Three Chromium-driving suites on a 4-core hosted runner: cap turbo the
      # same way the static job does, so the in-job builds and the browser
      # suites don't oversubscribe the runner.
      TURBO_CONCURRENCY: "4"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to run Browser tests on an unadmitted head."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # `test:browser` dependsOn build, so the pure-TS db/ui/assistant-ui/storage closure
      # builds in-job. The remote Turbo cache carries most of it; this local
      # .turbo layer is the same outage hedge the setup-workspace composite
      # provides (same key scheme — the composite itself can't be used here
      # because its fixed full `pnpm install` would hit node-gyp in this
      # toolchain-less container).
      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Install dependencies
        # Same exclusions as Web E2E: this pwuser container has no C toolchain
        # or sudo; the browser-test packages (db, ui, assistant-ui, storage) and their
        # dependency closures are pure TS, so the two desktop-only native
        # projects are excluded from install.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Run browser tests
        # Explicit --filter per browser-test package: an UNFILTERED root
        # `pnpm test:browser` puts all 47 workspace packages in turbo scope and
        # builds both desktop native addons, which this toolchain-less pwuser
        # container cannot compile (proven by this lane's first run). The
        # filtered scope is the four packages + their pure-TS closure.
        # KEEP IN SYNC with packages defining a test:browser script —
        # scripts/__tests__/browser-lane-filter-contract.test.mjs fails
        # `pnpm test:scripts` (Static job) if a package gains test:browser
        # without being added here.
        run: pnpm test:browser --filter=@brainstrike/assistant-ui --filter=@brainstrike/db --filter=@brainstrike/storage --filter=@brainstrike/ui

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            packages/db/test-results/
            packages/assistant-ui/test-results/
            packages/ui/test-results/
            packages/storage/test-results/
            packages/db/**/__screenshots__/
            packages/assistant-ui/**/__screenshots__/
            packages/ui/**/__screenshots__/
            packages/storage/**/__screenshots__/
          retention-days: 1
          if-no-files-found: ignore

  web-e2e:
    name: Web E2E
    if: >-
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build]
    runs-on: ubicloud-standard-4
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. This removes the CDN
    # browser download that was stalling at 100% and hanging the job to its
    # timeout. KEEP IN SYNC: the image tag MUST equal @playwright/test's
    # version; the same pin is hard-coded in .github/workflows/{test.yml,
    # web-e2e.yml,performance.yml} — bump all three together on a Playwright
    # upgrade. `container.image:` cannot consume a workflow expression, so this
    # stays a literal; scripts/verify-playwright-pin-sync.mjs (run via
    # `pnpm test:scripts` in the Static job) is the automated drift check.
    #
    # NOT folded into the setup-workspace composite (Series C R9a): this
    # container has no C toolchain/sudo, so the install below excludes both
    # native-build projects — a different `pnpm install` invocation than the
    # composite's fixed `pnpm install --frozen-lockfile`. Parameterizing the
    # composite's install command for this one caller is the documented trap;
    # this job's setup stays bespoke literal YAML on purpose.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # `--user 1001` (pwuser) is the configuration shown in Playwright's
      # official GitHub Actions container example. The browsers under
      # /ms-playwright are owned by this user; it is the documented, tested path.
      options: --user 1001
    timeout-minutes: 25
    env:
      NODE_ENV: production
      PORT: "8080"
      BASE_URL: http://127.0.0.1:8080
      # Browsers are preinstalled here in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Web E2E check."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        # Exclude both desktop-only native projects: this pwuser container has no
        # C toolchain or sudo, and web E2E loads neither node-pty nor secure-fs.
        # Keeps root + web + every shared package (42/44 projects). Do NOT revert
        # to a bare full install; node-gyp will fail before Playwright starts.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop' --filter '!@brainstrike/secure-fs-native'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Run web smoke
        run: pnpm --filter @brainstrike/web run test:e2e:lane:smoke

      - name: Run product site browser suite
        run: xvfb-run -a pnpm --filter @brainstrike/site run test:e2e

      - name: Upload web smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-main-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload product site browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: product-site-test-results
          path: |
            apps/site/test-results/
            apps/site/playwright-report/
          retention-days: 1
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop E2E
    if: >-
      always() &&
      (
        needs.admission.result != 'success' ||
        (
          github.event_name != 'workflow_dispatch' &&
          needs.admission.outputs.admitted == 'true' &&
          needs.build.result == 'success'
        )
      )
    needs: [admission, build]
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Require successful admission
        if: needs.admission.result != 'success'
        run: |
          echo "::error::Quiet-head admission failed; refusing to skip the required Desktop E2E check."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — it does NOT use a `playwright install chromium` browser. So we
      # only need the Chromium system libraries (apt), not the browser binary
      # download from cdn.playwright.dev (which was stalling and hanging the
      # job). `install-deps` is apt-only and does not touch the browser CDN.
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # The desktop smoke launches the REAL Electron binary via
      # `_electron.launch`. Electron 43 exposes install.js only as a bin and has
      # no install lifecycle, so pnpm cannot provision the binary. Download the
      # prebuilt zip from GitHub Releases immediately before smoke so no later
      # step can disturb the executable, then hard-verify it exists.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session provides an ephemeral D-Bus session so Chromium
      # inside Electron doesn't spew `[ERROR:dbus/bus.cc:405] Failed to
      # connect to the bus` for every spawned process. Tests pass without
      # this (Electron handles the missing bus gracefully), but suppressing
      # the noise keeps the smoke log readable.
      # dbus-run-session is provided by the `dbus` package, pre-installed
      # on the ubuntu-latest runner.
      - name: Run desktop smoke
        working-directory: apps/desktop
        run: dbus-run-session -- pnpm run test:e2e:lane:smoke

      - name: Upload desktop smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-main-test-results
          path: apps/desktop/test-results/
          retention-days: 1
          if-no-files-found: ignore

  # BST-1301: make a red `main` announce itself.
  #
  # THE GATE ALREADY EXISTS. This workflow's `on:` block subscribes to
  # `push: branches: [main]`, so Static/Unit/Build run against every merged
  # commit, and they fired correctly on all three red-`main` pushes of
  # 2026-08-15 (runs 31872259629, 31872457744, 31894054632 — each one
  # `Static` › `Lint`). What did not exist was anyone being TOLD: the red run
  # sat in the Actions tab, and both incidents were discovered hours later
  # only when an unrelated PR tripped over the breakage. This job adds the
  # missing announcement; it adds NO new check and NO new trigger.
  #
  # The mechanism it exists to catch is toolchain drift. A PR's CI judges it
  # under the linter/formatter on ITS BASE at the time that run happened. When
  # a toolchain bump lands in between (#2447 took biome 2.5.2 -> 2.5.8), the
  # already-green verdict on a stale-based PR goes quietly out of date, and
  # nothing re-checks a merged PR against the post-merge toolchain. The
  # failure therefore materializes for the first time ON `main`, where it
  # blocks every branch and looks unrelated to whoever hits it next. Both
  # 08-15 incidents were exactly this: #2437's `noUnsafeOptionalChaining`
  # violation in app-shell's workspace-snapshot-io.test.ts (the rule narrowed
  # in 2.5.8) and #2440's formatter drift in file-system's
  # path-validation.test.ts (fixed by #2452).
  #
  # SCOPE — the REQUIRED-CHECK line, minus the two flaky lanes. The ruleset
  # requires exactly Static, Unit, Build, Web E2E and Desktop E2E, so those
  # five are the only checks that can block every branch, which is the
  # everyone-trips-over-it breakage class this job targets. `web-e2e` and
  # `desktop-e2e` are then excluded on a second, separate ground: they are the
  # documented flaky-headless class (AGENTS.md), and a canary that cries wolf
  # gets ignored, which is precisely the failure this job exists to prevent.
  # Persistent E2E breakage is still caught within 24h by the scheduled
  # notifiers in web-e2e.yml / desktop-e2e.yml.
  #
  # `browser-tests`, `native-windows` and `native-electron` also run on pushes
  # to `main` and are also NOT notified — not on flakiness grounds, but because
  # none of them is a required check. A red one of those does not block anyone
  # else's branch, so it is not this job's class of problem. (`browser-tests`
  # additionally "must first prove itself deterministic" per its own header
  # before it could ever be a candidate.)
  #
  # WHY `!cancelled()` AND NOT `always()` — this is load-bearing, do not
  # "simplify" it back. `== 'failure'` alone does NOT mean "the code failed",
  # because neither `static`/`build`'s admission gate nor `unit` is a leaf
  # verdict:
  #   * every gated job opens with a "Require successful admission" step that
  #     `exit 1`s whenever `needs.admission.result != 'success'`, and
  #   * `unit` is a fan-in whose check is `[ "$SHARD_RESULT" != "success" ] &&
  #     exit 1` — the very `!= 'success'` shape this condition avoids.
  # Both therefore LAUNDER a cancelled upstream into a `failure` result. This
  # is observed, not theoretical: in runs 31903009051, 31900478128 and
  # 31900226011 (all 2026-08-15) a cancel landed while `admission` was in its
  # 120-second sleep, `always()` still dispatched the downstream jobs, and
  # Static, Unit AND Build all reported `failure` on a run that tested nothing.
  # Under `always()` this job would have filed "main is red: Static, Unit,
  # Build failed" for a cancellation. `!cancelled()` is the discriminator:
  # it still runs when a need FAILED (that is the whole point), but never when
  # the run was cancelled. Those three runs were `pull_request` events that the
  # push guard would also have caught; the mechanism is not PR-specific, and
  # relying on the push guard for it would be an accident, not a design.
  #
  # Residual, accepted and deliberately NOT suppressed: if `admission` ever
  # genuinely FAILS on a push (never observed), all three gated jobs report
  # `failure` and this job files an issue whose body blames the code. That is
  # loud rather than silent, "Static, Unit and Build all failed at once" is
  # itself the tell, and the linked run shows the real cause immediately.
  # Adding an `admission` success gate here would trade a rare wrong-hypothesis
  # issue for a silent `main` with no verdict at all — the wrong direction.
  #
  # NOT a required status check and NOT a new trigger. See coverage.yml's
  # header for why adding a trigger to this file is a footgun — this job adds
  # only a `needs:` fan-in, so PR runs skip it and the required set is
  # untouched. Detection, not prevention: requiring branches to be up to date
  # before merge is the complementary fix and is a branch-protection setting,
  # i.e. the repo owner's call, not this workflow's.
  notify-main-failure:
    name: Notify main failure
    needs: [static, unit, build]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      (needs.static.result == 'failure' ||
       needs.unit.result == 'failure' ||
       needs.build.result == 'failure')
    runs-on: ubuntu-latest
    # gh issue create / comment are sub-second under normal conditions; cap at
    # 5 min so a GitHub API hang can't burn the GHA default 6-hour wall clock.
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # NO `2>/dev/null || true` HERE, unlike the four sibling notifiers.
          # That idiom swallows the expected "label already exists" AND a real
          # failure (token not elevated, API 5xx, org label restrictions)
          # indistinguishably. The label does not exist until the first red
          # `main`, so a swallowed failure on that very first run means the
          # next step's `gh issue create --label` hard-fails (gh does not
          # create missing labels), `set -euo pipefail` aborts, this job goes
          # red and NOTHING IS FILED — reproducing one level up the exact "red
          # run sits unseen in the Actions tab" outcome the job exists to
          # remove. AGENTS.md: no silent fallbacks.
          #
          # `--force` removes the need to suppress anything: it PATCHes the
          # label when it already exists instead of erroring, so a non-zero
          # exit now means only a genuine failure and is allowed to be fatal,
          # loudly and at the step that caused it.
          if ! gh label create "main-broken" \
            --repo "$REPO" \
            --force \
            --color b60205 \
            --description "Auto-opened by test.yml when a push to main fails Static, Unit or Build"; then
            echo "::error::Could not ensure the 'main-broken' label exists, so the tracking issue can be neither filed nor de-duplicated. main IS RED — see the run this job belongs to."
            exit 1
          fi

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          # Name the failed checks explicitly. A bare "main is red" makes the
          # reader open the run to learn anything at all, which is most of the
          # friction this job removes.
          failed=""
          for entry in "Static:$STATIC_RESULT" "Unit:$UNIT_RESULT" "Build:$BUILD_RESULT"; do
            if [ "${entry#*:}" = "failure" ]; then
              failed="${failed}${failed:+, }${entry%%:*}"
            fi
          done

          body="\`main\` is red: **${failed}** failed on ${COMMIT_URL}.

          Run: ${RUN_URL}

          Every branch cut from or rebased onto \`main\` inherits this, and the PR
          that trips over it next will see a failure unrelated to its own change.

          If the failing step is Lint or Type check, suspect toolchain drift
          (BST-1301): a PR that went green under an older linter/formatter on its
          base can break \`main\` when a toolchain bump merges in between. Check
          whether a lint/format/toolchain PR landed between the offending PR's
          last green run and its merge.

          This issue tracks THIS incident only. It gets a new comment on each
          subsequent failing push, and \`notify-main-recovery\` closes it
          automatically on the next push where Static, Unit and Build are all
          green — so the next incident opens a fresh issue with its own title
          and date instead of being appended to this one."

          existing=$(gh issue list --repo "$REPO" \
            --label "main-broken" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" \
              --title "main is red: ${failed} failed ($(date -u +%Y-%m-%d))" \
              --label "main-broken" \
              --body "$body"
          fi

  # BST-1301, second half: close the loop the label-keyed de-duplication opens.
  #
  # `notify-main-failure` above keys de-duplication on an open `main-broken`
  # issue, which is the same shape the nightly notifiers use — but the
  # LIFECYCLES DIFFER, and copying the shape without this job would turn the
  # canary into a stale-issue trap. For `web-e2e`/`nightly-coverage` the
  # failure recurs on a 24-hour cadence, so the de-duplication window and the
  # incident window are roughly the same thing. A red `main` is the opposite:
  # the incident is typically over within the hour (force-fix or revert) while
  # the issue stays open until a human remembers to close it. Without an
  # automatic close, incident #2 three weeks later would NOT open an issue —
  # it would append a comment to a stale issue still titled with incident #1's
  # failing check and date. It would never surface in triage, and anyone who
  # unsubscribed from the first incident would hear nothing at all. That is the
  # canary getting muted: the exact failure the header above argues against for
  # the E2E lanes.
  #
  # So: green `main` closes the issue, and the de-duplication window becomes
  # the incident window. Push runs on `main` share the concurrency group
  # `Test-refs/heads/main` with `cancel-in-progress: false`, so they are
  # serialized and this cannot race the notifier above.
  #
  # `!cancelled()` here is belt-and-braces rather than load-bearing (the three
  # `== 'success'` clauses already cannot hold on a cancelled run), but it
  # keeps both halves reading the same way. Closing is idempotent: with no open
  # `main-broken` issue — the overwhelmingly common case, since `main` is
  # usually green — this job makes one read-only API call and exits.
  notify-main-recovery:
    name: Notify main recovery
    needs: [static, unit, build]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.static.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close the tracking issue once main is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail

          # Deliberately NOT `.[0]`: the notifier keeps at most one open issue,
          # so a second one means the invariant already broke somewhere. `main`
          # is green, therefore nothing carrying this label is still true, and
          # closing every one of them makes the invariant self-healing instead
          # of leaving a decoy behind. `gh issue list` on a label that does not
          # exist yet returns an empty list with exit 0 (verified against this
          # repo with gh 2.97.0), so no label bootstrapping is needed here.
          open_issues=$(gh issue list --repo "$REPO" \
            --label "main-broken" --state open \
            --json number --jq '.[].number')

          if [ -z "$open_issues" ]; then
            echo "No open main-broken issue; main was already green."
            exit 0
          fi

          for number in $open_issues; do
            echo "Closing #${number}: main is green again."
            gh issue close "$number" --repo "$REPO" --reason completed \
              --comment "\`main\` is green again — Static, Unit and Build all passed on ${COMMIT_URL}.

          Run: ${RUN_URL}

          Closed automatically by \`notify-main-recovery\`. The next red push to \`main\` opens a NEW issue with its own title and date rather than commenting here, so this one stays a record of a single incident."
          done
