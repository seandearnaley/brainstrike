name: Test

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Script tests
        run: pnpm test:scripts

      - name: Check DB test + coverage lane assignments
        # Both the unit `test-lanes` and the nightly `coverage-lanes` registries
        # error on any unassigned `packages/db/__tests__/*.test.ts`. The unit one
        # is validated implicitly when the Unit job runs `test`, but the coverage
        # one was only validated in the nightly job — so a new test could pass every
        # PR check and silently break Nightly Coverage. Validate BOTH here (fast,
        # ~1s) so drift is caught on the PR, not at 2am.
        run: |
          pnpm --filter @brainstrike/db test:db:check-lanes
          pnpm --filter @brainstrike/db test:coverage:db:check-lanes

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run type-check

  unit-pr-db:
    name: Unit DB ${{ matrix.db-lane }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # PR Unit normally runs directly changed testable packages only. A small
    # allowlist of foundational packages still expands to dependents because
    # their runtime regressions often surface outside the changed package's own
    # tests. DB repository/test-lane-only edits stay on the dedicated DB lanes
    # below; public DB runtime/schema changes still expand to dependents. Static,
    # Type check, and Build continue covering downstream compile/bundle failures,
    # and push/manual runs still execute the full unit suite.
    # The aggregate `unit` job below preserves the required `Unit` check.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db-lane: [repository, schema-migration, remaining]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Plan affected DB unit shard
        id: unit-plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode db \
            --db-lane "${{ matrix.db-lane }}" \
            --dry-run \
            --github-output "$GITHUB_OUTPUT"

      - name: Cache Turbo artifacts
        if: steps.unit-plan.outputs.has_work == 'true'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        if: steps.unit-plan.outputs.has_work == 'true'
        run: pnpm install --frozen-lockfile

      # Build workspace deps first, for BOTH test paths below. The previous
      # `turbo run test --affected` got its build dependency via turbo.jsonc's
      # `dependsOn: ["^build"]`, but pnpm's filter doesn't traverse that graph
      # — workspace deps with exports maps pointing at `dist/` would otherwise
      # fail to resolve at test time.
      # The PR shard pre-plan gates this step when there is no unit work. Push
      # and manual runs keep their full-suite build in the aggregate Unit job.
      - name: Build workspace dependencies
        if: steps.unit-plan.outputs.has_work == 'true'
        run: pnpm turbo run build ${{ steps.unit-plan.outputs.build_filters }} --concurrency=4

      # PR-changed unit tests via pnpm's documented filter syntax.
      # https://pnpm.io/filtering — pattern: `pnpm --filter "[origin/master]" test`
      #
      # `[ref]` = directly changed packages. The helper may intentionally
      # re-expand to `...[ref]` for foundational package changes. `!./` excludes the root workspace
      # (which would otherwise run its root-level `test` script that
      # delegates back to turbo over every workspace, defeating the scoping).
      # DB lanes run only when @brainstrike/db is in the selected set;
      # otherwise they exit green.
      - name: Pull request affected unit tests
        if: steps.unit-plan.outputs.has_work == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode db \
            --db-lane "${{ matrix.db-lane }}"

  unit-pr-packages:
    name: Unit packages ${{ matrix.lane }}/4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Runs the non-DB portion of the directly changed unit-test set.
    # @brainstrike/db is intentionally excluded here because the job above
    # splits its existing DB test lanes directly.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Plan affected package unit shard
        id: unit-plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode packages \
            --lane "${{ matrix.lane }}" \
            --total-lanes 4 \
            --dry-run \
            --github-output "$GITHUB_OUTPUT"

      - name: Cache Turbo artifacts
        if: steps.unit-plan.outputs.has_work == 'true'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        if: steps.unit-plan.outputs.has_work == 'true'
        run: pnpm install --frozen-lockfile

      # See the DB shard job above for the build-dependency rationale.
      - name: Build workspace dependencies
        if: steps.unit-plan.outputs.has_work == 'true'
        run: pnpm turbo run build ${{ steps.unit-plan.outputs.build_filters }} --concurrency=4

      - name: Pull request affected unit tests
        if: steps.unit-plan.outputs.has_work == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode packages \
            --lane "${{ matrix.lane }}" \
            --total-lanes 4 \
            --workspace-concurrency 2

  unit:
    name: Unit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-pr-db, unit-pr-packages]
    steps:
      - name: Check affected unit shards
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ needs.unit-pr-db.result }}" != "success" ]; then
            echo "One or more affected DB unit shards failed or were cancelled."
            exit 1
          fi
          if [ "${{ needs.unit-pr-packages.result }}" != "success" ]; then
            echo "One or more affected unit shards failed or were cancelled."
            exit 1
          fi

      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        if: github.event_name != 'pull_request'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile

      # Push/manual still runs the full unit suite, so workspace deps must be
      # built before tests.
      - name: Build workspace dependencies
        if: github.event_name != 'pull_request'
        run: pnpm turbo run build --concurrency=4

      - name: Push and manual unit tests
        if: github.event_name != 'pull_request'
        env:
          COVERAGE: "false"
          TURBO_TEST_MODE: unit
        run: pnpm run test:fast

  coverage-pr-db:
    name: Coverage DB ${{ matrix.db-coverage-lane }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db-coverage-lane:
          [architecture, chunking, migrations, queue, repositories, search, runtime]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Plan affected DB coverage shard
        id: coverage-plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode coverage-db \
            --db-coverage-lane "${{ matrix.db-coverage-lane }}" \
            --dry-run \
            --github-output "$GITHUB_OUTPUT"

      - name: Cache Turbo artifacts
        if: steps.coverage-plan.outputs.has_work == 'true'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: pnpm install --frozen-lockfile

      - name: Clear coverage directories
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      # See the Unit job for the rationale. Coverage instrumentation runs
      # tests so it has the same build-dependency requirement.
      - name: Build workspace dependencies
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: pnpm turbo run build ${{ steps.coverage-plan.outputs.build_filters }} --concurrency=4

      - name: Run affected DB coverage shard
        if: steps.coverage-plan.outputs.has_work == 'true'
        env:
          COVERAGE: "true"
          NODE_ENV: test
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode coverage-db \
            --db-coverage-lane "${{ matrix.db-coverage-lane }}"

      - name: Stage coverage shard
        run: |
          mkdir -p coverage-shard
          printf '%s\n' "${{ matrix.db-coverage-lane }}" > "coverage-shard/marker-db-${{ matrix.db-coverage-lane }}"
          if [ "${{ steps.coverage-plan.outputs.has_work }}" = "true" ]; then
            find packages/db -type f -path "*/coverage-db-*/coverage-final.json" -exec cp --parents {} coverage-shard/ \;
            if ! find coverage-shard -type f -name "coverage-final.json" | grep -q .; then
              echo "::error::DB coverage shard produced no coverage-final.json files."
              exit 1
            fi
          else
            echo "No directly affected DB package for this coverage shard."
          fi

      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-db-${{ matrix.db-coverage-lane }}
          path: coverage-shard/
          retention-days: 1
          if-no-files-found: error

  coverage-pr-packages:
    name: Coverage packages ${{ matrix.lane }}/4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Plan affected package coverage shard
        id: coverage-plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode coverage-packages \
            --lane "${{ matrix.lane }}" \
            --total-lanes 4 \
            --dry-run \
            --github-output "$GITHUB_OUTPUT"

      - name: Cache Turbo artifacts
        if: steps.coverage-plan.outputs.has_work == 'true'
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: pnpm install --frozen-lockfile

      - name: Clear coverage directories
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      # See the Unit job for the rationale. Coverage instrumentation runs
      # tests so it has the same build-dependency requirement.
      - name: Build workspace dependencies
        if: steps.coverage-plan.outputs.has_work == 'true'
        run: pnpm turbo run build ${{ steps.coverage-plan.outputs.build_filters }} --concurrency=4

      # `[ref]` (no dots) = directly-changed packages only. Codecov's patch
      # gate is on changed lines, which only live in directly-changed
      # packages — dependents add no patch-coverage signal.
      - name: Run affected package coverage shard
        if: steps.coverage-plan.outputs.has_work == 'true'
        env:
          COVERAGE: "true"
          NODE_ENV: test
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/affected-unit-tests.mjs \
            --base-ref "$BASE_REF" \
            --mode coverage-packages \
            --lane "${{ matrix.lane }}" \
            --total-lanes 4 \
            --workspace-concurrency 2

      - name: Stage coverage shard
        run: |
          mkdir -p coverage-shard
          printf '%s\n' "${{ matrix.lane }}" > "coverage-shard/marker-packages-${{ matrix.lane }}"
          if [ "${{ steps.coverage-plan.outputs.has_work }}" = "true" ]; then
            find packages apps -type f -path "*/coverage/coverage-final.json" -exec cp --parents {} coverage-shard/ \;
            if ! find coverage-shard -type f -name "coverage-final.json" | grep -q .; then
              echo "::error::Package coverage shard produced no coverage-final.json files."
              exit 1
            fi
          else
            echo "No directly affected packages assigned to this coverage shard."
          fi

      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-packages-${{ matrix.lane }}
          path: coverage-shard/
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Coverage
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [coverage-pr-db, coverage-pr-packages]
    steps:
      - name: Check coverage shards
        run: |
          if [ "${{ needs.coverage-pr-db.result }}" != "success" ]; then
            echo "One or more affected DB coverage shards failed or were cancelled."
            exit 1
          fi
          if [ "${{ needs.coverage-pr-packages.result }}" != "success" ]; then
            echo "One or more affected package coverage shards failed or were cancelled."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Prepare coverage workspace
        id: coverage
        run: |
          pnpm coverage:prepare-workspace
          coverage_files=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          if [ "$coverage_files" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "No affected packages produced coverage; skipping merge and upload."
          fi

      - name: Generate merged coverage report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: pr
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: TAILWIND_DEBUG=1 pnpm run build

      - name: Validate CSS bundle
        run: |
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          fi

          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          fi

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            apps/desktop/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  web-e2e:
    name: Web E2E
    if: github.event_name != 'workflow_dispatch'
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their system
    # dependencies are baked in, so there is NO `playwright install` step and
    # NO download from cdn.playwright.dev at job time. This removes the CDN
    # browser download that was stalling at 100% and hanging the job to its
    # timeout. KEEP IN SYNC: the image tag MUST equal @playwright/test (^1.59.1);
    # the same pin is hard-coded in .github/workflows/{test.yml,web-e2e.yml,
    # performance.yml} — bump all three together on a Playwright upgrade.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # `--user 1001` (pwuser) is the configuration shown in Playwright's
      # official GitHub Actions container example. The browsers under
      # /ms-playwright are owned by this user; it is the documented, tested path.
      options: --user 1001
    timeout-minutes: 25
    env:
      NODE_ENV: production
      PORT: "8080"
      BASE_URL: http://127.0.0.1:8080
      # Browsers are preinstalled here in the image; point Playwright at them.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        # Exclude apps/desktop: it is the ONLY project carrying node-pty, a native
        # module compiled from source via node-gyp. This Playwright container ships
        # no C toolchain (make/g++ absent) and pwuser (`--user 1001`) has no sudo to
        # apt-get one, so a full install dies building node-pty. The web E2E never
        # loads node-pty (the terminal is desktop-only); dropping just the desktop
        # app keeps root + web + every shared package (41/42 projects). Do NOT
        # revert to a bare full install — it will re-break this job. See node-pty in
        # apps/desktop/package.json.
        run: pnpm install --frozen-lockfile --prod=false --filter '!@brainstrike/desktop'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Run web smoke
        run: pnpm --filter @brainstrike/web run test:e2e:lane:smoke

      - name: Upload web smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-main-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop E2E
    if: github.event_name != 'workflow_dispatch'
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Get Electron version
        id: electron-version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v2-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — it does NOT use a `playwright install chromium` browser. So we
      # only need the Chromium system libraries (apt), not the browser binary
      # download from cdn.playwright.dev (which was stalling and hanging the
      # job). `install-deps` is apt-only and does not touch the browser CDN.
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # The desktop smoke launches the REAL Electron binary via
      # `_electron.launch`. On an ~/.cache/electron cache miss the binary may
      # not be extracted into node_modules, so the app throws "Electron failed
      # to install correctly". Force-extract it (uses the warm cache when
      # present, else downloads from GitHub Releases — NOT the Playwright CDN),
      # then VERIFY the binary exists so any provisioning gap fails loudly here
      # rather than cryptically inside the test. This runs immediately before
      # the smoke so no later step (e.g. artifact extraction) can disturb it.
      # Provision the Electron binary deterministically. electron/install.js is
      # unreliable here: on an @electron/get cache hit it reaches its
      # `extract-zip` step but the (un-awaited) extraction never completes and
      # the process exits 0, leaving no dist/ or path.txt — so the app throws
      # "Electron failed to install correctly". Instead, download the prebuilt
      # zip directly from GitHub Releases (reliable host, NOT the Playwright
      # CDN) and extract it with the system `unzip`, then write path.txt and
      # hard-verify the executable exists before the smoke launches it.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/electron.zip" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "${RUNNER_TEMP}/electron.zip" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session provides an ephemeral D-Bus session so Chromium
      # inside Electron doesn't spew `[ERROR:dbus/bus.cc:405] Failed to
      # connect to the bus` for every spawned process. Tests pass without
      # this (Electron handles the missing bus gracefully), but suppressing
      # the noise keeps the smoke log readable.
      # dbus-run-session is provided by the `dbus` package, pre-installed
      # on the ubuntu-latest runner.
      - name: Run desktop smoke
        working-directory: apps/desktop
        run: dbus-run-session -- pnpm run test:e2e:lane:smoke

      - name: Upload desktop smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-main-test-results
          path: apps/desktop/test-results/
          retention-days: 1
          if-no-files-found: ignore
