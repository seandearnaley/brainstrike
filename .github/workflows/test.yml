name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

# CI environment variable is already set by GitHub Actions

jobs:
  # Fast-fail checks that run in parallel
  checks:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-node22-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-v3-

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build all packages
        run: |
          # Build with Tailwind debug output
          TAILWIND_DEBUG=1 pnpm run build
          
          # Check CSS bundle size (must be >= 50kB)
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"
          
          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "❌ CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes)"
            echo "This indicates Tailwind may not be scanning all package sources correctly"
            exit 1
          else
            echo "✅ CSS bundle size OK: ${CSS_SIZE} bytes"
          fi
          
          # Check for duplicate Tailwind layers
          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "❌ Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies)"
            echo "This indicates duplicate @import \"tailwindcss\" statements in package styles.css files"
            exit 1
          else
            echo "✅ No duplicate CSS layers detected"
          fi

      - name: Run unit tests with coverage
        run: pnpm run test:coverage
        env:
          NODE_ENV: "test"

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            **/coverage/coverage-final.json
          retention-days: 1

      - name: Enforce package coverage thresholds
        run: pnpm coverage:enforce

      - name: Comment PR with Coverage Summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Known thresholds (optional) – add more as packages mature
            const thresholds = new Map(Object.entries({
              '@brainstrike/file-explorer-ui': { lines: 86.5, functions: 84, branches: 81.5, statements: 86.5 },
              '@brainstrike/app-shell': { lines: 81.5, functions: 79, branches: 83, statements: 81.5 },
              '@brainstrike/desktop': { lines: 91, functions: 79, branches: 90.5, statements: 91 },
            }));

            function summarize(json) {
              let stTot = 0, stCov = 0, fnTot = 0, fnCov = 0, brTot = 0, brCov = 0, lnTot = 0, lnCov = 0;
              for (const file of Object.values(json)) {
                const s = file.s; stTot += Object.keys(s).length; stCov += Object.values(s).filter(v => v>0).length;
                const f = file.f; fnTot += Object.keys(f).length; fnCov += Object.values(f).filter(v => v>0).length;
                const b = file.b; for (const arr of Object.values(b)) { brTot += arr.length; brCov += arr.filter(v=>v>0).length; }
                const stm = file.statementMap; const lns = new Set();
                for (const { start, end } of Object.values(stm)) { for (let l = start.line; l <= end.line; l++) lns.add(l); }
                lnTot += lns.size; const coveredLines = new Set();
                for (const [k, v] of Object.entries(file.s)) {
                  if (v>0) { const { start, end } = file.statementMap[k]; for (let l = start.line; l <= end.line; l++) coveredLines.add(l); }
                }
                lnCov += coveredLines.size;
              }
              const pct = (cov, tot) => (tot ? (100 * cov) / tot : 0);
              return {
                lines: pct(lnCov, lnTot),
                functions: pct(fnCov, fnTot),
                branches: pct(brCov, brTot),
                statements: pct(stCov, stTot),
              };
            }

            // Find all coverage-final.json files in packages/* and apps/*
            function* walk(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) yield* walk(p);
                else yield p;
              }
            }

            function findPackageName(fromDir) {
              let curr = path.resolve(fromDir);
              for (let i = 0; i < 5; i++) {
                const pkgPath = path.join(curr, 'package.json');
                if (fs.existsSync(pkgPath)) {
                  try { return JSON.parse(fs.readFileSync(pkgPath, 'utf8')).name || path.basename(curr); } catch {}
                }
                curr = path.dirname(curr);
              }
              return path.basename(fromDir);
            }

            const roots = ['packages', 'apps'].filter((p) => fs.existsSync(p));
            const coverageFiles = [];
            for (const root of roots) {
              for (const file of walk(root)) {
                if (file.endsWith(path.join('coverage', 'coverage-final.json'))) coverageFiles.push(file);
              }
            }

            const rows = [];
            const fmt = (n) => `${n.toFixed(2)}%`;
            for (const file of coverageFiles.sort()) {
              const pkgDir = path.dirname(path.dirname(file));
              const pkgName = findPackageName(pkgDir);
              try {
                const json = JSON.parse(fs.readFileSync(file, 'utf8'));
                const s = summarize(json);
                const thr = thresholds.get(pkgName);
                const thrText = thr ? `thresholds: L${thr.lines} F${thr.functions} B${thr.branches} S${thr.statements}` : 'thresholds: —';
                rows.push(`| ${pkgName} | ${fmt(s.lines)} | ${fmt(s.functions)} | ${fmt(s.branches)} | ${fmt(s.statements)} | ${thrText} |`);
              } catch (e) {
                rows.push(`| ${pkgName} | error reading coverage | — | — | — | thresholds: — |`);
              }
            }

            const header = `## ✅ Coverage Summary (All Workspaces with reports)\n\n` +
              `| Package | Lines | Functions | Branches | Statements | Thresholds |\n` +
              `|---|---:|---:|---:|---:|---|`;
            const body = rows.length ? [header, ...rows].join('\n') : `${header}\n| — | — | — | — | — | — |`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body + '\n\n_Values computed from coverage-final.json; thresholds enforced via scripts/enforce-coverage.mjs_',
            });

  # E2E tests run in parallel with sharding
  e2e:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: checks # Only run if checks pass
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-node22-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-v3-

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./apps/web/package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build application
        run: |
          # Build with Tailwind debug output
          TAILWIND_DEBUG=1 pnpm run build --filter @brainstrike/web
          
          # Check CSS bundle size (must be >= 50kB)
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"
          
          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "❌ CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes)"
            echo "This indicates Tailwind may not be scanning all package sources correctly"
            exit 1
          else
            echo "✅ CSS bundle size OK: ${CSS_SIZE} bytes"
          fi
          
          # Check for duplicate Tailwind layers
          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "❌ Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies)"
            echo "This indicates duplicate @import \"tailwindcss\" statements in package styles.css files"
            exit 1
          else
            echo "✅ No duplicate CSS layers detected"
          fi

      - name: Run E2E tests (functional only, shard)
        run: |
          cd apps/web
          pnpm exec playwright test --project=functional --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/web/blob-report
          retention-days: 1

  # Desktop E2E tests
  desktop-e2e:
    name: Desktop E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: checks # Only run if checks pass
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-node22-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.jsonc', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-v3-

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright for Electron (no browsers needed)
        run: pnpm exec playwright install-deps

      - name: Cache desktop dist
        uses: actions/cache@v4
        with:
          path: apps/desktop/dist
          key: ${{ runner.os }}-desktop-dist-${{ hashFiles('apps/desktop/**', '!apps/desktop/dist/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-dist-

      - name: Build desktop application (if cache miss)
        run: |
          if [ ! -d "apps/desktop/dist" ] || [ -z "$(ls -A apps/desktop/dist)" ]; then
            pnpm run build --filter @brainstrike/desktop
          else
            echo "Using cached desktop dist/"
          fi

      - name: Start Xvfb and run Desktop E2E tests (shard)
        run: |
          Xvfb :99 -screen 0 1280x960x24 -nolisten tcp &
          export DISPLAY=:99
          cd apps/desktop
          pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NODE_ENV: "test"
          CI: "true"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-blob-report
          path: apps/desktop/blob-report
          retention-days: 1

  # Merge E2E test reports
  merge-reports:
    name: Merge Test Reports
    needs: [checks, e2e, desktop-e2e]
    runs-on: ubuntu-latest
    if: always() && (needs.checks.result == 'success' || needs.e2e.result == 'success' || needs.desktop-e2e.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build packages (required for Playwright config)
        run: pnpm run build

      - name: Download blob reports
        id: download-reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: '*blob-report*'
        continue-on-error: true

      - name: Check if blob reports exist
        id: check-reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports)" ]; then
            echo "reports-exist=true" >> $GITHUB_OUTPUT
            echo "Blob reports found:"
            ls -la all-blob-reports/
          else
            echo "reports-exist=false" >> $GITHUB_OUTPUT
            echo "No blob reports found - E2E tests may have failed"
          fi

      - name: Merge Playwright reports
        if: steps.check-reports.outputs.reports-exist == 'true'
        run: |
          echo "Contents of blob report directories:"
          ls -la all-blob-reports/*/
          
          # Create a single directory with all blob files
          mkdir -p merged-blob-reports
          
          # Copy all blob report files to the merged directory
          for dir in all-blob-reports/*/; do
            if [ -d "$dir" ]; then
              echo "Copying files from $dir"
              cp -r "$dir"/* merged-blob-reports/ || true
            fi
          done
          
          echo "Merged blob reports directory contents:"
          ls -la merged-blob-reports/
          
          # Debug: Check if merge config exists and is valid
          echo "Checking merge config..."
          ls -la playwright-merge.config.js
          node -c playwright-merge.config.js
          
          # Merge reports using custom merge config to handle both web and desktop
          echo "Starting merge process..."
          pnpm exec playwright merge-reports --config playwright-merge.config.js merged-blob-reports

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: unit-coverage

      - name: Merge all coverage reports
        if: always()
        run: |
          # Find and merge all coverage files
          echo "Finding coverage files..."
          if [ -d "unit-coverage" ]; then
            find unit-coverage -name "coverage-final.json" -type f
            
            # Create .nyc_output directory
            mkdir -p .nyc_output
            
            # Merge coverage if files exist
            if find unit-coverage -name "coverage-final.json" -type f | head -1 | grep -q .; then
              echo "Merging coverage files..."
              pnpm coverage:merge -- --quiet unit-coverage
              
              # Generate reports
              pnpm coverage:report
              echo "Coverage reports generated successfully"
            else
              echo "No coverage files found to merge"
            fi
          else
            echo "No unit-coverage directory found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload final test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-results
          path: |
            coverage/
            playwright-report-merged/
          retention-days: 7
          if-no-files-found: warn

  # Optional checks that don't block merging
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build packages (required for Knip)
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Run Knip analysis
        id: knip-analysis
        run: |
          REPORT_FILE="knip-report.md"
          OUTPUT=$(pnpm run knip -c knip.jsonc --cache --reporter markdown || true)
          echo "$OUTPUT"
          
          if echo "$OUTPUT" | grep -q "Unused"; then
            echo "$OUTPUT" > $REPORT_FILE
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "## ✅ No unused code detected!" > $REPORT_FILE
            echo "" >> $REPORT_FILE
            echo "Great job! Knip didn't find any unused files, exports, or dependencies." >> $REPORT_FILE
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Knip Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let knipReport = '## Knip analysis failed to run\n\nPlease check the workflow logs for details.';
            if (fs.existsSync('knip-report.md')) {
              knipReport = fs.readFileSync('knip-report.md', 'utf8');
            }
            
            const body = `## 🔍 Code Quality Analysis
            
            ${knipReport}
            
            > Knip helps identify unused code to reduce bundle size and improve maintainability.
            > This check is non-blocking but please consider cleaning up unused code.
            > 
            > [Learn more about Knip](https://knip.dev)`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
