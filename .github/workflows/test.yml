name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  security-events: write # For Snyk & dependency scanning

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env: # Common env vars for all steps
      CI: "true"
      # NODE_ENV is now set per step where its specific value is critical

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by Turborepo for determining affected packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.8.0'

      - name: Get pnpm store path
        id: pnpm-cache-dir
        shell: sh # Ensure portability
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store and Turborepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
            .turbo
          key: ${{ runner.os }}-pnpm-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-pnpm-turbo-v3-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # PREREQUISITE: Ensure @codecov/vite-plugin is a devDependency in apps/web/package.json

      - name: Verify package links (Optional Sanity Check)
        run: |
          echo "Verifying package links..."
          pnpm list -r --depth 0
          echo "Checking for workspace:* dependencies..."
          grep -r "workspace:" --include="package.json" . || true # Allow no workspace deps

      - name: Verify types package structure (Optional Sanity Check)
        run: |
          echo "Types package structure:"
          ls -la packages/types/
          echo "Types package tsconfig.json:"
          cat packages/types/tsconfig.json

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true

      - name: Run Biome checks (Lint & Format)
        run: pnpm run lint # Fails build on issues

      - name: Build all packages
        run: pnpm run build
        env:
          NODE_ENV: "production" # Ensure builds are production builds

      - name: Type check
        run: pnpm run type-check
        env:
          NODE_ENV: "production" # Type check against production build artifacts

      - name: Run Knip (detect unused code)
        run: |
          # Run knip with consistent flags and capture output
          OUTPUT=$(pnpm run knip -c knip.jsonc --max-issues 10 --cache --reporter markdown || true)
          
          # Display the output for CI logs
          echo "$OUTPUT"
          
          # Check if there are any issues and fail if found
          if echo "$OUTPUT" | grep -q "Unused"; then
            echo "❌ Knip found unused code. Please review and clean up."
            exit 1
          else
            echo "✅ No unused code detected!"
          fi
        continue-on-error: false

      - name: Run tests with coverage (Unit & Integration)
        run: pnpm run test:coverage
        env:
          NODE_ENV: "test" # Important: Tests (especially using React Testing Library's act) need non-production NODE_ENV

      - name: Cache Playwright browsers
        id: playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-v1-

      - name: Install Playwright browsers and dependencies (if cache missed)
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests with coverage
        run: |
          if lsof -ti:3000 >/dev/null; then
            echo "Port 3000 is in use. Attempting to kill process(es)..."
            lsof -ti:3000 | xargs -r kill -9
          fi
          pnpm run test:e2e
        env:
          NODE_ENV: "test" # E2E server and tests might also benefit from NODE_ENV=test
          PORT: "3000"
          BASE_URL: "http://127.0.0.1:3000"

      - name: Process coverage reports
        if: always()
        run: |
          echo "Listing all raw coverage files (coverage-final.json) to debug:"
          find . -path "*/coverage/coverage-final.json" -type f -ls
          
          echo "Running coverage merge script..."
          pnpm run coverage:merge # This script should create .nyc_output/coverage.json
          
          echo "Checking for merged coverage file (.nyc_output/coverage.json)..."
          if [ -f .nyc_output/coverage.json ]; then
            echo ".nyc_output/coverage.json exists."
            echo "Running coverage report script (to generate lcov, text reports, etc. in ./coverage/)..."
            pnpm run coverage:report # This script uses .nyc_output/coverage.json as input
          else
            echo "WARN: Merged coverage file .nyc_output/coverage.json not found! Subsequent reports might be incomplete."
          fi
          
          echo "Checking for lcov report for Codecov (expected ./coverage/lcov.info): $(test -f ./coverage/lcov.info && echo 'Yes' || echo 'No')"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5 # As per user's original workflow
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # nyc report script should generate lcov.info in ./coverage/
          files: ./coverage/lcov.info 
          fail_ci_if_error: false
          verbose: true
          disable_search: true # Prevent Codecov from finding other coverage files

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            apps/web/playwright-report/
            apps/web/test-results/ # For Vitest JUnit reports, if configured
          retention-days: 30
          if-no-files-found: warn

      - name: Run dependency vulnerability scan (Snyk)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master # Consider using a specific tag like @0.7.0 for stability
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SYNK_TOKEN }}