name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write # For dependency scanning

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --production
        continue-on-error: true # Don't fail the build, but report issues

      - name: Run Biome checks
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run Knip (detect unused code)
        run: npm run knip -- --max-issues=10 --cache # Uses config from knip.jsonc
        continue-on-error: true # Initially allow failures until codebase is cleaned up

      - name: Run tests with coverage
        run: npm run test:coverage

      # Separate Playwright cache to avoid permission issues
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright system dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: |
          # Update apt cache without caching it (to avoid permission issues)
          sudo apt-get update
          # Install Playwright dependencies
          npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build Vite app
        run: npm run build
        env:
          CI: true

      - name: Run E2E tests with coverage
        run: |
          # Ensure port 3000 is free
          if lsof -ti:3000 >/dev/null; then
            lsof -ti:3000 | xargs -r kill -9
          fi
          
          npm run test:e2e
        env:
          CI: true
          PORT: 3000
          BASE_URL: http://127.0.0.1:3000

      - name: Process coverage reports
        if: always()
        run: |
          npm run coverage:merge
          npm run coverage:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 30

      # Add dependency scanning with a more appropriate action
      - name: Run dependency vulnerability scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SYNK_TOKEN }}
