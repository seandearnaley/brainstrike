name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  security-events: write # For Snyk & dependency scanning

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env: # Common env vars for all steps
      CI: "true"
      # NODE_ENV is now set per step where its specific value is critical

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by Turborepo for determining affected packages

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.12.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-v3-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version  
        run: echo "version=$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Lint
        run: pnpm run lint
        
      - name: Type check
        run: pnpm run type-check
        
      - name: Build
        run: pnpm run build

      - name: Verify package links (Optional Sanity Check)
        run: |
          echo "Verifying package links..."
          pnpm list -r --depth 0
          echo "Checking for workspace:* dependencies..."
          grep -r "workspace:" --include="package.json" . || true # Allow no workspace deps

      - name: Verify types package structure (Optional Sanity Check)
        run: |
          echo "Types package structure:"
          ls -la packages/types/
          echo "Types package tsconfig.json:"
          cat packages/types/tsconfig.json

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true

      - name: Run Knip (detect unused code)
        id: knip-analysis
        run: |
          # Create a temporary file for the report
          REPORT_FILE="knip-report.md"
          
          # Run knip with consistent flags and capture output
          OUTPUT=$(pnpm run knip -c knip.jsonc --max-issues 10 --cache --reporter markdown || true)
          
          # Display the output for CI logs
          echo "$OUTPUT"
          
          # Save output for PR comment
          if echo "$OUTPUT" | grep -q "Unused"; then
            # If issues found, save the output and fail
            echo "$OUTPUT" > $REPORT_FILE
            echo "❌ Knip found unused code. Please review and clean up."
            exit 1
          else
            # If no issues found, create a success message
            echo "## ✅ No unused code detected!" > $REPORT_FILE
            echo "" >> $REPORT_FILE
            echo "Great job! Knip didn't find any unused files, exports, or dependencies." >> $REPORT_FILE
            echo "✅ No unused code detected!"
          fi
          
          # Ensure the file exists for PR comment step
          touch $REPORT_FILE
        continue-on-error: false

      # Comment on PR with Knip results if this is a PR (but not from forks for security)
      - name: Comment PR with Knip Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read the knip report with fallback
            let knipReport = '## Knip analysis failed to run\n\nPlease check the workflow logs for details.';
            if (fs.existsSync('knip-report.md')) {
              knipReport = fs.readFileSync('knip-report.md', 'utf8');
            }
            
            // Create the comment body
            const body = `## Knip Code Analysis Results

            ${knipReport}

            > Knip helps identify unused code in your project to reduce bundle size and improve maintainability.
            > 
            > [Learn more about Knip](https://knip.dev)`;
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Run tests with coverage (Unit & Integration)
        run: pnpm run test:coverage
        env:
          NODE_ENV: "test" # Important: Tests (especially using React Testing Library's act) need non-production NODE_ENV

      - name: Run E2E tests with coverage
        run: |
          if lsof -ti:8080 >/dev/null; then
            echo "Port 8080 is in use. Attempting to kill process(es)..."
            lsof -ti:8080 | xargs -r kill -9
          fi
          pnpm run test:e2e
        env:
          NODE_ENV: "test" # E2E server and tests might also benefit from NODE_ENV=test
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Process coverage reports
        if: always()
        run: |
          echo "Verifying pnpm availability..."
          which pnpm || (echo "pnpm not found in PATH" && exit 1)
          
          echo "Listing all raw coverage files (coverage-final.json) to debug:"
          find . -path "*/coverage/coverage-final.json" -type f -ls
          
          echo "Running coverage merge script..."
          pnpm run coverage:merge
          
          echo "Checking for merged coverage file (.nyc_output/coverage.json)..."
          if [ -f .nyc_output/coverage.json ]; then
            echo ".nyc_output/coverage.json exists."
            echo "Running coverage report script (to generate lcov, text reports, etc. in ./coverage/)..."
            pnpm run coverage:report
          else
            echo "WARN: Merged coverage file .nyc_output/coverage.json not found! Subsequent reports might be incomplete."
          fi
          
          echo "Checking for lcov report for Codecov (expected ./coverage/lcov.info): $(test -f ./coverage/lcov.info && echo 'Yes' || echo 'No')"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5 # As per user's original workflow
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # nyc report script should generate lcov.info in ./coverage/
          files: ./coverage/lcov.info 
          fail_ci_if_error: false
          verbose: true
          disable_search: true # Prevent Codecov from finding other coverage files

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn