name: Test

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Script tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run type-check

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compute changed-workspace filters from git diff (NOT turbo --affected).
      # Turbo treats `globalDependencies` changes (pnpm-lock.yaml, root tsconfigs,
      # turbo.jsonc, .nvmrc) as affecting EVERY package, so `--affected` and
      # `--filter=[ref]` explode to all 40 workspaces whenever the lockfile
      # changes (i.e., almost every PR). Computing the affected set from the
      # git diff sidesteps that.
      - name: Detect changed workspace packages (PR unit)
        id: changed-pr
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          paths=$(git diff --name-only "origin/$BASE_REF"...HEAD \
            | awk -F/ '/^packages\/|^apps\// && NF>=2 {print $1"/"$2}' \
            | sort -u)
          filters=""
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -f "$p/package.json" ] || continue
            name=$(jq -r '.name' "$p/package.json")
            # `<name>...` = package + all dependents, so cross-package
            # regressions still surface in Unit.
            filters="$filters --filter=${name}..."
          done <<<"$paths"
          if [ -z "$filters" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changed workspace packages detected; Unit will skip."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "filters=$filters" >> "$GITHUB_OUTPUT"
            echo "Filters: $filters"
          fi

      - name: Pull request affected unit tests
        if: github.event_name == 'pull_request' && steps.changed-pr.outputs.has_changes == 'true'
        env:
          COVERAGE: "false"
          TURBO_TEST_MODE: unit
          FILTERS: ${{ steps.changed-pr.outputs.filters }}
        run: pnpm turbo run test $FILTERS --concurrency=4 --summarize --log-order=grouped

      - name: Push and manual unit tests
        if: github.event_name != 'pull_request'
        env:
          COVERAGE: "false"
          TURBO_TEST_MODE: unit
        run: pnpm run test:fast

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear coverage directories
        run: |
          find packages apps -maxdepth 3 -type d \( -name "coverage" -o -name "coverage-*" \) -prune -exec rm -rf {} +
          rm -rf .nyc_output

      # Same git-diff-driven detection as Unit. See the comment in the Unit
      # job for why we don't use turbo's --filter=[ref] here.
      - name: Detect changed workspace packages (PR coverage)
        id: changed-cov
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          paths=$(git diff --name-only "origin/$BASE_REF"...HEAD \
            | awk -F/ '/^packages\/|^apps\// && NF>=2 {print $1"/"$2}' \
            | sort -u)
          filters=""
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -f "$p/package.json" ] || continue
            name=$(jq -r '.name' "$p/package.json")
            # Just the package itself — Codecov's patch gate is on changed
            # lines, which live in the directly-changed packages.
            filters="$filters --filter=${name}"
          done <<<"$paths"
          if [ -z "$filters" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changed workspace packages detected; coverage step will skip."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "filters=$filters" >> "$GITHUB_OUTPUT"
            echo "Filters: $filters"
          fi

      - name: Run affected-only coverage
        if: steps.changed-cov.outputs.has_changes == 'true'
        env:
          COVERAGE: "true"
          NODE_ENV: test
          TURBO_TEST_MODE: coverage
          FILTERS: ${{ steps.changed-cov.outputs.filters }}
        run: |
          pnpm turbo run test:coverage \
            $FILTERS \
            --concurrency=4 \
            --summarize \
            --log-order=grouped \
            --cache-dir=.turbo

      - name: Prepare coverage workspace
        id: coverage
        run: |
          pnpm coverage:prepare-workspace
          coverage_files=$(find packages apps -type f -path "*/coverage/coverage-final.json" | wc -l | tr -d ' ')
          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          if [ "$coverage_files" -gt 0 ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "No affected packages produced coverage; skipping merge and upload."
          fi

      - name: Generate merged coverage report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          pnpm coverage:merge -- --quiet packages apps
          pnpm coverage:report

      - name: Upload coverage to Codecov
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: pr
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo artifacts
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: TAILWIND_DEBUG=1 pnpm run build

      - name: Validate CSS bundle
        run: |
          CSS_SIZE=$(find apps/web/dist/assets -name '*.css' -exec cat {} + | wc -c)
          echo "CSS bundle size: ${CSS_SIZE} bytes"

          if [ "$CSS_SIZE" -lt 50000 ]; then
            echo "::error::CSS bundle too small: ${CSS_SIZE} bytes (expected >= 50,000 bytes). Tailwind may not be scanning all package sources."
            exit 1
          fi

          PAT='*,:after,:before,::backdrop{box-sizing:border-box'
          DUPLICATE_COUNT=$(grep -h -F -o "$PAT" $(find apps/web/dist/assets -name '*.css') | wc -l)
          if [ "$DUPLICATE_COUNT" -ne 1 ]; then
            echo "::error::Duplicate Tailwind layers detected ($DUPLICATE_COUNT copies). Check for duplicate @import \"tailwindcss\" statements."
            exit 1
          fi

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            apps/desktop/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  web-e2e:
    name: Web E2E
    if: github.event_name != 'workflow_dispatch'
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PORT: "8080"
      BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web smoke
        run: pnpm --filter @brainstrike/web run test:e2e:lane:smoke

      - name: Upload web smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-main-test-results
          path: apps/web/test-results/
          retention-days: 1
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop E2E
    if: github.event_name != 'workflow_dispatch'
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      ELECTRON_ENABLE_STACK_DUMPING: "false"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Get Electron version
        id: electron-version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v2-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop smoke
        working-directory: apps/desktop
        run: pnpm run test:e2e:lane:smoke

      - name: Upload desktop smoke traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-main-test-results
          path: apps/desktop/test-results/
          retention-days: 1
          if-no-files-found: ignore
