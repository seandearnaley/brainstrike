# Runs nightly on main (owner decision 2026-10-17).
# Per-PR hosted CI is off; merges use the local gate in docs/agents/ci-quality.md.

name: Desktop E2E

on:
  # BST-2233: no schedule of its own; nightly.yml calls it each night. A called
  # run's `inputs` holds only these inputs and its event is the caller's, so
  # `suite` keeps a dispatched nightly from skipping the full regression.
  workflow_call:
    inputs:
      suite:
        description: Desktop E2E suite to run
        required: true
        type: string
    secrets:
      LINEAR_API_KEY:
        required: true
      TURBO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: Desktop E2E suite to run
        required: true
        default: full
        type: choice
        options:
          - full
          - foreground-latency

# In a called run github.workflow is the caller's name; the file name keeps this
# group apart from nightly.yml's and its siblings'.
concurrency:
  group: ${{ github.workflow }}-desktop-e2e-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  NODE_ENV: test
  CI: "true"
  ELECTRON_ENABLE_STACK_DUMPING: "false"
  ELECTRON_DISABLE_GPU: "1"

jobs:
  desktop-full-regression:
    name: Desktop Full Regression (shard ${{ matrix.shard }})
    if: github.repository == 'seandearnaley/brainstrike' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full')
    runs-on: ubuntu-latest
    # Each shard runs a quarter of the regression project under the lane's own
    # 30m --global-timeout; shard 1 also runs the 2m AI Tools nightly lane.
    # Setup/build headroom included. Two shards hit the 30m bound on run
    # 39109422803 (132 and 123 specs ran, 20 never did: about 64 min of work);
    # four give about 16 min each, inside the bound on a runner 1.7x slower.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      # The lane script runs Playwright directly, not through turbo, so the
      # `test:e2e` task's declared test-only prerequisite
      # (`@brainstrike/mcp-test-lab#build` in apps/desktop/turbo.json) is not
      # honored on its own. Seven regression specs import
      # packages/mcp-test-lab/dist/index.js and failed with ERR_MODULE_NOT_FOUND
      # (run 39029251733), so build it here with the app.
      - name: Build desktop
        run: pnpm run build --filter @brainstrike/desktop --filter @brainstrike/mcp-test-lab

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — NOT a `playwright install chromium` browser. So we only need
      # the Chromium system libraries (apt), never the browser binary download
      # from cdn.playwright.dev that was stalling and hanging this job to its
      # timeout. `install-deps` is apt-only and does not touch the browser CDN.

      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # The host's live grep pass resolves `rg` from PATH, and the regression
      # spec host-thread-search.desktop.test.ts asserts that pass ran as
      # `liveEngine: 'ripgrep'`. The runner image carries no ripgrep, so the
      # host took its js-walk path and the spec failed (run 39029251733). Every
      # developer machine and the Unit lane's fence step provide it; so must this.
      - name: Install ripgrep
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      # Electron 43 exposes install.js only as a bin and has no install lifecycle,
      # so pnpm cannot provision the binary. Download the prebuilt zip from
      # GitHub Releases, extract it, and hard-verify the executable before launch.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session provides an ephemeral D-Bus session bus so
      # Chromium inside Electron doesn't spew `[ERROR:dbus/bus.cc:405]
      # Failed to connect to the bus` for every process. dbus-run-session
      # is provided by the `dbus` package (pre-installed on ubuntu-latest).
      # Playwright's own --shard splits the regression project across the
      # matrix (the total must equal the matrix length; a script contract checks). pnpm
      # appends the flag to the lane script, which must therefore end in the
      # playwright command.
      # Each Playwright run writes its JSON report under
      # nightly-results/<results job>/<part>/, outside test-results/, which the AI
      # Tools run below clears (BST-2189). Each shard is its own part, so a red
      # shard is judged on its own results.
      - name: Run full desktop regression
        working-directory: apps/desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/nightly-results/desktop-full-regression-gate/shard-${{ matrix.shard }}/regression.json
        run: dbus-run-session -- pnpm run test:e2e:lane:full-regression-shard --shard=${{ matrix.shard }}/4

      # The AI Tools smoke specs are excluded from the regression project, so
      # exactly one shard runs their nightly lane. It runs only after the regression
      # step passes: both write apps/desktop/test-results/ and blob-report/, which
      # every Playwright run clears, so running it after a failure would erase the
      # failure's traces.
      - name: Run desktop AI Tools nightly lane
        if: matrix.shard == 1
        working-directory: apps/desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/nightly-results/desktop-full-regression-gate/shard-${{ matrix.shard }}/tools-settings-nightly.json
        run: dbus-run-session -- pnpm run test:e2e:lane:tools-settings-nightly

      # Every run, green, red or cancelled: a green night's flaky tests and passes
      # are what Notify Linear files and recovers per test, and a red part with
      # no failing test is filed from its job status.
      - name: Record the nightly job status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PART_DIR: ${{ runner.temp }}/nightly-results/desktop-full-regression-gate/shard-${{ matrix.shard }}
        run: |
          mkdir -p "$PART_DIR"
          printf '%s\n' "$JOB_STATUS" > "$PART_DIR/job.status"

      - name: Upload nightly test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results--desktop-full-regression-gate--shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/nightly-results/
          retention-days: 1
          if-no-files-found: warn

      # test-results/ holds each failed test's raw trace, screenshots, video,
      # error context and spec diagnostics; blob-report/ holds the report zip
      # (with copies of the attachments) for `playwright merge-reports`.
      - name: Upload desktop traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-full-regression-shard-${{ matrix.shard }}-test-results
          path: |
            apps/desktop/test-results/
            apps/desktop/blob-report/
          retention-days: 1
          if-no-files-found: warn

  # The `Desktop Full Regression` check the ruleset will require (it names this job's
  # `name`, so keep it exact). Fan-in over the shard matrix, like `unit` over
  # `unit-shard` in test.yml: a matrix job's result is `success` only when every
  # shard succeeded. It carries the shard job's own condition so it skips exactly
  # when the shards do (a foreground-latency dispatch), and fails on anything else.
  desktop-full-regression-gate:
    name: Desktop Full Regression
    if: github.repository == 'seandearnaley/brainstrike' && always() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full')
    needs: [desktop-full-regression]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check shard results
        env:
          SHARD_RESULT: ${{ needs.desktop-full-regression.result }}
        run: |
          echo "desktop-full-regression shard result: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Desktop full regression shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

  desktop-embedding-e2e:
    name: Desktop Embedding E2E
    if: github.repository == 'seandearnaley/brainstrike' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'foreground-latency'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Build desktop
        run: pnpm run build --filter @brainstrike/desktop

      # Desktop E2E drives the app through Playwright's Electron API
      # (_electron.launch), which uses the app's OWN bundled Electron/Chromium
      # binary — NOT a `playwright install chromium` browser. So we only need
      # the Chromium system libraries (apt), never the browser binary download
      # from cdn.playwright.dev that was stalling and hanging this job to its
      # timeout. `install-deps` is apt-only and does not touch the browser CDN.

      # BST-1715: an unused third-party apt source (Google Chrome, added by the
      # runner image) serving an inconsistent index makes the apt-get update
      # below exit non-zero and kills this step. Drop the source rather than
      # relaxing apt's exit status.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # Electron 43 exposes install.js only as a bin and has no install lifecycle,
      # so pnpm cannot provision the binary. Download the prebuilt zip from
      # GitHub Releases, extract it, and hard-verify the executable before launch.
      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # dbus-run-session wraps Electron so Chromium's D-Bus connect attempts
      # don't fill the log with `[ERROR:dbus/bus.cc:405] Failed to connect`.
      # The two native-backfill specs embed about 300 real chunks each on WASM:
      # about 9 minutes on this runner, which a regression shard's 30-minute
      # budget cannot also hold (BST-2090, run 39062126583).
      - name: Run desktop embedding regression
        working-directory: apps/desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/nightly-results/desktop-embedding-e2e/main/embedding.json
        run: |
          unset NO_COLOR
          BRAINSTRIKE_DISABLE_FILE_LOGS=1 LOG_LEVEL=warn dbus-run-session -- pnpm exec xvfb-maybe pnpm exec playwright test \
            e2e/embedding-worker-renderer.smoke.desktop.test.ts \
            e2e/embedding-worker-renderer.search.desktop.test.ts \
            e2e/embedding-worker-renderer.lifecycle.desktop.test.ts \
            e2e/mid-session-add-root.desktop.test.ts \
            e2e/native-index-semantic-results.desktop.test.ts \
            e2e/native-index-retry-indexing.desktop.test.ts \
            e2e/native-index-shutdown-signal.desktop.test.ts \
            --project=regression \
            --workers=1 \
            --retries=0 \
            --max-failures=0 \
            --global-timeout=3000000 \
            --grep="@desktop-embedding-"

      - name: Record the nightly job status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PART_DIR: ${{ runner.temp }}/nightly-results/desktop-embedding-e2e/main
        run: |
          mkdir -p "$PART_DIR"
          printf '%s\n' "$JOB_STATUS" > "$PART_DIR/job.status"

      - name: Upload nightly test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results--desktop-embedding-e2e
          path: ${{ runner.temp }}/nightly-results/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload desktop embedding traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-embedding-e2e-test-results
          path: |
            apps/desktop/test-results/
            apps/desktop/blob-report/
          retention-days: 1
          if-no-files-found: warn

  # The loaded foreground-latency benchmark (BST-1925): a full Workspace Index
  # build with foreground probes. It reports numbers into the evidence artifact
  # and fails only when the run cannot produce valid ones. Nightly and dispatch
  # (suite=foreground-latency) only, never on pull requests.
  desktop-foreground-latency:
    name: Desktop Foreground Latency Benchmark
    if: github.repository == 'seandearnaley/brainstrike' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'foreground-latency'))
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'true'

      - name: Build desktop
        run: pnpm run build --filter @brainstrike/desktop

      # Same Chromium system libraries and Electron provisioning as the jobs above.
      - name: Drop unused apt sources
        uses: ./.github/actions/apt-drop-unused-sources

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Provision Electron binary
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VER=$(node -p "require('electron/package.json').version")
          DIR=$(node -p "require('path').dirname(require.resolve('electron/package.json'))")
          ELECTRON_ZIP="${RUNNER_TEMP:-/tmp}/electron.zip"
          URL="https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-x64.zip"
          echo "Downloading Electron v${VER} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ELECTRON_ZIP" "$URL"
          rm -rf "${DIR}/dist" "${DIR}/path.txt"
          mkdir -p "${DIR}/dist"
          unzip -q -o "$ELECTRON_ZIP" -d "${DIR}/dist"
          printf 'electron' > "${DIR}/path.txt"
          node -e "const fs=require('fs');const p=require('electron');fs.accessSync(p);console.log('Electron binary present at '+p)"

      # Runners have no GPU, so the embedding host runs on WASM, and the corpus
      # is sized for the build to outlast the benchmark's 60 s floor on that path.
      - name: Run foreground latency benchmark
        working-directory: apps/desktop
        env:
          BRAINSTRIKE_WORKSPACE_INDEX_INTEGRATED_BENCHMARK_DEVICE: wasm
          BRAINSTRIKE_WORKSPACE_INDEX_INTEGRATED_BENCHMARK_FILES: '60'
          BRAINSTRIKE_WORKSPACE_INDEX_INTEGRATED_BENCHMARK_EVIDENCE_PATH: ${{ runner.temp }}/foreground-latency/foreground-latency-under-index-build.json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/nightly-results/desktop-foreground-latency/main/foreground-latency.json
        run: dbus-run-session -- pnpm run test:e2e:lane:foreground-latency

      - name: Record the nightly job status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PART_DIR: ${{ runner.temp }}/nightly-results/desktop-foreground-latency/main
        run: |
          mkdir -p "$PART_DIR"
          printf '%s\n' "$JOB_STATUS" > "$PART_DIR/job.status"

      - name: Upload nightly test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results--desktop-foreground-latency
          path: ${{ runner.temp }}/nightly-results/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload foreground latency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-foreground-latency-evidence
          path: ${{ runner.temp }}/foreground-latency/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload desktop traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-foreground-latency-test-results
          path: |
            apps/desktop/test-results/
            apps/desktop/blob-report/
          retention-days: 1
          if-no-files-found: warn

  notify-linear:
    name: Notify Linear
    needs: [desktop-full-regression-gate, desktop-embedding-e2e, desktop-foreground-latency]
    if: ${{ github.repository == 'seandearnaley/brainstrike' && always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/nightly-linear-alert.yml
    with:
      # Its own name: in nightly.yml's call, github.workflow is the caller's.
      workflow_name: Desktop E2E
      # Each shard is one part of the gate: a red shard needs its own failing test.
      parts: desktop-full-regression-gate=shard-1 shard-2 shard-3 shard-4
      results: desktop-full-regression-gate=${{ needs.desktop-full-regression-gate.result }},desktop-embedding-e2e=${{ needs.desktop-embedding-e2e.result }},desktop-foreground-latency=${{ needs.desktop-foreground-latency.result }}
      # BST-2235: the failing and flaky tests' issues it files go to the night's
      # fix queue, and nightly-fix.yml runs one fix agent (BST-2189) per issue
      # after the night, on the runner image these lanes use.
      fix_runs_on: ubuntu-latest
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
