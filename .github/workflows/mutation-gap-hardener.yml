name: Mutation Gap Hardener

on:
  schedule:
    - cron: '13 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-gap-hardener-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-gap-hardener:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Setup workspace
        uses: ./.github/actions/setup-report-workspace

      - name: Build mutation target dependency closure
        run: pnpm exec turbo run build --filter=@brainstrike/file-system... --concurrency=2 --cache=local:r

      - name: Run exact-target mutation shadow
        run: node scripts/mutation-gap-hardener.mjs

      - name: Upload normalized and raw mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-gap-hardener-report
          path: |
            reports/shadow/mutation-gap-hardener
            packages/file-system/reports/shadow/mutation-gap.json
            packages/file-system/reports/shadow/mutation-gap.html
          retention-days: 14
          if-no-files-found: error
