name: Performance E2E (Optional)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  perf-e2e:
    name: Performance E2E
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-performance')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: |
            - args: [--frozen-lockfile]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-v3-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-v3-

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e \"console.log(require('./apps/web/package.json').devDependencies['@playwright/test'])\")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build application
        run: |
          pnpm -w build --filter @brainstrike/web

      - name: Run Performance E2E tests
        run: |
          cd apps/web
          pnpm exec playwright test --project=performance
        env:
          NODE_ENV: "production"
          PORT: "8080"
          BASE_URL: "http://127.0.0.1:8080"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-blob-report
          path: apps/web/blob-report
          retention-days: 3


