name: Nightly Fix Agent

# BST-2189: one red-first fix attempt for one nightly-alert issue, on the failing
# lane's runner image, by .claude/skills/fix-nightly. Claude works with a
# read-only token and no provider keys. This workflow's own steps claim the
# issue, publish the branch and pull request, and comment on Linear. The fix
# job fails, visibly and before claiming, until the owner adds the
# CLAUDE_CODE_OAUTH_TOKEN secret.
#
# BST-2235: nightly-fix.yml calls it after the night, so the github context is
# that run's: its run id, and main's head as GITHUB_SHA. The night's run and
# commit come in as inputs, and the agent builds on the commit the night tested.

on:
  workflow_call:
    inputs:
      issue:
        description: The nightly-alert issue to fix, such as BST-123.
        required: true
        type: string
      runs_on:
        description: The failing lane's runner label.
        required: true
        type: string
      nightly_run_id:
        description: The Nightly run that failed the test; its artifacts are the evidence.
        required: true
        type: string
      head_sha:
        description: The commit that Nightly run tested; the fix builds on it.
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  fix:
    name: Fix ${{ inputs.issue }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 120
    # One attempt per issue at a time, across workflows and nights.
    concurrency:
      group: nightly-fix-${{ inputs.issue }}
      cancel-in-progress: false
    # Read-only: the agent cannot push, open or merge a pull request.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      commits: ${{ steps.handoff.outputs.commits }}
      patch_sha: ${{ steps.handoff.outputs.patch_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      # The secret's presence travels as a boolean, never its value.
      - name: Require the fix agent credential
        env:
          HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ "$HAS_CLAUDE_CREDENTIAL" != "true" ]; then
            echo "::error title=Nightly fix agent not configured::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (claude setup-token) to run the fix agent. $ISSUE was left unclaimed."
            exit 1
          fi

      # Orchestration follows this workflow revision; the agent still builds the night.
      - name: Checkout publication controls
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage publication controls
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-control/scripts/lib"
          cp scripts/nightly-fix-issue.mjs scripts/nightly-fix-publication.mjs "$RUNNER_TEMP/nightly-control/scripts/"
          cp scripts/lib/linear-api.mjs "$RUNNER_TEMP/nightly-control/scripts/lib/"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The claim is the lock: an issue someone holds skips this run. issue.md
      # leads with tonight's failure, from the night's run, not the run that
      # filed it.
      - name: Claim the issue
        id: claim
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          NIGHTLY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.nightly_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-fix"
          set +e
          node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" claim --issue "$ISSUE" \
            --claimant "github-run:$GITHUB_RUN_ID" --run-url "$NIGHTLY_RUN_URL" \
            --issue-file "$RUNNER_TEMP/nightly-fix/issue.md"
          status=$?
          set -e
          case "$status" in
            0) echo "claimed=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "claimed=false" >> "$GITHUB_OUTPUT"
              echo "$ISSUE is already claimed; this run skips it." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac

      # github_token makes the agent's token this job's read-only GITHUB_TOKEN
      # instead of the Claude GitHub App's write token. The action's actor check
      # stays at its default: no allowed_bots, no allowed_non_write_users.
      - name: Run the fix agent
        id: agent
        if: steps.claim.outputs.claimed == 'true'
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        env:
          NIGHTLY_FIX_OUT: ${{ runner.temp }}/nightly-fix
          # The night's run failed the test: its artifacts are the evidence.
          NIGHTLY_FIX_RUN_ID: ${{ inputs.nightly_run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: /fix-nightly ${{ inputs.issue }}
          claude_args: |
            --max-turns 120
            --add-dir ${{ runner.temp }}/nightly-fix
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --disallowedTools "Bash(git push *),Bash(gh pr *),Bash(pnpm cassettes:record *),Bash(pnpm cassettes:proxy *)"

      - name: Hand off the commits
        id: handoff
        if: ${{ always() && steps.claim.outputs.claimed == 'true' }}
        env:
          BASE_SHA: ${{ inputs.head_sha }}
        run: |
          echo "patch_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          commits=$(git rev-list --count "$BASE_SHA..HEAD")
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          if [ "$commits" -gt 0 ]; then
            if [ ! -s "$RUNNER_TEMP/nightly-fix/pr.md" ]; then
              echo "::error::The fix agent made $commits commit(s) but wrote no pr.md."
              exit 1
            fi
            git bundle create "$RUNNER_TEMP/nightly-fix/fix.bundle" "$BASE_SHA..HEAD"
          fi

      - name: Upload the fix
        id: upload
        if: ${{ always() && steps.handoff.outputs.commits != '' && steps.handoff.outputs.commits != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fix--${{ inputs.issue }}
          path: |
            ${{ runner.temp }}/nightly-fix/fix.bundle
            ${{ runner.temp }}/nightly-fix/pr.md
          retention-days: 7
          if-no-files-found: error

      - name: Name the retained patch artifact
        if: steps.agent.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BASE_SHA: ${{ inputs.head_sha }}
          PATCH_SHA: ${{ steps.handoff.outputs.patch_sha }}
          CONTROL_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-publication.mjs" artifact

      - name: Retain the patch claim before publication queues
        if: steps.agent.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: >-
          node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" retain
          --issue "$ISSUE" --claimant "github-run:$GITHUB_RUN_ID"
          --receipt-file "$RUNNER_TEMP/nightly-fix/retained.json"

      - name: Post the evidence to Linear
        if: ${{ always() && steps.claim.outputs.claimed == 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          # This run, whose log holds the agent's session.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          evidence="$RUNNER_TEMP/nightly-fix/evidence.md"
          if [ ! -s "$evidence" ]; then
            printf 'The fix agent ended (%s) without writing evidence: %s\n' "$AGENT_OUTCOME" "$RUN_URL" > "$evidence"
          fi
          node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" comment --issue "$ISSUE" --body-file "$evidence"

  # Deterministic: pushes only nightly-fix/<issue>-<run>, opens the pull request
  # with `Fixes <issue>`, and never merges.
  publish:
    name: Open the fix PR for ${{ inputs.issue }}
    # One fresh count/create critical section for every issue/ref/run.
    concurrency:
      group: nightly-fix-publish
      queue: max
      cancel-in-progress: false
    needs: [fix]
    if: ${{ needs.fix.outputs.commits != '' && needs.fix.outputs.commits != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # The bundle builds on the night's commit, which a fetch of it needs.
      # Orchestration follows this workflow revision; the agent still builds the night.
      - name: Checkout publication controls
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage publication controls
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-control/scripts/lib"
          cp scripts/nightly-fix-issue.mjs scripts/nightly-fix-publication.mjs "$RUNNER_TEMP/nightly-control/scripts/"
          cp scripts/lib/linear-api.mjs "$RUNNER_TEMP/nightly-control/scripts/lib/"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The issue may have changed while this job waited for the global queue.
      - name: Verify retained ownership at publication admission
        id: verify-claim
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PATCH_SHA: ${{ needs.fix.outputs.patch_sha }}
          ARTIFACT_ID: ${{ needs.fix.outputs.artifact_id }}
        run: >-
          node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" verify
          --issue "$ISSUE" --claimant "github-run:$GITHUB_RUN_ID"
          --head-sha "$PATCH_SHA" --artifact-id "$ARTIFACT_ID"
          --repository "$GITHUB_REPOSITORY"

      - name: Reconcile the exact retained branch and PR
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BASE_SHA: ${{ inputs.head_sha }}
          PATCH_SHA: ${{ needs.fix.outputs.patch_sha }}
          CONTROL_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ needs.fix.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.fix.outputs.artifact_digest }}
        run: node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-publication.mjs" reconcile

      - name: Download the fix
        if: steps.reconcile.outputs.url == ''
        uses: actions/download-artifact@v8
        with:
          name: nightly-fix--${{ inputs.issue }}
          path: ${{ runner.temp }}/nightly-fix

      - name: Publish within the repository PR budget
        id: publication
        if: steps.reconcile.outputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BASE_SHA: ${{ inputs.head_sha }}
          PATCH_SHA: ${{ needs.fix.outputs.patch_sha }}
          CONTROL_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ needs.fix.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.fix.outputs.artifact_digest }}
        run: node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-publication.mjs" publish

      - name: Record the retained publication outcome
        if: ${{ always() && steps.publication.outputs.retained == 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: >-
          node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" retain
          --issue "$ISSUE" --claimant "github-run:$GITHUB_RUN_ID"
          --receipt-file "$RUNNER_TEMP/nightly-fix/retained.json"

      - name: Link the pull request on Linear
        if: ${{ always() && (steps.reconcile.outputs.url != '' || steps.publication.outputs.url != '') }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE: ${{ inputs.issue }}
          PR_URL: ${{ steps.reconcile.outputs.url || steps.publication.outputs.url }}
        run: node "$RUNNER_TEMP/nightly-control/scripts/nightly-fix-issue.mjs" link-pr --issue "$ISSUE" --pr-url "$PR_URL"
