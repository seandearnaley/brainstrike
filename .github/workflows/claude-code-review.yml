name: Claude Auto Review
on:
  pull_request_target:
    # One initial whole-PR review. No synchronize-triggered cold review loops.
    # Never close/reopen solely for review; use the targeted dispatch below.
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      focus:
        description: Targeted review scope or findings to verify (not a new whole-PR round)
        required: true
        type: string

jobs:
  review:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Both supported events execute default-branch orchestration. Never check
      # out a PR ref with these credentials, even into a second worktree.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact-head review request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/claude-review.mjs prepare

      - name: Run Claude auto-review
        id: claude-review
        if: ${{ steps.request.outputs.eligible == 'true' }}
        continue-on-error: true
        # Pin the action whose conclusion/OIDC skip behavior the reporter checks.
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.request.outputs.prompt }}
          claude_args: ${{ steps.request.outputs.claude_args }}

      - name: Report exact-head Claude review disposition
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_OUTCOME: ${{ steps.claude-review.outcome }}
          ACTION_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: node scripts/claude-review.mjs report
