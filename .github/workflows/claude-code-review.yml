# Cloud CI is disabled due to cost; repository GitHub Actions is disabled.
# Preserved workflow definition only: do not enable, dispatch, or rerun it.
# Test locally with pnpm check and report the commands and results.
# Tell the user: CI is disabled due to cost; validation must run locally.
# Stays disabled: per-PR hosted CI is off.

name: Claude Auto Review
on:
  pull_request:
    # One initial whole-PR review per layer. No synchronize-triggered cold
    # review loops. Never close/reopen solely for review; use the targeted
    # dispatch below. pull_request (not pull_request_target) is deliberate:
    # it runs from the PR merge commit for ANY base branch, so every layer of
    # a stack is reviewed against its own parent, and drafts are handled by
    # the job condition. pull_request_target would execute the intermediate
    # branch's workflow copy for stacked layers, and Anthropic's App token
    # exchange rejects its OIDC token regardless (claude-code-action#713).
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      focus:
        description: Targeted review scope or findings to verify (not a new whole-PR round)
        required: true
        type: string

jobs:
  review:
    # Drafts are reviewed when marked ready, not at open. Targeted dispatch
    # always runs. The pull_request clause is spelled out because GitHub
    # expressions coerce `null == false` to true — a bare `draft == false`
    # would admit any future trigger that lacks a pull_request payload.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request checks out the event's merge commit (PR head merged into
      # its base) — PR-authored code, including this file; see the trust model
      # in docs/agents/ci-quality.md. workflow_dispatch checks out the default
      # branch. Never check out the PR head separately with these credentials,
      # even into a second worktree.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact-head review request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/claude-review.mjs prepare

      # The review does not use anthropics/claude-code-action. Its only prompt
      # input is `prompt`, and action.yml carries that into the runner through
      # environment variables — PROMPT, and again JSON-escaped inside ALL_INPUTS —
      # where Linux caps a single variable at 128 KiB (MAX_ARG_STRLEN). Invoking
      # the CLI directly lets the prompt travel on stdin, which is a pipe and has
      # no size limit, so the ceiling is gone rather than budgeted around. It also
      # removes the App-token exchange and its OIDC allowlist from the picture
      # entirely (claude-code-action#713), instead of routing around them.
      - name: Install the pinned Claude Code CLI
        if: ${{ steps.request.outputs.eligible == 'true' }}
        run: npm install --global @anthropic-ai/claude-code@2.1.280

      # The OAuth token is the only secret in scope, and it reaches the CLI as its
      # own credential. The prompt is not here: it is a file, streamed to stdin by
      # the script. Nothing that scales with the PR is an argument or a variable.
      - name: Run Claude auto-review
        id: claude-review
        if: ${{ steps.request.outputs.eligible == 'true' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/claude-review.mjs run

      - name: Report exact-head Claude review disposition
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The step outcome only. The review text is read from disk by the
          # reporter, so no payload rides an environment variable in either
          # direction.
          ACTION_OUTCOME: ${{ steps.claude-review.outcome }}
        run: node scripts/claude-review.mjs report
