name: Nightly Linear Alert

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      results:
        required: true
        type: string
      # job=part part,...: the parts (shards) of a results job with more than one.
      parts:
        required: false
        type: string
        default: ''
      # BST-2235: the runner image of the lanes whose failing and flaky tests
      # get a fix agent (BST-2189) after the night. Set, Notify Linear uploads
      # the issues it filed or commented on as nightly-fix-issues, which
      # nightly-fix.yml reads from the nightly run once it completes. An
      # artifact name is unique within a run, so one workflow of the night sets it.
      fix_runs_on:
        required: false
        type: string
        default: ''
    secrets:
      LINEAR_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Notify Linear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Each test job uploads its Playwright JSON reports and job status as
      # nightly-results--<job>[--<part>], laid out <job>/<part>/
      # (scripts/lib/nightly-test-results.mjs). A workflow with no such artifact
      # leaves the directory empty: every red job is then filed on the
      # workflow-level issue.
      - name: Create the test results directory
        run: mkdir -p "$RUNNER_TEMP/nightly-results"
      # Every workflow nightly.yml calls shares one run and its artifacts
      # (BST-2233), so download only the results of the jobs this one reports.
      - name: Name this workflow's results artifacts
        id: results-artifacts
        env:
          RESULTS: ${{ inputs.results }}
        run: node scripts/nightly-results-artifacts.mjs --results "$RESULTS" >> "$GITHUB_OUTPUT"
      - name: Download nightly test results
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.results-artifacts.outputs.pattern }}
          path: ${{ runner.temp }}/nightly-results
      - name: File or update the Linear issues
        id: file
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RESULTS: ${{ inputs.results }}
          PARTS: ${{ inputs.parts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          node scripts/notify-linear-nightly.mjs
          --workflow "$WORKFLOW_NAME"
          --results "$RESULTS"
          --reports "$RUNNER_TEMP/nightly-results"
          --parts "$PARTS"
          --run-url "$RUN_URL"
          --sha "$HEAD_SHA"
      - name: Write the fix queue
        id: fix-queue
        if: inputs.fix_runs_on != ''
        env:
          FIX_ISSUES: ${{ steps.file.outputs.fix_issues }}
          RUNS_ON: ${{ inputs.fix_runs_on }}
        run: >-
          jq -c -n --arg runs_on "$RUNS_ON" --argjson issues "$FIX_ISSUES"
          '{runs_on: $runs_on, issues: $issues}' > "$RUNNER_TEMP/fix-issues.json"
      - name: Upload the fix queue
        if: inputs.fix_runs_on != ''
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fix-issues
          path: ${{ runner.temp }}/fix-issues.json
          retention-days: 7
          if-no-files-found: error
