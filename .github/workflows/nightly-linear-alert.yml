name: Nightly Linear Alert

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      results:
        required: true
        type: string
    secrets:
      LINEAR_API_KEY:
        required: true
    outputs:
      fix_issues:
        description: JSON array of the failing and flaky tests' issues this run filed or commented on, the nightly fix agent's queue (BST-2189).
        value: ${{ jobs.notify.outputs.fix_issues }}

permissions:
  contents: read

jobs:
  notify:
    name: Notify Linear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fix_issues: ${{ steps.file.outputs.fix_issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Each test job uploads its Playwright JSON reports as nightly-results--<job>[--<part>],
      # laid out <job>/<report>.json (scripts/lib/nightly-test-results.mjs). A workflow
      # with no such artifact leaves the directory empty: every red job is then filed
      # on the workflow-level issue.
      - name: Create the test results directory
        run: mkdir -p "$RUNNER_TEMP/nightly-results"
      - name: Download nightly test results
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-results--*
          path: ${{ runner.temp }}/nightly-results
      - name: File or update the Linear issues
        id: file
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RESULTS: ${{ inputs.results }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          node scripts/notify-linear-nightly.mjs
          --workflow "$WORKFLOW_NAME"
          --results "$RESULTS"
          --reports "$RUNNER_TEMP/nightly-results"
          --run-url "$RUN_URL"
          --sha "$HEAD_SHA"
