# Release runs are the owner's: only Sean tags, dispatches, signs or publishes.

name: Release

# Desktop release pipeline (manifest-last contract: apps/desktop/RELEASES.md).
#
# Trigger with a tag `v<version>` (SemVer: `v0.1.0`, or a beta `v0.1.0-beta.1`)
# that matches apps/desktop/package.json's version, or workflow_dispatch for a dry run
# (build + smoke + hash, no publish). Only a tag PUSH publishes: a dispatch,
# even on a tag ref, never does. The `unsigned` input builds the unsigned macOS
# posture although signing secrets exist, so a proof run signs nothing.
#
# Release commit (BST-2190): the `resolve` job runs first and every other job
# checks out the commit it resolves, never the triggering ref. A commit is
# releasable when, for every workflow in scripts/release-required-workflows.mjs,
# the latest completed run on main at it succeeded, scheduled or dispatched
# (scripts/resolve-release-sha.mjs reads that from the Actions API). A tag push
# judges the tagged commit, and a dispatch the `sha` input when given: a red or
# missing required workflow refuses the run and names each one, with no other
# commit tried. A dispatch with no `sha` builds the newest all-green main commit
# of the last 14 days, or fails saying so.
#
# Runner placement: Linux packaging runs on Ubicloud per the repo's cost
# direction. Ubicloud offers Linux (x64/arm64) only, so the macOS and Windows
# legs stay on GitHub-hosted runners — there is no Ubicloud option for them.
# The Ubicloud runner contract test (scripts/__tests__/
# ubicloud-runner-contract.test.mjs) deliberately constrains test.yml only.
# Each macOS arch builds on a runner of that arch, the Native Package Matrix's
# darwin targets (BST-2148): pnpm installs only the host's platform packages
# and node-gyp compiles for the host, so a cross-built x64 DMG shipped
# arm64-only addons. Linux x64 and arm64 do the same on Ubicloud runners of
# their arch (BST-2190). scripts/__tests__/release-workflow-contract.test.mjs
# pins the legs, one per target, to scripts/native-package-targets.mjs.
#
# Publication ordering (deliberate, do not reorder):
#   1. build + smoke-test + hash on every target OS
#   2. upload immutable assets to the public releases repo
#   3. verify every public URL answers
#   4. generate manifest v2 from the actual upload records
#   5. publish the manifest and the electron-updater metadata (latest*.yml)
#      LAST, then rebuild the download site
# Neither the manifest nor an updater can name an asset that is not already
# reachable.
#
# macOS code signing + notarization (BST-1627): each build-macos leg signs
# with the Developer ID Application identity in CSC_LINK (base64 .p12) +
# CSC_KEY_PASSWORD and notarizes through an App Store Connect API key
# (APPLE_API_KEY = .p8 contents, APPLE_API_KEY_ID, APPLE_API_ISSUER). The
# .p8 is materialised into a 0600 file under RUNNER_TEMP only for the
# packaging step because notarytool takes a key PATH. The "Verify signing
# evidence" step is the gate apps/desktop/RELEASES.md requires: when CSC_LINK is present
# the job fails unless the packaged app is Developer-ID signed, notarized
# (spctl source=Notarized Developer ID) and stapled; only when the secret is
# absent does the build fall back to the documented unsigned posture, with
# CSC_IDENTITY_AUTO_DISCOVERY=false so it can never be half-signed. The DMG
# itself is deliberately unsigned (electron-builder default; Gatekeeper
# assesses the stapled app inside it). Windows Authenticode is a later
# addition (Azure Trusted Signing) and ships unsigned for now.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build; it must have every required nightly green. Empty builds the newest all-green main commit.
        type: string
        required: false
        default: ""
      unsigned:
        description: Build the unsigned macOS posture even if signing secrets exist (a dispatch never publishes)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Default-deny for every step in this file: nothing may pick up a signing
  # identity by ambient keychain discovery. The `Package DMG` step overrides
  # this with the resolved posture, so a new macOS packaging step added later
  # inherits "never half-signed" rather than auto-discovery (#2960 review).
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  resolve:
    name: Resolve the release commit
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Listing workflow runs needs actions:read; this job writes nothing.
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # The workflow's own ref: the resolver that judges a commit comes from
      # this definition, not from the commit it judges.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the commit every required nightly passed
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIVEN_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push) ARGS=(--given "${GITHUB_REF}") ;;
            workflow_dispatch)
              if [[ -n "${GIVEN_SHA}" ]]; then
                ARGS=(--given "${GIVEN_SHA}")
              else
                ARGS=(--newest-green --lookback-days 14)
              fi
              ;;
            *) echo "::error::No release commit rule for event ${GITHUB_EVENT_NAME}."; exit 1 ;;
          esac
          RESOLVED=$(node scripts/resolve-release-sha.mjs "${ARGS[@]}")
          # An empty sha output would make every checkout below build the
          # triggering ref instead, so anything but one full SHA fails here.
          [[ "$RESOLVED" =~ ^sha=[0-9a-f]{40}$ ]] || { echo "::error::The resolver printed no commit SHA."; exit 1; }
          echo "$RESOLVED" >> "$GITHUB_OUTPUT"

  context:
    name: Release context
    needs: [ resolve ]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # The version is the resolved commit's: the one the legs package.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Resolve and assert the authoritative version
        id: resolve
        run: |
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          # The event, not only the ref: a dispatch on a tag ref is still a dry run.
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG}" != "v${PKG_VERSION}" ]]; then
              echo "::error::Tag ${TAG} does not match apps/desktop/package.json version ${PKG_VERSION}. One authoritative version, no exceptions."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v${PKG_VERSION}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [ resolve, context ]
    # One leg per arch, each on a runner OF that arch (BST-2148): the Native
    # Package Matrix's darwin targets (scripts/native-package-targets.mjs).
    runs-on: ${{ matrix.os }}
    # Build (~20 min) plus notarization, which now happens INSIDE this job. A
    # warm Team ID notarizes in minutes, but Apple's in-depth-analysis path can
    # take far longer, and macOS runners bill at 10x — so this bounds a stalled
    # `notarytool` wait rather than inheriting the 6-hour default (#2960 review).
    timeout-minutes: 90
    strategy:
      # Each leg's signing and addon evidence is its own verdict; one failing
      # leg must not cancel the other mid-notarization. Publish needs both.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "true"

      # As in the Native Package Matrix: the install above fetched this host's
      # platform packages and compiled the workspace addons for it, so the
      # host must be the DMG's target.
      - name: Assert the runner is the target
        env:
          TARGET: darwin-${{ matrix.arch }}
        run: |
          set -euo pipefail
          node -p "process.platform + '-' + process.arch + ' | node ' + process.version"
          test "$(node -p process.platform)-$(node -p process.arch)" = "$TARGET"

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --concurrency=4

      - name: Resolve signing posture
        id: signing
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          UNSIGNED_REQUESTED: ${{ inputs.unsigned == true }}
        run: |
          set -euo pipefail
          if [[ "$UNSIGNED_REQUESTED" == "true" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unsigned proof run (workflow_dispatch input): building the UNSIGNED macOS posture; no signing secret reaches the build."
          elif [[ "$HAS_CSC_LINK" == "true" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing posture: Developer ID + notarization (CSC_LINK present)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK is not configured; building the documented UNSIGNED macOS posture (apps/desktop/RELEASES.md)."
          fi

      - name: Materialise the notarization key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for NAME in APPLE_API_KEY_CONTENTS APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!NAME}" ]] || { echo "::error::CSC_LINK is set but ${NAME/_CONTENTS/} is missing; refusing a signed-but-unnotarized build."; exit 1; }
          done
          KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$KEY_FILE"
          # notarytool wants a PATH, but the secret holds the .p8 CONTENTS, so
          # APPLE_API_KEY reaches Package DMG through GITHUB_ENV as a path.
          # Do NOT "fix" the inconsistency by giving that step's env an
          # APPLE_API_KEY taken from the secret — that passes the contents
          # where a path is expected and fails only after a full build, with an
          # opaque notarization error (#2960 review). Never write a secrets
          # expression in a comment here either: Actions substitutes it before
          # bash runs, and the key's lines executed as commands.
          echo "APPLE_API_KEY=$KEY_FILE" >> "$GITHUB_ENV"

      # mac.icon is an Icon Composer asset (apps/desktop/build/icon.icon), and
      # electron-builder compiles it with actool, which must come from Xcode 26
      # or later. The runner's default Xcode is older, so the newest installed
      # Xcode 26+ is handed to Package DMG; with none installed the leg fails.
      - name: Select Xcode for the app icon
        id: xcode
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' ! -iname '*beta*' ! -iname '*release_candidate*' | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 26 or later on this runner; the macOS icon needs its actool."
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            exit 1
          fi
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcrun actool --version | grep -A1 short-bundle-version
          echo "developer-dir=$XCODE/Contents/Developer" >> "$GITHUB_OUTPUT"

      - name: Package DMG
        env:
          ARCH: ${{ matrix.arch }}
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}
          # Credentials reach only a signed build, so an unsigned proof run on a
          # repository that has them configured signs and notarizes nothing.
          CSC_LINK: ${{ steps.signing.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # The zip is electron-updater's macOS payload; the DMG is the download.
        run: pnpm --filter @brainstrike/desktop run dist --mac dmg zip --"$ARCH" --publish never

      - name: Remove the notarization key
        if: always() && steps.signing.outputs.signed == 'true'
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Verify signing evidence
        env:
          ARCH: ${{ matrix.arch }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          cd apps/desktop/release

          # One unmount path for every exit, including `set -e` deaths inside a
          # check: four of the five checks used to detach by hand and the
          # remaining one leaked the volume (#2960 review). -force because a
          # transient mds/Spotlight hold must not fail a release whose signing
          # evidence already verified.
          MOUNT=""
          cleanup() {
            if [[ -n "$MOUNT" ]]; then
              hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
              MOUNT=""
            fi
          }
          trap cleanup EXIT

          fail() { echo "::error::$1"; exit 1; }

          DMG="Brainstrike-${VERSION}-macos-${ARCH}.dmg"
          [[ -f "$DMG" ]] || fail "missing ${DMG}"

          # `| awk '…exit'` and `| head -1` both close the pipe early, which
          # under `set -o pipefail` can kill the job on SIGPIPE with no
          # diagnostic — an intermittent failure, since it is a race (#2960
          # review). Capture first, then parse; -print -quit needs no pipe.
          ATTACH=$(hdiutil attach "$DMG" -nobrowse -readonly)
          MOUNT=$(awk -F'\t' '/\/Volumes\//{print $NF}' <<<"$ATTACH" | tail -1)
          [[ -n "$MOUNT" ]] || fail "${DMG}: hdiutil attach reported no /Volumes mount point"
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$APP" ]] || fail "${DMG}: no .app found at the root of the mounted image"

          if [[ "$SIGNED" == "true" ]]; then
            echo "== ${DMG}: signing evidence"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dvv "$APP" 2>&1 | grep -E '^Authority=Developer ID Application:' \
              || fail "${DMG}: app is not signed with a Developer ID Application identity"

            # Hardened runtime is the `runtime` CODE-SIGNING FLAG, not an
            # entitlement. The previous check grepped the entitlements for
            # `disable-library-validation`, which an app signed WITHOUT
            # hardened runtime also carries — verified: such a binary reports
            # flags=0x0(none) and passed the old check (#2960 review).
            codesign -dvv "$APP" 2>&1 | grep -qE '^CodeDirectory .*flags=0x[0-9a-f]*10000( |\()' \
              || fail "${DMG}: hardened runtime is not enabled (no 'runtime' flag in the code signature)"

            # Prove entitlements were APPLIED at all: a misconfigured
            # `entitlementsInherit` signs a runnable-looking app with none,
            # and Electron then dies on first JIT. `allow-jit` is the right
            # probe because removing it breaks the app, so it can never be a
            # deliberate future improvement — unlike the weakening
            # `disable-library-validation` this step used to REQUIRE (#2960
            # review). The exact set is pinned by the desktop package's own
            # tests, not re-pinned here, so the plist stays free to change.
            # `--entitlements -` already emits XML (`--xml` is redundant on
            # current codesign); stderr is kept so a failed invocation is
            # distinguishable from "entitlement absent".
            ENTITLEMENTS=$(codesign -d --entitlements - "$APP" 2>&1) \
              || fail "${DMG}: could not read entitlements from the signed app"
            grep -q 'com\.apple\.security\.cs\.allow-jit' <<<"$ENTITLEMENTS" \
              || fail "${DMG}: signed app carries no allow-jit entitlement, so entitlements were not applied"

            xcrun stapler validate "$APP" || fail "${DMG}: notarization ticket is not stapled to the app"
            ASSESS=$(spctl -a -t exec -vv "$APP" 2>&1 || true)
            echo "$ASSESS"
            grep -q 'source=Notarized Developer ID' <<<"$ASSESS" \
              || fail "${DMG}: Gatekeeper does not report a notarized Developer ID app"

            # The update payload carries the same app: Squirrel.Mac refuses an
            # update whose signature does not verify, so check the zip's copy.
            ZIP="Brainstrike-${VERSION}-macos-${ARCH}.zip"
            [[ -f "$ZIP" ]] || fail "missing ${ZIP}"
            UNZIPPED="$RUNNER_TEMP/update-zip-${ARCH}"
            rm -rf "$UNZIPPED"
            ditto -x -k "$ZIP" "$UNZIPPED"
            ZIP_APP=$(find "$UNZIPPED" -maxdepth 1 -name '*.app' -print -quit)
            [[ -n "$ZIP_APP" ]] || fail "${ZIP}: no .app at the root of the archive"
            codesign --verify --deep --strict "$ZIP_APP" || fail "${ZIP}: app signature does not verify"
            xcrun stapler validate "$ZIP_APP" || fail "${ZIP}: notarization ticket is not stapled to the app"
          else
            echo "== ${DMG}: UNSIGNED posture; asserting no half-signed identity"
            if codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Developer ID'; then
              fail "${DMG}: app carries a Developer ID signature although the posture is unsigned; posture is inconsistent"
            fi
          fi

      - name: Smoke-test the packaged app
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          cd apps/desktop/release
          ls -la ./*.dmg
          DMG="Brainstrike-${VERSION}-macos-${ARCH}.dmg"
          [[ -f "$DMG" ]] || { echo "::error::missing ${DMG}"; exit 1; }
          # The volume is "Brainstrike <version>": every path below
          # is quoted or passed as a value, never word-split.
          ATTACH=$(hdiutil attach "$DMG" -nobrowse -readonly)
          MOUNT=$(awk -F'\t' '/\/Volumes\//{print $NF}' <<<"$ATTACH" | tail -1)
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$APP" ]] || { echo "::error::${DMG}: no .app at the root of the mounted image"; hdiutil detach "$MOUNT" -force; exit 1; }
          BIN="$APP/Contents/MacOS/$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          # The Electron shell binary matches the requested arch by
          # construction (per-arch dist download). The native addons come from
          # this runner's install, so every addon the app can load must carry
          # the DMG's arch (BST-2148).
          # Capture, then match: `| grep -q` under pipefail can die on SIGPIPE.
          BIN_ARCHS=$(lipo -archs "$BIN")
          if [[ " ${BIN_ARCHS} " != *" ${ARCH/x64/x86_64} "* ]] \
            || ! node ../scripts/verify-macos-addon-archs.mjs "$APP" "$ARCH"; then
            echo "::error::${DMG}: the app or a native addon is not ${ARCH}"
            hdiutil detach "$MOUNT" -force
            exit 1
          fi
          # Every leg runs on its own arch, so every DMG answers natively.
          # main-bootstrap.ts handles --version explicitly (packaged Electron
          # apps have no default handler) and exits before any GUI or host work.
          OUT=$("$BIN" --version 2>/dev/null | tail -1 || true)
          echo "${DMG} --version => ${OUT}"
          [[ "$OUT" == *"$VERSION"* ]] || { echo "::error::${DMG} did not report version ${VERSION}"; hdiutil detach "$MOUNT" -force; exit 1; }
          hdiutil detach "$MOUNT" -force

      - name: Record asset metadata
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-records
          # One record file per leg: the publish job merges every build
          # artifact into one directory, where a shared name would overwrite.
          # shellcheck disable=SC2016 # node -e source: JS template literals, not shell
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, statSync, writeFileSync } = require("node:fs");
            const [version, arch] = process.argv.slice(1);
            const name = `Brainstrike-${version}-macos-${arch}.dmg`;
            const file = `apps/desktop/release/${name}`;
            const records = [{
              name,
              sizeBytes: statSync(file).size,
              sha256: createHash("sha256").update(readFileSync(file)).digest("hex"),
              platform: "macos",
              architecture: arch,
              package: "dmg",
            }];
            writeFileSync(`release-records/macos-${arch}.json`, JSON.stringify(records, null, 2));
            console.log(JSON.stringify(records, null, 2));
          ' "$VERSION" "$ARCH"
          # Both legs write latest-mac.yml naming only their own arch; the
          # publish job merges them (scripts/release-update-info.mjs).
          mv apps/desktop/release/latest-mac.yml "apps/desktop/release/latest-mac-${ARCH}.yml"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac-${{ matrix.arch }}.yml
            release-records/macos-${{ matrix.arch }}.json
          retention-days: 3
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs: [ resolve, context ]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "true"

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --concurrency=4

      - name: Package NSIS installer
        run: pnpm --filter @brainstrike/desktop run dist --win nsis --x64 --publish never

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $Version = "${{ needs.context.outputs.version }}"
          $Installer = "apps/desktop/release/Brainstrike-$Version-windows-x64.exe"
          if (-not (Test-Path $Installer)) { Write-Error "missing $Installer"; exit 1 }
          $proc = Start-Process -FilePath (Resolve-Path $Installer) -ArgumentList "/S" -PassThru
          if (-not $proc.WaitForExit(300000)) { Write-Error "silent install timed out"; exit 1 }
          if ($proc.ExitCode -ne 0) { Write-Error "silent install exited $($proc.ExitCode)"; exit 1 }
          $App = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -eq "Brainstrike.exe" } | Select-Object -First 1
          if (-not $App) { Write-Error "installed executable not found under LOCALAPPDATA\Programs"; exit 1 }
          Write-Host "installed app: $($App.FullName)"

      - name: Record asset metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.context.outputs.version }}"
          mkdir -p release-records
          # shellcheck disable=SC2016 # node -e source: JS template literals, not shell
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, statSync, writeFileSync } = require("node:fs");
            const version = process.argv[1];
            const name = `Brainstrike-${version}-windows-x64.exe`;
            const file = `apps/desktop/release/${name}`;
            const records = [{
              name,
              sizeBytes: statSync(file).size,
              sha256: createHash("sha256").update(readFileSync(file)).digest("hex"),
              platform: "windows",
              architecture: "x64",
              package: "nsis",
            }];
            writeFileSync("release-records/windows.json", JSON.stringify(records, null, 2));
            console.log(JSON.stringify(records, null, 2));
          ' "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            release-records/windows.json
          retention-days: 3
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [ resolve, context ]
    # One leg per arch, each on a Ubicloud runner OF that arch, the Native
    # Package Matrix's linux targets (scripts/native-package-targets.mjs): as on
    # macOS, pnpm installs only the host's platform packages and node-gyp
    # compiles for the host. ubicloud-standard-4-arm is the 4-vCPU/12-GB Arm
    # shape; the 2-vCPU one has 6 GB (docs/superpowers/research/
    # 2026-08-28-ubicloud-github-actions-runners.md).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      # Each leg's smoke and addons are its own verdict. Publish needs both.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubicloud-standard-4
          - arch: arm64
            runner: ubicloud-standard-4-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "true"

      - name: Assert the runner is the target
        env:
          TARGET: linux-${{ matrix.arch }}
        run: |
          set -euo pipefail
          node -p "process.platform + '-' + process.arch + ' | node ' + process.version"
          test "$(node -p process.platform)-$(node -p process.arch)" = "$TARGET"

      - name: Build desktop dependency graph
        run: pnpm turbo run build --filter=@brainstrike/desktop... --concurrency=4

      # linux.artifactName pins the x64 literal: electron-builder's ${arch}
      # macro names an x64 AppImage x86_64 (builder-util getArtifactArchName).
      # Each leg overrides it with its own arch; ${version} and ${ext} stay
      # electron-builder macros (pnpm quotes the forwarded argument).
      - name: Package AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # shellcheck disable=SC2016 # electron-builder macros, not shell
          pnpm --filter @brainstrike/desktop run dist --linux AppImage --"$ARCH" --publish never \
            --config.linux.artifactName='Brainstrike-${version}-linux-'"$ARCH"'.${ext}'

      - name: Smoke-test AppImage
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          APPIMAGE="apps/desktop/release/Brainstrike-${VERSION}-linux-${ARCH}.AppImage"
          [[ -f "$APPIMAGE" ]] || { echo "::error::missing ${APPIMAGE}"; exit 1; }
          chmod +x "$APPIMAGE"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          # Extract first: --appimage-extract-and-run prints every extracted
          # path to stdout ahead of the app's own output. stderr is kept, so a
          # failed launch shows why.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          STDERR="$RUNNER_TEMP/appimage-version.stderr"
          STATUS=0
          OUT=$(xvfb-run -a "$RUNNER_TEMP/squashfs-root/AppRun" --no-sandbox --version 2>"$STDERR") || STATUS=$?
          echo "AppImage --version => ${OUT} (exit ${STATUS})"
          if [[ "$OUT" != *"$VERSION"* ]]; then
            echo "::error::AppImage did not report version ${VERSION}"
            tail -n 40 "$STDERR"
            exit 1
          fi

      - name: Record asset metadata
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-records
          # One record file per leg: the publish job merges every build
          # artifact into one directory, where a shared name would overwrite.
          # shellcheck disable=SC2016 # node -e source: JS template literals, not shell
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, statSync, writeFileSync } = require("node:fs");
            const [version, arch] = process.argv.slice(1);
            const name = `Brainstrike-${version}-linux-${arch}.AppImage`;
            const file = `apps/desktop/release/${name}`;
            const records = [{
              name,
              sizeBytes: statSync(file).size,
              sha256: createHash("sha256").update(readFileSync(file)).digest("hex"),
              platform: "linux",
              architecture: arch,
              package: "appimage",
            }];
            writeFileSync(`release-records/linux-${arch}.json`, JSON.stringify(records, null, 2));
            console.log(JSON.stringify(records, null, 2));
          ' "$VERSION" "$ARCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux*.yml
            release-records/linux-${{ matrix.arch }}.json
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish release + manifest
    needs: [ resolve, context, build-macos, build-windows, build-linux ]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history and tags: the release notes cover the commits since the
      # previous release tag.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: staging

      - name: Stage assets and checksums
        id: stage
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          # Not assets/: the checkout has its own (assets/icons).
          mkdir -p release-assets update-info release-records
          # -n: a filename collision across build artifacts must surface as a
          # missing file in the checks below, never a silent overwrite.
          find staging -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.blockmap' \) -exec mv -n {} release-assets/ \;
          find staging -type f -name 'latest*.yml' -exec mv -n {} update-info/ \;
          find staging -name '*.json' -path '*release-records*' -exec mv -n {} release-records/ \;
          # One latest-mac.yml names both arches; the updater picks its own.
          node scripts/release-update-info.mjs merge-mac \
            update-info/latest-mac-arm64.yml update-info/latest-mac-x64.yml > update-info/latest-mac.yml
          rm update-info/latest-mac-arm64.yml update-info/latest-mac-x64.yml
          ls -la release-assets update-info release-records
          # Downloads (DMG, EXE, AppImage) and macOS update payloads (zip),
          # by exact name; blockmaps only speed updates up, so whichever
          # electron-builder wrote are published as found.
          for NAME in \
            "Brainstrike-${VERSION}-macos-arm64.dmg" "Brainstrike-${VERSION}-macos-x64.dmg" \
            "Brainstrike-${VERSION}-macos-arm64.zip" "Brainstrike-${VERSION}-macos-x64.zip" \
            "Brainstrike-${VERSION}-windows-x64.exe" \
            "Brainstrike-${VERSION}-linux-x64.AppImage" "Brainstrike-${VERSION}-linux-arm64.AppImage"; do
            [[ -f "release-assets/${NAME}" ]] || { echo "::error::missing asset ${NAME}"; exit 1; }
          done
          for NAME in latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml; do
            [[ -f "update-info/${NAME}" ]] || { echo "::error::missing update metadata ${NAME}"; exit 1; }
          done
          # Every file an updater may fetch must be one of these assets, with
          # the size and sha512 the metadata declares.
          node scripts/release-update-info.mjs verify --version "$VERSION" --assets release-assets update-info/*.yml
          cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Cross-check staged digests against build records
        run: |
          set -euo pipefail
          # The manifest digests come from the build runners' records; the
          # published SHA256SUMS comes from the staged files. They must agree,
          # or an artifact was corrupted in the upload/download round-trip.
          # shellcheck disable=SC2016 # node -e source: JS template literals, not shell
          node -e '
            const { readFileSync, readdirSync } = require("node:fs");
            const sums = new Map(
              readFileSync("release-assets/SHA256SUMS", "utf8")
                .trim()
                .split("\n")
                .map((line) => {
                  const [sha, name] = line.split(/\s+/);
                  return [name, sha];
                })
            );
            let failures = 0;
            for (const file of readdirSync("release-records")) {
              for (const record of JSON.parse(readFileSync(`release-records/${file}`, "utf8"))) {
                const staged = sums.get(record.name);
                if (staged !== record.sha256) {
                  console.error(`::error::${record.name}: record sha256 ${record.sha256} != staged ${staged ?? "(missing)"}`);
                  failures += 1;
                }
              }
            }
            if (failures > 0) { process.exit(1); }
            console.log(`${sums.size - 1} assets cross-checked against build records.`);
          '

      - name: Find the previous release tag
        id: previous
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # The nearest release tag behind this commit; none means the first release.
          if git tag --merged "${SOURCE_COMMIT}^" --list 'v[0-9]*' | grep -q .; then
            echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${SOURCE_COMMIT}^")" >> "$GITHUB_OUTPUT"
          fi

      # Release notes are the conventional-commit PR titles since that tag,
      # grouped by cliff.toml. The GitHub release body is their one home: the
      # download site links to it, and its owner may edit it after publishing.
      - name: Generate release notes
        if: steps.previous.outputs.tag != ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --strip all ${{ steps.previous.outputs.tag }}..${{ needs.resolve.outputs.sha }}
        env:
          OUTPUT: ${{ runner.temp }}/changes.md

      - name: Create release in the public binaries repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [[ -n "$PREVIOUS_TAG" ]]; then
              cat "$RUNNER_TEMP/changes.md"
            else
              echo "The first beta of Brainstrike."
            fi
            echo
            echo "Downloads: macOS (Apple silicon and Intel DMG, signed and notarized), Windows (x64 installer, not yet code-signed) and Linux (x64 and arm64 AppImage). Verify any download against SHA256SUMS. Source commit: ${SOURCE_COMMIT}."
          } > "$NOTES"
          cat "$NOTES"
          # A prerelease version is a GitHub prerelease: stable installs never
          # update to it, and beta installs follow it (electron-updater's
          # allowPrerelease follows the running version).
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          # view-or-create keeps this job resumable: any downstream step (URL
          # probe, manifest) can fail on its own, and a rerun must retry rather
          # than die on an existing release.
          gh release view "$TAG" --repo seandearnaley/brainstrike-releases >/dev/null 2>&1 \
            || gh release create "$TAG" \
              --repo seandearnaley/brainstrike-releases \
              --title "Brainstrike ${VERSION}" \
              --notes-file "$NOTES" \
              "${PRERELEASE[@]}"

      - name: Upload assets not yet published
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          set -euo pipefail
          # A published asset is never replaced or deleted. A full rerun
          # re-signs the DMGs, so their bytes differ from the digests the live
          # manifest names. release-asset-plan.mjs keeps an asset whose published
          # sha256 equals this run's (a rerun after a partial failure resumes),
          # lists the missing ones, and fails before any upload when a published
          # asset holds different bytes: those need a new version tag.
          PUBLISHED="$RUNNER_TEMP/published-assets.json"
          gh api "repos/seandearnaley/brainstrike-releases/releases/tags/${TAG}" --jq '.assets' > "$PUBLISHED"
          UPLOAD=$(node scripts/release-asset-plan.mjs --remote "$PUBLISHED" release-assets/*)
          if [[ -z "$UPLOAD" ]]; then
            echo "Every asset is already published with this run's bytes."
            exit 0
          fi
          FILES=()
          while IFS= read -r FILE; do FILES+=("$FILE"); done <<<"$UPLOAD"
          gh release upload "$TAG" "${FILES[@]}" --repo seandearnaley/brainstrike-releases

      - name: Verify every public asset URL
        run: |
          set -euo pipefail
          TAG="${{ needs.context.outputs.tag }}"
          for FILE in release-assets/*; do
            NAME=$(basename "$FILE")
            URL="https://github.com/seandearnaley/brainstrike-releases/releases/download/${TAG}/${NAME}"
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
            echo "${CODE} ${URL}"
            [[ "$CODE" == "200" ]] || { echo "::error::${URL} answered ${CODE}"; exit 1; }
          done

      - name: Generate manifest from upload records
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          node scripts/generate-release-manifest.mjs \
            --tag "${{ needs.context.outputs.tag }}" \
            --source-commit "${SOURCE_COMMIT}" \
            --records-dir release-records \
            --out release-manifest.json
          cat release-manifest.json

      - name: Publish the manifest and update metadata last
        # Manifest-last (apps/desktop/RELEASES.md): every asset above is
        # uploaded and answered 200 before the files that name it exist. The
        # download site (seandearnaley/brainstrike.ai) reads the manifest and
        # validates it before rendering links; installed apps read latest*.yml.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          set -euo pipefail
          # The assets' rule applies: a published manifest is never replaced.
          # It carries publishedAt, so publishing this tag again refuses here.
          PUBLISHED="$RUNNER_TEMP/published-assets.json"
          gh api "repos/seandearnaley/brainstrike-releases/releases/tags/${TAG}" --jq '.assets' > "$PUBLISHED"
          UPLOAD=$(node scripts/release-asset-plan.mjs --remote "$PUBLISHED" update-info/*.yml release-manifest.json)
          if [[ -z "$UPLOAD" ]]; then
            echo "The manifest and update metadata are already published with these bytes."
            exit 0
          fi
          FILES=()
          while IFS= read -r FILE; do FILES+=("$FILE"); done <<<"$UPLOAD"
          gh release upload "$TAG" "${FILES[@]}" --repo seandearnaley/brainstrike-releases

      - name: Rebuild the download site
        env:
          VERCEL_SITE_DEPLOY_HOOK: ${{ secrets.VERCEL_SITE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          # brainstrike.ai renders its links from the newest manifest at build time.
          [[ -n "$VERCEL_SITE_DEPLOY_HOOK" ]] \
            || { echo "::error::VERCEL_SITE_DEPLOY_HOOK is not configured, so brainstrike.ai still lists the previous release."; exit 1; }
          curl -fsS -X POST "$VERCEL_SITE_DEPLOY_HOOK" > /dev/null
