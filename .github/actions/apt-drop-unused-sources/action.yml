name: Drop unused apt sources
description: >-
  BST-1715. Remove the runner image's Google Chrome apt source before any Linux
  step runs apt (directly, or via `playwright install-deps`). Callers MUST check
  out first — a local composite action is resolved off the runner's filesystem
  before any of its steps run.
# ONE mechanism, many call sites. `setup-workspace` is deliberately NOT the home
# for this: an explicit step immediately ahead of each apt site (in a workflow
# job, or inside a composite such as linux-desktop-test-host) is the ordering
# that is readable at the call site and checkable by a contract test.
runs:
  using: composite
  steps:
    # Windows/macOS callers do not exist today, but the guard is a Linux/apt
    # concept and the script exits non-zero without apt-get rather than
    # pretending to have run. Gating here keeps that honest.
    #
    # The script is addressed through the GITHUB_ACTION_PATH environment
    # variable, not the `github.action_path` context. In a `container:` job
    # (Web E2E, Performance E2E) the context still holds the HOST path
    # (/home/runner/work/...), which is not mounted in the container, so the
    # step died with exit 127 "No such file or directory" (actions/runner#716,
    # run 39029252932). The runner translates the environment variable to the
    # container's mount (/__w/...), and on a plain runner both are the same path.
    - if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: '"$GITHUB_ACTION_PATH/drop-unused-sources.sh"'
