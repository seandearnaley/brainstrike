name: 'Setup Playwright Runtime'
description: 'Cache, install, and verify Playwright browser runtime on the GitHub-hosted runner.'

inputs:
  browsers:
    description: 'Browsers to install for this lane.'
    required: false
    default: 'chromium'

runs:
  using: 'composite'
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        set -euo pipefail
        echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
        version="$(pnpm exec playwright --version | awk '{print $2}')"
        if [ -z "$version" ]; then
          echo "Unable to resolve Playwright version." >&2
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-v2-${{ steps.playwright-version.outputs.version }}-${{ inputs.browsers }}
        restore-keys: |
          ${{ runner.os }}-playwright-v2-${{ steps.playwright-version.outputs.version }}-
          ${{ runner.os }}-playwright-v2-

    - name: Install Playwright runtime
      shell: bash
      env:
        PLAYWRIGHT_INSTALL_BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        read -r -a requested_browsers <<< "$PLAYWRIGHT_INSTALL_BROWSERS"
        if [ "${#requested_browsers[@]}" -eq 0 ]; then
          echo "At least one Playwright browser must be requested." >&2
          exit 1
        fi
        for browser in "${requested_browsers[@]}"; do
          case "$browser" in
            chromium|chromium-headless-shell|firefox|webkit|chrome|chrome-beta|msedge|msedge-beta) ;;
            *)
              echo "Unsupported Playwright browser: $browser" >&2
              exit 1
              ;;
          esac
        done
        pnpm exec playwright install --with-deps "${requested_browsers[@]}"

    - name: Verify Playwright runtime
      shell: bash
      env:
        PLAYWRIGHT_VERIFY_BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        pnpm exec playwright --version
        node <<'NODE'
        const { chromium, firefox, webkit } = require('playwright');

        const launchTargets = {
          chromium: [chromium, {}],
          'chromium-headless-shell': [chromium, {}],
          firefox: [firefox, {}],
          webkit: [webkit, {}],
          chrome: [chromium, { channel: 'chrome' }],
          'chrome-beta': [chromium, { channel: 'chrome-beta' }],
          msedge: [chromium, { channel: 'msedge' }],
          'msedge-beta': [chromium, { channel: 'msedge-beta' }],
        };

        const requestedBrowsers = (process.env.PLAYWRIGHT_VERIFY_BROWSERS ?? '')
          .split(/\s+/)
          .filter(Boolean);

        (async () => {
          for (const browserName of requestedBrowsers) {
            const target = launchTargets[browserName];
            if (!target) {
              throw new Error(`Unsupported Playwright browser: ${browserName}`);
            }
            const [browserType, launchOptions] = target;
            const browser = await browserType.launch({ headless: true, ...launchOptions });
            await browser.close();
          }
        })().catch((error) => {
          console.error(error);
          process.exit(1);
        });
        NODE
