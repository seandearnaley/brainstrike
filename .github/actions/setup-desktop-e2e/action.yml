name: 'Setup Desktop E2E'
description: 'Common setup for desktop Electron E2E tests: downloads pre-built dist, verifies preprovisioned Electron runtime deps, and builds workspace dependencies via Turbo remote cache.'

runs:
  using: 'composite'
  steps:
    - name: Download desktop dist
      uses: actions/download-artifact@v8
      with:
        name: desktop-dist
        path: apps/desktop/dist/

    - name: Verify preprovisioned Electron runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        command -v Xvfb >/dev/null
        command -v ldd >/dev/null
        cd apps/desktop
        ELECTRON_BINARY="$(node -p "require('electron')")"
        echo "Electron binary: ${ELECTRON_BINARY}"
        ldd "${ELECTRON_BINARY}" | tee /tmp/electron-ldd.txt
        if grep -q "not found" /tmp/electron-ldd.txt; then
          echo "ERROR: Electron runtime dependencies are missing from the CI image." >&2
          exit 1
        fi

    - name: Build workspace dependencies (Turbo remote cache hit from prepare-desktop)
      shell: bash
      run: pnpm run build --filter @brainstrike/desktop
