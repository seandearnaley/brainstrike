name: 'Setup Desktop E2E'
description: 'Common setup for desktop Electron E2E tests: downloads pre-built dist, installs Xvfb and Playwright system deps, and builds workspace dependencies via Turbo remote cache.'

runs:
  using: 'composite'
  steps:
    - name: Download desktop dist
      uses: actions/download-artifact@v8
      with:
        name: desktop-dist
        path: apps/desktop/dist/

    - name: Install system dependencies for Electron
      shell: bash
      run: |
        set -euo pipefail
        APT_OPTIONS=(
          -o Acquire::Retries=2
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o APT::Update::Error-Mode=any
        )
        timeout 120s sudo apt-get update "${APT_OPTIONS[@]}"
        timeout 120s sudo apt-get install -y --no-install-recommends xvfb

    - name: Install Playwright system dependencies
      shell: bash
      run: timeout 300s pnpm exec playwright install-deps chromium

    - name: Build workspace dependencies (Turbo remote cache hit from prepare-desktop)
      shell: bash
      run: pnpm run build --filter @brainstrike/desktop
